.pc-mais{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;border-radius:6px;}
.pc-mais:hover{color:var(--accent);background:var(--surface);}
.pc-info{font-size:12px;color:var(--muted);line-height:1.4;}
.pc-campo{display:grid;grid-template-columns:82px 1fr;align-items:start;gap:8px;}
.pc-campo>span{font-size:11px;color:var(--faint);padding-top:7px;}
.pc-inp{width:100%;font:inherit;font-size:13.5px;line-height:1.45;color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 7px;resize:none;overflow:hidden;}
.pc-inp:hover{border-color:var(--border);}
.pc-inp:focus{outline:none;border-color:var(--accent);background:var(--input);}
.pc-inp::placeholder{color:var(--faint);}
.pc-sel{font:inherit;font-size:13px;font-weight:500;color:var(--text);background:color-mix(in srgb, var(--c, #a1a1aa) 22%, var(--surface));border:1px solid color-mix(in srgb, var(--c, #a1a1aa) 60%, transparent);border-radius:20px;padding:4px 10px;max-width:100%;}
.pc-nejul{font-size:12.5px;line-height:1.45;background:color-mix(in srgb, #f97316 12%, var(--surface));border:1px solid #f9731655;border-radius:9px;padding:8px 10px;color:var(--text);}
.pc-nejul-b{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.copybtn{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:7px;font-size:11.5px;padding:1px 7px;line-height:1.6;white-space:nowrap;}
.copybtn:hover{color:var(--accent);border-color:var(--accent);}
.copybtn.ok{color:#10b981;border-color:#10b981;}
.minibtn{background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:8px;font-size:12px;font-weight:500;padding:5px 10px;}
.minibtn.forte{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.sitchip{font-size:11px;font-weight:500;color:var(--text);background:color-mix(in srgb, var(--c) 22%, transparent);border:1px solid color-mix(in srgb, var(--c) 55%, transparent);border-radius:20px;padding:0 8px;white-space:nowrap;}
.avisos{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:14px;}
.avisos-h{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.aviso{border-top:1px solid var(--border);padding:9px 0;}
.aviso-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.aviso-txt{font-size:13px;color:var(--text);margin:4px 0 6px;line-height:1.45;}
.aviso-b{display:flex;gap:6px;flex-wrap:wrap;}
.aviso.t-saiu .aviso-txt,.aviso.t-devolvido .aviso-txt{color:var(--accent);font-weight:500;}
.pecard{width:520px;}
.pe-info{font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:12px;}
.pe-nejul{font-size:12.5px;color:var(--muted);margin:4px 0 10px;}
.pe-nejul summary{cursor:pointer;color:var(--accent);}
.pe-nejul div{white-space:pre-wrap;line-height:1.5;margin-top:6px;max-height:200px;overflow:auto;background:var(--surface2);border-radius:8px;padding:8px;}
.fortesw input{width:17px;height:17px;accent-color:var(--accent);}
/* filas (para sentenciar / despachar) */
.filarow{display:flex;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.filarow:hover{background:var(--surface);}
.fila-dias{flex:none;width:64px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;text-align:center;}
.fila-dias b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;}
.fila-dias span{font-size:9.5px;color:var(--muted);line-height:1.2;}
.fila-dias.medio{border-color:#f59e0b;background:color-mix(in srgb, #f59e0b 14%, var(--surface));}
.fila-dias.alto{border-color:#ef4444;background:color-mix(in srgb, #ef4444 16%, var(--surface));}
.fila-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.fila-pend{font-size:13px;color:var(--text);}
.fila-pend b{font-weight:500;color:var(--accent);}
.fila-obs{font-size:12.5px;color:var(--muted);line-height:1.45;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
/* entregues */
.entmes{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:14px;}
.entmes-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;}
.entmes-h span{font-size:12.5px;color:var(--muted);}
.entmes-tot{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px;}
.entmes-tot b{color:var(--text);font-weight:500;}
.entsub{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 4px;}
.entrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.ent-main{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer;}
.ent-data{font-size:11.5px;color:var(--faint);}
.ent-c{font:inherit;font-size:12px;background:var(--input);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:3px 5px;}
.ent-val{font-size:13px;font-variant-numeric:tabular-nums;min-width:86px;text-align:right;}
.ent-ass{background:var(--surface);border:1px solid var(--border2);color:var(--muted);border-radius:20px;font-size:11.5px;font-weight:500;padding:3px 10px;}
.ent-ass.on{color:#10b981;border-color:#10b98188;}
/* audiências */
.audrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);border-left:3px solid #2F6FE4;margin-bottom:6px;cursor:pointer;}
.audrow:hover{background:var(--surface);}
.audrow.conflito{border-left-color:#f59e0b;}
.aud-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.aud-top{display:flex;align-items:center;gap:6px;}
.aud-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.aud-fonte{font-size:10.5px;color:var(--faint);}
.aud-conf{font-size:10.5px;font-weight:500;color:#231a05;background:#f59e0b;border-radius:20px;padding:0 7px;}
/* colar painéis */
.colar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:1000px){ .colar-grid{grid-template-columns:1fr;} }
.colar-cx{display:flex;flex-direction:column;}
.colar-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:14px;}
.colar-h span{font-size:11.5px;color:var(--faint);flex:1;}
.colar-ta{height:220px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin:0;}
.colar-msg{margin-top:12px;font-size:14px;line-height:1.5;background:color-mix(in srgb, var(--accent) 12%, var(--surface2));border:1px solid var(--accent);border-radius:12px;padding:12px 14px;}
.colar-jus{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);}
.colar-jus b{color:var(--text);font-weight:500;}
.colar-jus span{flex:1;min-width:200px;}

`;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<!-- ================= Sincronizacao entre aparelhos (cofre online) ================= -->
<script>
(function(){
  var SUPA = window.__SUPA || { url:"", key:"" };
  var PHRASE_KEY = 'agenda-sync-space';
  var ID_KEY     = 'agenda-sync-id';
  var TS_KEY     = 'agenda-sync-ts';
  var PREFIX     = 'agenda-';
  function isProg(k){ return k && k.indexOf(PREFIX)===0 && k.indexOf('agenda-sync-')!==0 && k.indexOf('agenda-snap:')!==0 && k!=='agenda-theme' && k!=='agenda-cor'; }
  function jget(k){ try{ return JSON.parse(localStorage.getItem(k) || '{}'); }catch(e){ return {}; } }
  function jset(k,o){ try{ localStorage.setItem(k, JSON.stringify(o)); }catch(e){} }
  function spaceId(){ try{ return localStorage.getItem(ID_KEY) || ''; }catch(e){ return ''; } }
  function configured(){ return !!(SUPA.url && SUPA.key); }
  function on(){ return configured() && !!spaceId(); }
  function sha(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('agendanad::'+s))
      .then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join(''); });
  }
  function headers(extra){ var h = { apikey:SUPA.key, Authorization:'Bearer '+SUPA.key }; if(extra) for(var x in extra) h[x]=extra[x]; return h; }

  var applying=false, lastWrite=0, pushTimer=null, dirty={};
  window.__syncOnWrite = function(k){
    if (applying) return;
    lastWrite = Date.now();
    if (!isProg(k) || !on()) return;
    var ts = jget(TS_KEY); ts[k]=Date.now(); jset(TS_KEY, ts);
    dirty[k]=true;
    clearTimeout(pushTimer); pushTimer=setTimeout(pushDirty, 1200);
  };
  function pushDirty(){
    if (!on()) return;
    var ks=Object.keys(dirty); if(!ks.length) return;
    var id=spaceId(), ts=jget(TS_KEY), rows=[];
    ks.forEach(function(k){ rows.push({ space:id, k:k, v:localStorage.getItem(k), ts:ts[k]||Date.now() }); });
    dirty={};
    fetch(SUPA.url+'/rest/v1/kv', { method:'POST', headers:headers({ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' }), body:JSON.stringify(rows) })
      .then(function(r){ if(!r.ok){ ks.forEach(function(k){ dirty[k]=true; }); } })
      .catch(function(){ ks.forEach(function(k){ dirty[k]=true; }); });
  }
  function pushAll(){
    if(!on()) return;
    var ts=jget(TS_KEY), touched=false;
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(isProg(k)){ if(ts[k]==null){ ts[k]=Date.now(); touched=true; } dirty[k]=true; } }
    if(touched) jset(TS_KEY, ts);
    pushDirty();
  }
  function pull(cb){
    if(!on()){ if(cb) cb(false); return; }
    fetch(SUPA.url+'/rest/v1/kv?select=k,v,ts&space=eq.'+encodeURIComponent(spaceId()), { headers:headers() })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var ts=jget(TS_KEY), changed=false; applying=true;
        rows.forEach(function(row){
          if(row.ts > (ts[row.k]||0)){
            var cur=localStorage.getItem(row.k); var val=row.v==null?'':row.v;
            if(cur!==val){ localStorage.setItem(row.k, val); changed=true; }
            ts[row.k]=row.ts;
          }
        });
        applying=false; jset(TS_KEY, ts);
        if(changed){ try{ window.dispatchEvent(new Event('agenda-pulled')); }catch(e){} }
        if(cb) cb(changed);
      })
      .catch(function(){ applying=false; if(cb) cb(false); });
  }

  window.AgendaSync = {
    configured: configured,
    isOn: on,
    phrase: function(){ try{ return localStorage.getItem(PHRASE_KEY) || ''; }catch(e){ return ''; } },
    enable: function(phrase, done){
      var p=(phrase||'').trim();
      if(!p || !configured()){ if(done) done(false); return; }
      sha(p).then(function(id){ localStorage.setItem(PHRASE_KEY, p); localStorage.setItem(ID_KEY, id); pull(function(){ pushAll(); if(done) done(true); }); })
        .catch(function(){ if(done) done(false); });
    },
    disable: function(){ try{ localStorage.removeItem(ID_KEY); }catch(e){} }
  };

  if(on()){
    pull();
    setInterval(function(){ if(document.visibilityState==='visible') pull(); }, 15000);
    window.addEventListener('focus', function(){ pull(); });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pull(); });
  }
})();
</script>
