const { useState, useEffect, useRef } = React;

// cor do texto que contrasta com um fundo sólido (claro -> texto escuro; escuro -> branco)
const textOn = hex => { const c = (hex||'#000').replace('#',''); const r=parseInt(c.slice(0,2),16)||0, g=parseInt(c.slice(2,4),16)||0, b=parseInt(c.slice(4,6),16)||0; return (0.299*r+0.587*g+0.114*b)/255 > 0.62 ? '#231a05' : '#ffffff'; };

/* ---------- datas (sempre em horario local, sem fuso) ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS_LONGO = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const cap = t => t ? t.charAt(0).toUpperCase()+t.slice(1) : t;
const fmtLongo = s => { const d = parseYmd(s); return cap(DIAS_LONGO[d.getDay()])+', '+d.getDate()+' de '+MESES[d.getMonth()]; };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const weekStart = d => addDays(d, -d.getDay());   // volta ate domingo
const weekTitle = ws => { const we = addDays(ws,6);
  return ws.getMonth()===we.getMonth()

const DEFAULT_TIPOS = [
  { key:'audiencia',   nome:'Audiência',   cor:'#2F6FE4', fixo:true },

];
const FALLBACK_TIPO = { nome:'Outro', cor:'#a1a1aa' };
const CORES_TIPO = ['#2F6FE4','#f59e0b','#E85D9A','#7C4DE0','#10b981','#ef4444','#14b8a6','#eab308','#6366f1','#f97316'];
const TKEY = 'agenda-types';
// Agora TODOS os tipos (inclusive os 3 padrões) ficam nesta lista, editáveis/apagáveis.
// Migração: na 1ª vez, semeia os padrões que faltam junto com os que a usuária já criou.
function loadUserTipos(){

  try { localStorage.setItem(TKEY, JSON.stringify(merged)); localStorage.setItem('agenda-types-seeded', '1'); } catch(e){}
  return merged;
}
function saveUserTipos(l){ localStorage.setItem(TKEY, JSON.stringify(l)); }
const tipoNewKey = () => 'u' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);
function mapa(tiposList){ const m = {}; tiposList.forEach(t => { m[t.key] = t; }); return m; }
const REPETE = [
  { v:'none',    nome:'Não repete' },
  { v:'weekly',  nome:'Toda semana' },
  { v:'monthly', nome:'Todo mês' },
  { v:'yearly',  nome:'Todo ano' },

];

/* ---------- ocorrencias de um evento dentro de um intervalo [rs, re] (strings YYYY-MM-DD) ---------- */
function occurrences(ev, rs, re){
  const rep = ev.repeat || { freq:'none' };
  const start = parseYmd(ev.date);
  const reD = parseYmd(re);
  const out = [];
  if (rep.freq === 'none'){ if (ev.date >= rs && ev.date <= re) out.push(ev.date); return out; }
  const interval = Math.max(1, rep.interval || 1);
  const sy = start.getFullYear(), sm = start.getMonth(), sd = start.getDate();
  let unit = rep.freq, step = interval;
  if (rep.freq === 'custom'){ unit = rep.unit || 'week'; }
  for (let n = 0, guard = 0; guard < 4000; n++, guard++){
    let d;
    if (unit === 'weekly' || unit === 'week'){ d = new Date(sy, sm, sd + 7 * step * n); }
    else if (unit === 'day'){ d = new Date(sy, sm, sd + step * n); }
    else if (unit === 'monthly' || unit === 'month'){ d = new Date(sy, sm + step * n, sd); if (d.getDate() !== sd) continue; }
    else if (unit === 'yearly' || unit === 'year'){ d = new Date(sy + step * n, sm, sd); if (d.getDate() !== sd || d.getMonth() !== sm) continue; }
    else { d = new Date(sy, sm, sd); }
    if (d > reD) break;
    const s = ymd(d);
    if (s >= rs && s <= re) out.push(s);
  }
  return out;
}
// ordena por horário; sem hora (dia inteiro) vem primeiro
function cmpHora(a, b){ const ta = a.time||'', tb = b.time||''; if (!ta && !tb) return 0; if (!ta) return -1; if (!tb) return 1; return ta.localeCompare(tb); }
function repeatLabel(ev){
  const r = ev.repeat || { freq:'none' };
  if (r.freq === 'none') return '';
  if (r.freq === 'weekly') return 'toda semana';
  if (r.freq === 'monthly') return 'todo mês';
  if (r.freq === 'yearly') return 'todo ano';
  const u = { day:'dia', week:'semana', month:'mês', year:'ano' }[r.unit || 'week'];
  const i = Math.max(1, r.interval || 1);
  return i === 1 ? ('todo '+u) : ('a cada '+i+' '+u+(i>1 && r.unit!=='month'?'s':''));
}

/* ---------- armazenamento ---------- */
const KEY = 'agenda-events';
function loadEvents(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
function saveEvents(list){ localStorage.setItem(KEY, JSON.stringify(list)); }
let _id = Date.now();
const newId = () => 'e' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);

/* ---------- notas (processos) ---------- */
const NKEY = 'agenda-notes';
const CATKEY = 'agenda-notecats';
const DEFAULT_NOTECATS = [
  { key:'verde',    nome:'Verde',    cor:'#10b981' },
  { key:'amarelo',  nome:'Amarelo',  cor:'#eab308' },
  { key:'vermelho', nome:'Vermelho', cor:'#ef4444' },
];
const CAT_CORES = ['#10b981','#eab308','#ef4444','#2F6FE4','#7C4DE0','#E85D9A','#14b8a6','#f97316','#6366f1','#64748b'];
function loadNoteCats(){ try { const s = JSON.parse(localStorage.getItem(CATKEY) || 'null'); return (s && s.length) ? s : DEFAULT_NOTECATS.slice(); } catch(e){ return DEFAULT_NOTECATS.slice(); } }
function saveNoteCats(l){ localStorage.setItem(CATKEY, JSON.stringify(l)); }
const catNota = (cats, k) => (cats.find(c => c.key === k) || { nome:'Sem categoria', cor:'#a1a1aa' });
const catNewKey = () => 'c' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);
const soDigitos = s => (s || '').replace(/\D/g, '');
const fmtData = s => { const d = parseYmd(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
// histórico: mais recente primeiro
const cmpEntry = (a,b) => a.date === b.date ? (a.id < b.id ? 1 : -1) : (a.date < b.date ? 1 : -1);
// converte nota antiga (um campo 'obs') para o formato novo (lista de anotações com data)
function normNote(n){ if (Array.isArray(n.entries)) return n; const e = []; if (n.obs) e.push({ id:(n.id||'n')+'-0', date: n.date || todayStr(), text:n.obs }); const c = { ...n, entries:e }; delete c.obs; return c; }
function loadNotes(){ try { return (JSON.parse(localStorage.getItem(NKEY) || '[]')).map(normNote); } catch(e){ return []; } }
function saveNotes(list){ localStorage.setItem(NKEY, JSON.stringify(list)); }

// contador de valor (embaixo de Processos): número puro = define; +/- = soma/subtrai
const VKEY = 'agenda-valor';
function loadValor(){ const v = parseFloat(localStorage.getItem(VKEY)); return isNaN(v) ? 0 : v; }
function saveValor(v){ localStorage.setItem(VKEY, String(v)); }
const fmtValor = v => v.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
function parseValInput(s){
  s = (s||'').trim(); if (!s) return null;
  let sign = 1, signed = false;
  if (s[0] === '+'){ signed = true; s = s.slice(1); }
  else if (s[0] === '-'){ signed = true; sign = -1; s = s.slice(1); }
  s = s.trim().replace(/\./g,'').replace(',', '.').replace(/[^0-9.]/g,'');
  const n = parseFloat(s); if (isNaN(n)) return null;
  return { signed, val: sign * n };
}
function applyVal(cur, input){ const p = parseValInput(input); if (!p) return cur; return +(p.signed ? (cur + p.val) : Math.abs(p.val)).toFixed(2); }

/* =====================================================================
   PAINEL DE TRABALHO (TJSC)
   Ela cola as telas do CEJUSC, do NEJUL e do EPROC; o app junta tudo numa
   lista só (na ordem do NEJUL) e, a cada colagem nova, compara com o que
   ela já tinha e avisa só o que mudou. Situação, pendência e observação são
   dela — a colagem nunca reescreve o que ela escreveu.
   Sentenças, Despachos e Audiências saem sozinhos da situação de cada processo.
   ===================================================================== */
const PKEY = 'agenda-painel';          // { procs:{key:proc}, ordem:[key], avisos:[], aud:[], ultimaColagem, contagem }
const SITKEY = 'agenda-situacoes';
const RAWKEY = { nejul:'agendaloc-nejul', eproc:'agendaloc-eproc', cejusc:'agendaloc-cejusc' };  // só neste aparelho (não sincroniza)
// As quatro situações fixas mandam o processo para as telas de Sentenças e Despachos.
const SIT_FIXAS = { sentenciar:'Para sentenciar', despachar:'Para despachar', 'sent-entregue':'Sentenças entregues', 'desp-entregue':'Despachos entregues' };
const DEFAULT_SITS = [
  { key:'sentenciar',    nome:'Sentenciar',                cor:'#10b981', fixo:true },
  { key:'despachar',     nome:'Despachar',                 cor:'#14b8a6', fixo:true },
  { key:'aud',           nome:'Aguardando audiência',      cor:'#2F6FE4' },
  { key:'redesignar',    nome:'Redesignar audiência',      cor:'#7C4DE0' },
  { key:'pend',          nome:'Minhas pendências',         cor:'#ef4444' },
  { key:'nejul',         nome:'Aguardando resposta NEJUL', cor:'#f97316' },
  { key:'sent-entregue', nome:'Sentença entregue',         cor:'#eab308', fixo:true },
  { key:'desp-entregue', nome:'Despacho entregue',         cor:'#E85D9A', fixo:true },
  { key:'outros',        nome:'Outros',                    cor:'#64748b' },
];
function loadSits(){
  try { const s = JSON.parse(localStorage.getItem(SITKEY) || 'null'); if (Array.isArray(s) && s.length){
    const has = new Set(s.map(x => x.key)); const falta = DEFAULT_SITS.filter(d => d.fixo && !has.has(d.key));
    return [...s.map(x => DEFAULT_SITS.some(d => d.fixo && d.key === x.key) ? { ...x, fixo:true } : x), ...falta]; } } catch(e){}
  return DEFAULT_SITS.slice();
}
function saveSits(l){ localStorage.setItem(SITKEY, JSON.stringify(l)); }
const PAINEL_VAZIO = { procs:{}, ordem:[], avisos:[], aud:[], ultimaColagem:null, contagem:null };
function loadPainel(){ try { const p = JSON.parse(localStorage.getItem(PKEY) || 'null'); if (p && p.procs) return { ...PAINEL_VAZIO, ...p }; } catch(e){} return { ...PAINEL_VAZIO }; }
function savePainel(p){ localStorage.setItem(PKEY, JSON.stringify(p)); }
const lerLocal = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
const gravarLocal = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };

/* ---------- datas do tribunal (DD/MM/AAAA) <-> AAAA-MM-DD ---------- */
const CNJ_RE = /\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/;
const isBR = s => /^\d{2}\/\d{2}\/\d{4}$/.test(s || '');
const isHora = s => /^\d{2}:\d{2}$/.test(s || '');
const brYmd = s => { const m = (s || '').match(/(\d{2})\/(\d{2})\/(\d{2,4})/); if (!m) return ''; const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + m[2] + '-' + m[1]; };
const chaveProc = s => { const m = (s || '').match(CNJ_RE); return m ? m[0] : ''; };
const difDias = (de, ate) => Math.round((parseYmd(ate) - parseYmd(de)) / 86400000);
const fmtCurta = s => s ? s.slice(8,10) + '/' + s.slice(5,7) : '';
const brl = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const VALOR_C = { C1:44.47, C2:88.94, C3:133.41 };
const cDaComplexidade = s => /ALTA/i.test(s || '') ? 'C3' : /M[ÉE]DIA/i.test(s || '') ? 'C2' : /BAIXA/i.test(s || '') ? 'C1' : '';

/* ---------- leitura das colagens ---------- */
// NEJUL: as células da tabela chegam achatadas, uma por linha. Cada processo vai
// da linha do número até o próximo número. Âncoras fixas: ENTREGAR e ATENDIMENTO.
function lerNejul(raw){
  const L = (raw || '').split('\n').map(l => l.replace(/ /g, ' ').trim());
  const PROC = /^\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}$/;
  const idx = []; L.forEach((l, i) => { if (PROC.test(l)) idx.push(i); });
  const out = [];
  idx.forEach((ini, k) => {
    const seg = L.slice(ini, k + 1 < idx.length ? idx[k + 1] : L.length);
    const iEnt = seg.indexOf('ENTREGAR'), iAt = seg.indexOf('ATENDIMENTO');
    const pre = seg.slice(1, iEnt >= 0 ? iEnt : seg.length).filter(Boolean);
    const distr = pre.find(isBR) || '';
    const diasLinha = pre.find(l => /^(?:\S+\s+)?\d{1,4}$/.test(l)) || '';
    let entrega = iEnt > 0 ? seg[iEnt - 1] : '';
    if (entrega === diasLinha || entrega === distr) entrega = '';
    const meio = iEnt >= 0 && iAt > iEnt ? seg.slice(iEnt, iAt) : [];
    const aijDate = meio.find(isBR) || '', aijTime = meio.find(isHora) || '';
    const post = (iAt >= 0 ? seg.slice(iAt + 1) : []).filter(l => l && !/^🔀/.test(l) && l !== 'IMPEDIMENTO' && !/^Voltar ao menu/i.test(l));
    const ehClass = l => /COMPLEXIDADE|EMBARGOS DECLARAT/i.test(l) || /^Selecione/.test(l);
    const classes = post.filter(l => ehClass(l) && !/^Selecione/.test(l));
    const obs = post.filter(l => !ehClass(l) && l !== 'AIJ').join('\n');
    const desig = obs.match(/consta como (?:RE)?DESIGNADA em (\d{2}\/\d{2}\/\d{4})\s*(\d{2}:\d{2})?/i);
    const feita = obs.match(/(?:consta como REALIZADA em|AUDI[ÊE]NCIA REALIZADA EM)\s*(\d{2}\/\d{2}\/\d{2,4})/i);
    out.push({ key:seg[0], origin:pre[0] || '', distr:brYmd(distr), dias:parseInt((diasLinha.match(/\d+/) || ['0'])[0], 10),
      entrega, aij: isBR(aijDate) ? { date:brYmd(aijDate), time:aijTime } : null,
      aijEproc: desig ? { date:brYmd(desig[1]), time:desig[2] || '' } : null,
      realizada: feita ? brYmd(feita[1]) : '', classif: classes[classes.length - 1] || '', obsN:obs });
  });
  return out;
}
// EPROC: vários relatórios colados um embaixo do outro; o mesmo processo pode
// aparecer mais de uma vez — junta as aparições sem apagar os nomes das partes.
function lerEproc(raw){
  const txt = (raw || '').replace(/ /g, ' ');
  const ms = [...txt.matchAll(/(\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4})\/SC/g)];
  const m = new Map();
  ms.forEach((x, i) => {
    const seg = txt.slice(x.index, i + 1 < ms.length ? ms[i + 1].index : txt.length);
    const r = { key:x[1], autores:[...seg.matchAll(/([^\n\t]+?)\s*-\s*(AUTOR|REQUERENTE)\b/gi)].map(a => a[1].trim()),
      reus:[...seg.matchAll(/([^\n\t]+?)\s*-\s*(R[ÉE]U|REQUERIDO)\b/gi)].map(a => a[1].trim()),
      remDate:brYmd((seg.match(/\d{2}\/\d{2}\/\d{4}/) || [''])[0]), idoso:/Idoso/i.test(seg) };
    const p = m.get(r.key);
    m.set(r.key, p ? { ...p, autores:p.autores.length ? p.autores : r.autores, reus:p.reus.length ? p.reus : r.reus, remDate:p.remDate || r.remDate, idoso:p.idoso || r.idoso } : r);
  });
  return [...m.values()];
}
// CEJUSC: uma linha por horário — "01/10/2026 (Qui) às 13:00 <tab> processo" (ou "(vazio)").
function lerCejusc(raw){
  const out = [];
  (raw || '').split('\n').forEach(l => {
    const d = l.match(/\b(\d{2}\/\d{2}\/\d{4})\b/), h = l.match(/\b(\d{2}:\d{2})\b/);
    if (!d || !h) return;
    const k = chaveProc(l);
    if (k) out.push({ key:k, date:brYmd(d[1]), time:h[1] });
  });
  return out;
}

/* ---------- audiência e antiguidade de cada processo ---------- */
// audiência que ainda vai acontecer, pela ordem de confiança: à mão > CEJUSC > NEJUL > texto do NEJUL
function aijMarcada(p){ return p.aijManual && p.aijManual.date ? p.aijManual : (p.aijC || p.aijN || p.aijEproc || null); }
const fmtAij = a => a && a.date ? fmtData(a.date) + (a.time ? ' ' + a.time : '') : '';
// Antiguidade: conta do dia em que chegou; se já teve AIJ, conta só do dia da AIJ.
function antiguidade(p, hoje){
  const feitas = [p.aijManual, p.aijC, p.aijN, p.aijEproc].filter(a => a && a.date && a.date <= hoje).map(a => a.date);
  if (p.realizada) feitas.push(p.realizada);
  if (feitas.length){ const d = feitas.sort().pop(); return { n:difDias(d, hoje), aij:true, desde:d }; }
  const rec = p.distr || p.remDate || p.criadoEm || hoje;
  return { n:difDias(rec, hoje), aij:false, desde:rec };
}
const textoAntig = a => a.aij ? (a.n === 0 ? 'AIJ hoje' : a.n === 1 ? '1 dia desde a AIJ' : a.n + ' dias desde a AIJ') : (a.n === 1 ? 'recebido há 1 dia' : 'recebido há ' + a.n + ' dias');
const valorDe = p => VALOR_C[p.valorTipo || cDaComplexidade(p.classif)] || 0;

/* ---------- colagem nova: junta os três painéis e compara com o que já havia ---------- */
let _av = 0;
const avId = () => 'a' + Date.now().toString(36) + (_av++).toString(36);
function aplicarColagem(painel, raws, hoje){
  const N = lerNejul(raws.nejul), E = lerEproc(raws.eproc), C = lerCejusc(raws.cejusc);
  const nMap = new Map(N.map(x => [x.key, x])), eMap = new Map(E.map(x => [x.key, x]));
  // mesmo processo em mais de um horário: fica a próxima audiência (ou a mais recente, se todas já passaram)
  const cMap = new Map(); C.forEach(x => { const c = cMap.get(x.key);
    if (!c || (x.date >= hoje ? (c.date < hoje || x.date < c.date) : (c.date < hoje && x.date > c.date))) cMap.set(x.key, x); });
  const primeira = Object.keys(painel.procs).length === 0;
  const procs = { ...painel.procs }, avisos = [];
  const aviso = (key, tipo, texto) => avisos.push({ id:avId(), key, tipo, texto, em:hoje });
  const todas = new Set([...nMap.keys(), ...eMap.keys(), ...cMap.keys()]);
  todas.forEach(key => {
    const n = nMap.get(key), e = eMap.get(key), c = cMap.get(key);
    const ant = procs[key];
    const p = ant ? { ...ant } : { key, sit:'', pend:'', obs:'', criadoEm:hoje };
    const aijAntes = fmtAij(ant ? (ant.aijC || ant.aijN || ant.aijEproc) : null);
    const aijAntesFutura = ant && [ant.aijC, ant.aijN, ant.aijEproc].some(a => a && a.date >= hoje);
    p.inN = !!n; p.inE = !!e; p.inC = !!c;
    if (n){ Object.assign(p, { origin:n.origin, distr:n.distr, diasN:n.dias, entregaN:n.entrega, aijN:n.aij, aijEproc:n.aijEproc, realizada:n.realizada || p.realizada || '', classif:n.classif || p.classif || '', obsN:n.obsN }); }
    if (e){ Object.assign(p, { remDate:e.remDate, autores:e.autores.length ? e.autores : (p.autores || []), reus:e.reus.length ? e.reus : (p.reus || []), idoso:e.idoso }); }
    p.aijC = c ? { date:c.date, time:c.time } : null;
    if (!n){ p.aijN = null; p.aijEproc = null; }
    if (!primeira){
      if (!ant){ p.novo = true; aviso(key, 'novo', 'Apareceu no painel ' + [n && 'NEJUL', e && 'EPROC', c && 'CEJUSC'].filter(Boolean).join(', ') + '. Está em branco para você preencher.'); }
      else {
        // tirado da lista (ou já assinado) e reaparece num painel onde não estava: volta para a lista
        if (ant.arquivado && ((n && !ant.inN) || (e && !ant.inE) || (c && !ant.inC))){ p.arquivado = false; aviso(key, 'voltou', 'Tinha saído e voltou ao painel ' + [n && 'NEJUL', e && 'EPROC', c && 'CEJUSC'].filter(Boolean).join(', ') + '.'); }
        if (ant.inN && !n) aviso(key, 'saiu', 'Saiu do NEJUL' + (e ? ' (ainda está no EPROC)' : '') + '. Foi assinado?');
        const aijAgora = fmtAij(p.aijC || p.aijN || p.aijEproc);
        if (aijAgora !== aijAntes && (aijAgora || aijAntesFutura))
          aviso(key, 'aij', aijAntes && aijAgora ? 'A audiência mudou: era ' + aijAntes + ', agora ' + aijAgora + '.' : aijAgora ? 'Audiência marcada: ' + aijAgora + '.' : 'A audiência de ' + aijAntes + ' saiu do painel.');
        const entAntes = ant.entregaN || '', entAgora = p.entregaN || '';
        if (n && entAgora !== entAntes){
          if (/Devolvid/i.test(entAgora)) aviso(key, 'devolvido', 'O NEJUL devolveu para ajuste.');
          else if (isBR(entAgora) && !/^(sent|desp)-entregue$/.test(p.sit)) aviso(key, 'entregueN', 'O NEJUL mostra entregue em ' + entAgora + '.');
        }
      }
    } else if (n && isBR(n.entrega) && !p.sit){ p.sit = 'sent-entregue'; }
    if (isBR(p.entregaN) && !p.entregaData) p.entregaData = brYmd(p.entregaN);
    // o AgendaNAD é o mais atual: se ela mexeu aqui e o NEJUL continua com a observação antiga, lembra de atualizar lá
    if (ant && ant.nejulAtualizar && n){
      if ((n.obsN || '') !== (ant.nejulObsRef || '')) p.nejulAtualizar = false;
      else if (!primeira) aviso(key, 'nejul', 'O NEJUL continua desatualizado neste processo. Copie o texto e cole na sua observação de lá.');
    }
    procs[key] = p;
  });
  // o que estava nos painéis e não veio nesta colagem
  Object.values(procs).forEach(p => {
    if (todas.has(p.key) || p.arquivado || !(p.inN || p.inE || p.inC)) return;
    const estavaN = p.inN;
    procs[p.key] = { ...p, inN:false, inE:false, inC:false, aijC:null };
    if (!primeira) aviso(p.key, 'saiu', estavaN ? 'Saiu do NEJUL. Foi assinado?' : 'Saiu dos painéis. Foi assinado ou entregue?');
  });
  // ordem: a do NEJUL; depois o que só está no EPROC (mais antigo primeiro); depois só CEJUSC
  const ordem = N.map(x => x.key);
  const resto = [...todas].filter(k => !nMap.has(k));
  resto.sort((a, b) => (eMap.has(b) - eMap.has(a)) || ((procs[a].remDate || '9') < (procs[b].remDate || '9') ? -1 : 1));
  // audiências que vieram dos painéis
  const aud = [];
  C.forEach(x => aud.push({ key:x.key, date:x.date, time:x.time, fonte:'CEJUSC' }));
  // o CEJUSC manda na data: se o processo está lá, a data escrita no NEJUL (que pode estar atrasada) não entra
  N.forEach(x => { const a = x.aij || x.aijEproc; if (a && a.date && !aud.some(y => y.key === x.key)) aud.push({ key:x.key, date:a.date, time:a.time, fonte:'NEJUL' }); });
  const contagem = { nejul:N.length, eproc:E.length, cejusc:C.length, total:todas.size };
  return { ...painel, procs, ordem:[...ordem, ...resto], aud, avisos:[...avisos, ...painel.avisos.filter(a => !(a.tipo === 'nejul' && avisos.some(b => b.tipo === 'nejul' && b.key === a.key)))], ultimaColagem:new Date().toISOString(), contagem, _novos:avisos.length };
}
// Notas do JusNAD (Desenrolar de 06/10): grupo vira situação, texto vira observação. Só preenche o que está vazio.
function sitDoGrupo(grupo, texto){
  const g = (grupo || '').toUpperCase(), t = (texto || '').toUpperCase();
  if (/^REDESIGNAR/.test(t)) return 'redesignar';
  if (/^SENTENCIAR/.test(t) || /SENTENCIAR/.test(g)) return 'sentenciar';
  if (/ASSINATURA/.test(g)) return 'sent-entregue';
  if (/AUDI/.test(g)) return 'aud';
  if (/NEJUL/.test(g)) return 'nejul';
  if (/PEND/.test(g)) return 'pend';
  return 'outros';
}
function aplicarNotasJusnad(painel, notas, hoje){
  const procs = { ...painel.procs }; let n = 0;
  (notas || []).forEach(x => {
    const key = chaveProc(x.num); if (!key) return;
    const p = procs[key] ? { ...procs[key] } : { key, sit:'', pend:'', obs:'', criadoEm:hoje, inN:false, inE:false, inC:false };
    if (!p.obs && x.texto) p.obs = x.texto;
    if (!p.pend && x.pend) p.pend = x.pend;
    if (!p.sit) p.sit = x.sit || sitDoGrupo(x.grupo, x.texto);
    if (/^(sent|desp)-entregue$/.test(p.sit) && !p.entregaData) p.entregaData = hoje;
    procs[key] = p; n++;
  });
  const ordem = painel.ordem.slice(); Object.keys(procs).forEach(k => { if (ordem.indexOf(k) < 0) ordem.push(k); });
  return { painel:{ ...painel, procs, ordem }, n };
}

  useEffect(() => { const mq = window.matchMedia(q); const h = () => setM(mq.matches); mq.addEventListener('change', h); return () => mq.removeEventListener('change', h); }, []);
  return m;
}

      {noteEdit && <NoteEditor n={noteEdit} cats={noteCats} onOpenCats={()=>setCatsOpen(true)} onClose={()=>setNoteEdit(null)} onSave={n=>{ upsertNote(n); setNoteEdit(null); }} onDelete={id=>{ removeNote(id); setNoteEdit(null); }} />}
      {catsOpen && <CatManager cats={noteCats} onSave={list=>setNoteCats(list)} onClose={()=>setCatsOpen(false)} />}
      {sitsOpen && <CatManager cats={sits} defaultCats={DEFAULT_SITS} semSolido title="Situações do painel" subtitle="Renomeie, mude a cor ou crie novas. As quatro marcadas com cadeado levam o processo para Sentenças e Despachos e não podem ser apagadas." onSave={list=>setSits(list)} onClose={()=>setSitsOpen(false)} />}
      {procEdit && painel.procs[procEdit] && <ProcEditor p={painel.procs[procEdit]} sits={sits} hoje={hoje} onClose={()=>setProcEdit(null)} onSalvar={patch=>{ updProc(procEdit, patch); setProcEdit(null); }} onApagar={()=>{ apagarProc(procEdit); setProcEdit(null); }} onSits={()=>setSitsOpen(true)} />}
      {tipoEdit && <TipoEditor tipo={tipoEdit} onClose={()=>setTipoEdit(null)} onSave={(nome,cor)=>{ if(tipoEdit._new) addTipo(nome,cor); else editTipo(tipoEdit.key,nome,cor); setTipoEdit(null); }} />}
      {syncOpen && <SyncModal onClose={()=>setSyncOpen(false)} />}
      {updateReady && (
        <div className="updbar">
          <span>Tem uma versão nova da AgendaNAD.</span>
          <button className="updbtn" onClick={()=>location.reload()}>Atualizar</button>
          <button className="updx" onClick={()=>setUpdateReady(false)} aria-label="Depois">×</button>
        </div>
      )}
      <style>{CSS}</style>
    </div>
  );
}

function MonthView(props){ return props.compacto ? <MonthCompacto {...props} /> : <MonthGrande {...props} />; }
// celular: dias com bolinhas coloridas; tocar num dia mostra os compromissos dele logo embaixo
function MonthCompacto({ refStr, setRefStr, events, tipoMap, onNew, onOpen }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear(), m = ref.getMonth();
  const primeiro = new Date(y, m, 1);
  const cells = Array.from({length:42}, (_,i) => new Date(y, m, 1 - primeiro.getDay() + i));
  const rs = ymd(cells[0]), re = ymd(cells[41]);
  const hoje = todayStr();
  const [sel, setSel] = useState(refStr);
  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));
  Object.keys(porDia).forEach(s => porDia[s].sort(cmpHora));
  const go = delta => { const d = new Date(y, m + delta, 1); setRefStr(ymd(d)); setSel(ymd(d)); };
  const semanas = cells.slice(35).every(d => d.getMonth() !== m) ? cells.slice(0, 35) : cells;
  const doDia = porDia[sel] || [];
  return (
    <div>
      <ViewHeader title={cap(MESES[m])+' '+y} onPrev={()=>go(-1)} onNext={()=>go(1)} onToday={()=>{ setRefStr(hoje); setSel(hoje); }} />
      <div className="mc-week">{DIAS.map(d => <div key={d}>{d[0].toUpperCase()}</div>)}</div>
      <div className="mc-grid">
        {semanas.map((d, i) => {
          const s = ymd(d); const evs = porDia[s] || [];
          const cores = []; evs.forEach(ev => { const c = (tipoMap[ev.type]||FALLBACK_TIPO).cor; if (cores.indexOf(c) < 0 && cores.length < 4) cores.push(c); });
          return (
            <button key={i} className={'mc-day'+(d.getMonth()!==m?' fora':'')+(s===hoje?' hoje':'')+(s===sel?' sel':'')} onClick={()=>setSel(s)}>
              <span className="mc-num">{d.getDate()}</span>
              <span className="mc-dots">{cores.map((c,k) => <i key={k} style={{background:c}}></i>)}</span>
            </button>
          );
        })}
      </div>
      <div className="mc-dia">
        <div className="mc-diatit">{sel === hoje ? 'Hoje — ' : ''}{fmtLongo(sel)}</div>
        {doDia.length === 0 && <div className="mc-vazio">Nada marcado neste dia.</div>}
        {doDia.map((ev,i) => (
          <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
            <span className="ltempo">{ev.time || 'dia todo'}</span>
            <span className="ltit">{ev.title || '(sem título)'}</span>
            {ev.repeat && ev.repeat.freq!=='none' && <span className="lrep">↻</span>}
          </div>
        ))}
        <button className="mc-novo" onClick={()=>onNew(sel)}>+ novo neste dia</button>
      </div>
    </div>
  );
}

/* ---------- visao de lista (proximos 90 dias) ---------- */
function AgendaView({ events, tipoMap, onOpen, onNew }){
  const hoje = todayStr();
  const fim = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 90));
  const linhas = [];
  events.forEach(ev => occurrences(ev, hoje, fim).forEach(s => linhas.push({ s, ev })));
  linhas.sort((a,b) => a.s === b.s ? cmpHora(a.ev, b.ev) : a.s.localeCompare(b.s));
  const grupos = [];
  linhas.forEach(l => {
    let g = grupos[grupos.length-1];
    if (!g || g.s !== l.s){ g = { s:l.s, itens:[] }; grupos.push(g); }
    g.itens.push(l.ev);
  });
  return (
    <div>
      <ViewHeader title="Próximos compromissos" />
      {grupos.length === 0 && <div className="vazio">Nada marcado para os próximos 3 meses. Toque em <b>+ Novo compromisso</b> pra começar.</div>}
      {grupos.map(g => (
        <div key={g.s} className="diagrp">
          <div className={'diahead'+(g.s===hoje?' ehoje':'')}>{g.s===hoje?'Hoje — ':''}{fmtLongo(g.s)}</div>
          {g.itens.map((ev,i) => (
            <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>

            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ---------- NOTAS: lista de processos, agrupada por cor, com busca ---------- */
function NotesView({ notes, cats, valor, onValor, onOpen, onNew, onCats }){
  const [q, setQ] = useState('');
  const [vin, setVin] = useState('');
  const aplicarValor = () => { const novo = applyVal(valor || 0, vin); onValor(novo); setVin(''); };
  const qd = soDigitos(q), ql = q.trim().toLowerCase();
  const filtradas = notes.filter(n => {
    if (n.arquivado && !ql) return false;   // arquivados só aparecem quando busca
    if (!ql) return true;
    const num = (n.num||'');
    return (qd && soDigitos(num).includes(qd)) || num.toLowerCase().includes(ql) || (n.entries||[]).some(e => (e.text||'').toLowerCase().includes(ql));
  });
  const nArquivados = notes.filter(n => n.arquivado).length;
  const ultimo = n => { const e = (n.entries||[]); return e.length ? e.slice().sort(cmpEntry)[0] : null; };
  const grupos = cats.map(c => ({ cat:c, itens: filtradas.filter(n => n.color === c.key) })).filter(g => g.itens.length);
  const semCat = filtradas.filter(n => !cats.some(c => c.key === n.color));
  if (semCat.length) grupos.push({ cat:{ key:'__sem', nome:'Sem categoria', cor:'#a1a1aa' }, itens:semCat });

  return (
    <div>
      <div className="head">
        <div className="titulo">Processos</div>
        <div className="headbtns"><button className="navbtn" onClick={onCats}>Cores</button></div>
      </div>
      <div className="valorbox">
        <span className="valor-num">{fmtValor(valor || 0)}</span>
        <input className="valor-inp" value={vin} onChange={e=>setVin(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') aplicarValor(); }}
          placeholder="+ 88,94" inputMode="decimal" autoCapitalize="off" autoCorrect="off" spellCheck="false" />
        <button className="valor-ok" onClick={aplicarValor} title="Atualizar (Enter)">↵</button>
      </div>
      <div className="buscaWrap">
        <span className="buscaIco">⌕</span>
        <input className="busca" placeholder="Buscar número do processo…" value={q} onChange={e=>setQ(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
        {q && <button className="buscaX" onClick={()=>setQ('')} aria-label="Limpar">×</button>}
      </div>
      {notes.length === 0 && <div className="vazio">Nenhum processo ainda. Toque em <b>+ Nova nota</b> pra guardar o primeiro, com o número e a primeira anotação.</div>}
      {notes.length > 0 && filtradas.length === 0 && <div className="vazio">Nada encontrado para "{q}".</div>}
      {grupos.map(g => (
        <div key={g.cat.key} className="notegrupo">
          <div className="grupohead"><span className="dot" style={{background:g.cat.cor}}></span>{g.cat.nome}<span className="grupocount">{g.itens.length}</span></div>
          <div className="notesgrid">
            {g.itens.map(n => { const u = ultimo(n); const solid = (typeof n.solido === 'boolean') ? n.solido : !!g.cat.solido; const tc = solid ? textOn(g.cat.cor) : null;
              return (
              <button key={n.id} className={'notecard'+(solid?' solido':'')+(n.arquivado?' arquivada':'')} style={solid ? { background:g.cat.cor, borderColor:g.cat.cor, '--c':g.cat.cor, color:tc } : { '--c':g.cat.cor }} onClick={()=>onOpen(n)}>
                {n.arquivado && <span className="arqtag">arquivado</span>}
                <span className="note-num" style={solid?{color:tc}:null}>{n.num || '(sem número)'}</span>
                {u && <span className="note-data" style={solid?{color:tc,opacity:.75}:null}>{fmtData(u.date)}</span>}
                {u ? <span className="note-prev" style={solid?{color:tc,opacity:.9}:null}>{u.text}</span> : <span className="note-prev" style={solid?{color:tc,opacity:.85,fontStyle:'italic'}:{fontStyle:'italic'}}>sem anotações</span>}
              </button>
            );})}
          </div>
        </div>
      ))}
      {!ql && nArquivados > 0 && <div className="arqhint">{nArquivados} {nArquivados === 1 ? 'processo arquivado' : 'processos arquivados'} — some da lista, mas aparece aqui quando você busca pelo número.</div>}
    </div>
  );
}

/* ---------- NOTAS: caixinha do processo (histórico + anotar) ---------- */
function NoteView({ n, cats, onClose, onEdit, onDelete, onArchive, onAddEntry, onDelEntry }){
  const c = catNota(cats, n.color);
  const [txt, setTxt] = useState('');
  const entries = (n.entries||[]).slice().sort(cmpEntry);
  const add = () => { const t = txt.trim(); if (t){ onAddEntry(n.id, t); setTxt(''); } };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card vcard" style={{borderTop:'4px solid '+c.cor}}>
        <div className="vhead">
          <span className="vtipo" style={{background:c.cor}}>{c.nome}</span>
          {n.arquivado && <span className="arqtag">arquivado</span>}
          <span className="vacts">
            <button className="lapis" onClick={onEdit} title="Editar processo" aria-label="Editar">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button className="lapis" onClick={()=>onArchive(n.id, !n.arquivado)} title={n.arquivado ? 'Desarquivar' : 'Arquivar'} aria-label={n.arquivado ? 'Desarquivar' : 'Arquivar'}>
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg>
            </button>
            <button className="lapis lixeira" onClick={()=>{ if(confirm('Apagar este processo inteiro (o número e todas as anotações)?')) onDelete(n.id); }} title="Apagar processo" aria-label="Apagar processo">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </span>
        </div>
        <div className="vtitulo">{n.num || '(sem número)'}</div>
        <div className="hist">
          {entries.length === 0 && <div className="hist-vazio">Sem anotações ainda. Escreva a primeira embaixo.</div>}
          {entries.map(e => (
            <div key={e.id} className="hist-item">
              <div className="hist-top"><span className="hist-data">{fmtData(e.date)}</span>
                <button className="hist-x" title="Apagar anotação" onClick={()=>{ if(confirm('Apagar esta anotação?')) onDelEntry(n.id, e.id); }}>×</button>
              </div>
              <div className="hist-text">{e.text}</div>
            </div>
          ))}
        </div>
        <div className="addbox">
          <textarea className="inp" style={{margin:0}} rows="2" placeholder="Escreva uma anotação de hoje…" value={txt} onChange={e=>setTxt(e.target.value)} />
          <button className="primary" onClick={add}>Adicionar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- NOTAS: editor do processo (número + cor + 1ª anotação) ---------- */
function NoteEditor({ n, cats, onOpenCats, onClose, onSave, onDelete }){
  const [num, setNum] = useState(n.num);
  const [color, setColor] = useState(n.color || (cats[0] && cats[0].key));
  const catIni = cats.find(c => c.key === (n.color || (cats[0] && cats[0].key))) || {};
  const [solido, setSolido] = useState(n.solido != null ? n.solido : !!catIni.solido);
  const [firstText, setFirstText] = useState('');
  const corSel = (cats.find(c => c.key === color) || {}).cor || '#888';
  const salvar = () => {
    const entries = (n.entries||[]).slice();
    if (n._new && firstText.trim()) entries.unshift({ id:newId(), date:todayStr(), text:firstText.trim() });
    onSave({ ...n, num, color, entries, solido });
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead">
          <b>{n._new ? 'Nova nota' : 'Editar processo'}</b>
          <button className="x" onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <input className="inp" autoFocus placeholder="Número do processo (ex.: 5003734-12.2024.8.24.0000)" value={num} onChange={e=>setNum(e.target.value)} />
        <div className="tipos">
          {cats.map(c => (
            <button key={c.key} className={'tipopill'+(color===c.key?' on':'')}
              style={color===c.key?{background:c.cor,borderColor:c.cor,color:'#fff'}:{}}
              onClick={()=>setColor(c.key)}>{c.nome}</button>
          ))}
          <button className="tipopill novo" onClick={onOpenCats}>editar cores</button>
        </div>
        <label className="fortesw">
          <button className={'solidtog'+(solido?' on':'')} style={solido?{background:corSel,borderColor:corSel,color:textOn(corSel)}:null} onClick={()=>setSolido(s=>!s)}>fundo forte</button>
          <span>deixa esta janelinha bem sólida (pra urgência)</span>
        </label>
        {n._new && <textarea className="inp" rows="4" placeholder="Primeira anotação (fica com a data de hoje)" value={firstText} onChange={e=>setFirstText(e.target.value)} />}
        <div className="cardacts">
          {!n._new && <button className="del" onClick={()=>{ if(confirm('Apagar este processo e todas as anotações dele?')) onDelete(n.id); }}>Apagar</button>}
          <span style={{flex:1}}></span>
          <button className="ghost" onClick={onClose}>Cancelar</button>
          <button className="primary" onClick={salvar}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- NOTAS: gerenciar as cores (renomear / criar / apagar) ---------- */
/* ---------- editor de TIPO de compromisso (criar/editar nome + cor) ---------- */
function TipoEditor({ tipo, onClose, onSave }){
  const [nome, setNome] = useState(tipo.nome || '');
  const [cor, setCor] = useState(tipo.cor || CORES_TIPO[0]);
  const salvar = () => { const n = nome.trim(); if (!n) return; onSave(n, cor); };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>{tipo._new ? 'Novo tipo' : 'Editar tipo'}</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <input className="inp" autoFocus placeholder="Nome do tipo (ex.: Pagamento, Reunião)" value={nome} onChange={e=>setNome(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') salvar(); }} />
        <div className="cores" style={{marginBottom:6}}>
          {CORES_TIPO.map(c => <button key={c} className={'corbolinha'+(cor===c?' on':'')} style={{background:c}} onClick={()=>setCor(c)} aria-label="cor"></button>)}
        </div>
        <div className="cardacts"><span style={{flex:1}}></span><button className="ghost" onClick={onClose}>Cancelar</button><button className="primary" onClick={salvar}>Salvar</button></div>
      </div>

}

function CatManager({ cats, onSave, onClose, title, subtitle, defaultCats, semSolido }){
  const [list, setList] = useState(cats.length ? cats : (defaultCats || DEFAULT_NOTECATS).slice());
  const setName = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, nome:v } : c));
  const setCor  = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, cor:v } : c));
  const setSol  = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, solido:v } : c));
  const del     = i => setList(l => l.filter((_,j) => j!==i));
  const move    = (i,d) => setList(l => { const j=i+d; if(j<0||j>=l.length) return l; const c=l.slice(); const t=c[i]; c[i]=c[j]; c[j]=t; return c; });
  const add     = () => setList(l => [...l, { key:catNewKey(), nome:semSolido ? 'Nova situação' : 'Nova cor', cor:CAT_CORES[l.length % CAT_CORES.length] }]);
  const salvar  = () => { onSave(list.filter(c => (c.nome||'').trim())); onClose(); };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>{title || 'Cores das notas'}</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <p className="sub">{subtitle || 'Renomeie, mude a cor ou crie novas. Os processos ficam agrupados por elas.'}</p>
        {list.map((c,i) => (
          <div key={c.key} className="catrow">
            <span className="catmove">
              <button className="mv" onClick={()=>move(i,-1)} disabled={i===0} title="Subir">↑</button>
              <button className="mv" onClick={()=>move(i,1)} disabled={i===list.length-1} title="Descer">↓</button>
            </span>
            <span className="catdot" style={{background:c.cor}}></span>
            <input className="inp" style={{margin:0,flex:1,minWidth:120}} value={c.nome} onChange={e=>setName(i, e.target.value)} />
            <div className="cores">{CAT_CORES.map(cc => <button key={cc} className={'corbolinha'+(c.cor===cc?' on':'')} style={{background:cc}} onClick={()=>setCor(i, cc)} aria-label="cor"></button>)}</div>
            {!semSolido && <button className={'solidtog'+(c.solido?' on':'')} style={c.solido?{background:c.cor,borderColor:c.cor,color:textOn(c.cor)}:null} onClick={()=>setSol(i, !c.solido)} title="Padrão forte pra esta cor (dá pra mudar em cada processo)">sólido</button>}
            {c.fixo ? <span className="cadeado" title="Fixa: leva o processo para Sentenças/Despachos">🔒</span> : <button className="legend-x" onClick={()=>del(i)} title="Apagar">×</button>}
          </div>
        ))}
        <button className="tipopill novo" style={{marginTop:2}} onClick={add}>{semSolido ? '+ nova situação' : '+ nova cor'}</button>
        <div className="cardacts"><span style={{flex:1}}></span><button className="ghost" onClick={onClose}>Cancelar</button><button className="primary" onClick={salvar}>Salvar</button></div>
      </div>
    </div>
  );
}

/* próxima ocorrência de um compromisso (>= hoje); se já passou e não repete, mostra a data original */
function proxData(ev){
  const hoje = todayStr();
  const fim = ymd(new Date(new Date().getFullYear() + 2, 11, 31));
  const occ = occurrences(ev, hoje, fim);
  return occ.length ? occ[0] : ev.date;
}

/* ---------- resultados da busca na agenda ---------- */
function SearchView({ query, events, tipoMap, onOpen }){
  const ql = query.trim().toLowerCase();
  const rows = events
    .filter(ev => (ev.title||'').toLowerCase().includes(ql) || (ev.note||'').toLowerCase().includes(ql))
    .map(ev => ({ ev, s: proxData(ev) }))
    .sort((a,b) => a.s === b.s ? (a.ev.time||'').localeCompare(b.ev.time||'') : a.s.localeCompare(b.s));
  return (
    <div>
      <div className="head"><div className="titulo">Busca: "{query}"</div></div>
      {rows.length === 0 && <div className="vazio">Nada encontrado na agenda para "{query}".</div>}
      {rows.map(({ ev, s }, i) => (
        <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
          <span className="ltempo" style={{minWidth:82}}>{fmtData(s)}</span>
          <span className="ltit">{ev.title || '(sem título)'}{ev.time ? ' · '+ev.time : ''}</span>
          {ev.repeat && ev.repeat.freq !== 'none' && <span className="lrep">↻ {repeatLabel(ev)}</span>}
        </div>
      ))}
    </div>
  );
}

/* ---------- lista de tudo de um dia (aberta pelo "+N" do mês) ---------- */
function DayView({ dateStr, events, tipoMap, onClose, onOpen, onNew }){
  const evs = events.filter(ev => occurrences(ev, dateStr, dateStr).length > 0).slice().sort(cmpHora);
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>{fmtLongo(dateStr)}</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <div className="daylist">
          {evs.length === 0 && <div className="hist-vazio">Nada neste dia.</div>}
          {evs.map((ev,i) => (
            <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
              <span className="ltempo">{ev.time || '—'}</span>
              <span className="ltit">{ev.title || '(sem título)'}</span>
              {ev.repeat && ev.repeat.freq !== 'none' && <span className="lrep">↻</span>}

          ))}

        <div className="cardacts"><span style={{flex:1}}></span><button className="primary" onClick={()=>onNew(dateStr)}>+ Novo neste dia</button></div>

  );
}

/* ---------- caixinha de um compromisso ja salvo (so leitura + lapis) ---------- */
function EventView({ ev, tipoMap, onClose, onEdit, onDelete }){

/* ---------- editor de evento ---------- */
function Editor({ ev, tipos, onAddTipo, onClose, onSave, onDelete }){
  const [f, setF] = useState(ev);
  const [novoTipo, setNovoTipo] = useState(false);
  const [ntNome, setNtNome] = useState('');
  const [ntCor, setNtCor] = useState(CORES_TIPO[3]);
  const set = (k,v) => setF(o => ({ ...o, [k]:v }));
  const setRep = (k,v) => setF(o => ({ ...o, repeat:{ ...o.repeat, [k]:v } }));
  const escolherTipo = t => setF(o => ({ ...o, type:t, repeat: t==='aniversario' && o.repeat.freq==='none' ? { ...o.repeat, freq:'yearly' } : o.repeat }));
  const criarTipo = () => {
    const nome = ntNome.trim();
    if (!nome) return;
    const key = onAddTipo(nome, ntCor);
    setF(o => ({ ...o, type:key }));
    setNovoTipo(false); setNtNome('');
  };

  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead">
          <b>{ev._new ? 'Novo compromisso' : 'Editar'}</b>
          <button className="x" onClick={onClose} aria-label="Fechar">×</button>
        </div>

        <input className="inp" autoFocus placeholder="Título (ex.: Audiência 5001234-00)" value={f.title} onChange={e=>set('title', e.target.value)} />

        <div className="tipos">
          {tipos.map(t => (
            <button key={t.key} className={'tipopill'+(f.type===t.key?' on':'')}
              style={f.type===t.key?{background:t.cor,borderColor:t.cor,color:'#fff'}:{}}
              onClick={()=>escolherTipo(t.key)}>{t.nome}</button>
          ))}
          <button className="tipopill novo" onClick={()=>setNovoTipo(v=>!v)}>+ novo tipo</button>
        </div>
        {novoTipo && (
          <div className="novotipo">
            <input className="inp" style={{margin:0,flex:1}} placeholder="nome do tipo (ex.: Prazo, Perícia)" value={ntNome} onChange={e=>setNtNome(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') criarTipo(); }} />
            <div className="cores">
              {CORES_TIPO.map(c => <button key={c} className={'corbolinha'+(ntCor===c?' on':'')} style={{background:c}} onClick={()=>setNtCor(c)} aria-label="cor"></button>)}
            </div>
            <button className="primary" style={{padding:'8px 14px'}} onClick={criarTipo}>Criar</button>
          </div>
        )}

        <div className="linha2">
          <label className="campo"><span>Data</span><input className="inp" type="date" value={f.date} onChange={e=>set('date', e.target.value)} /></label>
          <label className="campo"><span>Hora</span><input className="inp" type="time" value={f.time} onChange={e=>set('time', e.target.value)} /></label>
        </div>

        <label className="campo"><span>Repetir</span>
          <select className="inp" value={f.repeat.freq} onChange={e=>setRep('freq', e.target.value)}>
            {REPETE.map(r => <option key={r.v} value={r.v}>{r.nome}</option>)}
          </select>
        </label>
        {f.repeat.freq === 'custom' && (
          <div className="linha2">
            <label className="campo"><span>A cada</span><input className="inp" type="number" min="1" value={f.repeat.interval} onChange={e=>setRep('interval', Math.max(1, +e.target.value||1))} /></label>
            <label className="campo"><span>&nbsp;</span>
              <select className="inp" value={f.repeat.unit} onChange={e=>setRep('unit', e.target.value)}>
                <option value="day">dia(s)</option><option value="week">semana(s)</option><option value="month">mês(es)</option><option value="year">ano(s)</option>
              </select>
            </label>
          </div>
        )}

        <textarea className="inp" rows="2" placeholder="Anotação (opcional)" value={f.note} onChange={e=>set('note', e.target.value)} />

        <div className="cardacts">
          {!ev._new && <button className="del" onClick={()=>{ if(confirm('Apagar este compromisso?')) onDelete(f.id); }}>Apagar</button>}
          <span style={{flex:1}}></span>
          <button className="ghost" onClick={onClose}>Cancelar</button>
          <button className="primary" onClick={()=>onSave(f)}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- barra de cima: nome + busca/filtro (celular) + ajustes ---------- */
function Toolbar({ celular, onToggleNav, onAjustes, onBusca, onFiltro, filtroOn }){
  return (
    <div className="toolbar">
      {!celular && <button className="tbtn hamb" onClick={onToggleNav} title="Esconder/mostrar o menu" aria-label="Esconder ou mostrar o menu">☰</button>}

/* ---------- Ajustes: aparência, sincronizar, backup, importar, tipos, situações ---------- */
function AjustesModal({ tipos, onClose, onSync, onEditTipo, onNewTipo, onDelTipo, onSits }){
  const [theme, setTheme] = useState(document.documentElement.getAttribute('data-theme'));
  const [cor, setCor] = useState(document.documentElement.getAttribute('data-cor'));
  const setT = t => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('agenda-theme', t); setTheme(t); };
  const setC = c => { document.documentElement.setAttribute('data-cor', c); localStorage.setItem('agenda-cor', c); setCor(c); };
  const cores = [['amarelo','#facc15'],['rosa','#E85D9A'],['azul','#2F6FE4'],['roxo','#7C4DE0']];
  const S = window.AgendaSync || {};
  const ligada = S.isOn ? S.isOn() : false;
  const exportar = () => {
    const dados = {}; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.indexOf('agenda-')===0 && k.indexOf('agenda-snap:')!==0) dados[k]=localStorage.getItem(k); }
    const blob = new Blob([JSON.stringify({ _app:'agendanad', em:new Date().toISOString(), dados }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agendanad-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const importar = () => {
    // junta arrays (eventos/notas) por id, sem apagar o que já existe; outras chaves sobrescrevem
    const mergeArr = (atual, novo) => {
      const map = new Map();
      try { (JSON.parse(atual||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      try { (JSON.parse(novo||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      return JSON.stringify([...map.values()]);
    };
    const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange = e => { const file=e.target.files[0]; if(!file) return; const r=new FileReader();
      r.onload = () => { try {
        const p=JSON.parse(r.result); const d=p.dados||p; let n=0;
        Object.keys(d).forEach(k=>{
          if(k.indexOf('agenda-')!==0) return;
          if(k==='agenda-events' || k==='agenda-notes' || k==='agenda-audiencias' || k==='agenda-roteiros') localStorage.setItem(k, mergeArr(localStorage.getItem(k), d[k]));
          else localStorage.setItem(k, d[k]);
          n++;
        });
        alert('Importado e juntado com o que você já tinha ('+n+' itens). A página vai recarregar.');
        location.reload();
      } catch(err){ alert('Arquivo inválido.'); } };
      r.readAsText(file); };
    inp.click();
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>Ajustes</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <div className="ajgrp">Aparência</div>
        <div className="ajrow">
          <span className="corsw-group">{cores.map(([k,c]) => <button key={k} className={'corsw'+(cor===k?' on':'')} style={{background:c}} onClick={()=>setC(k)} title={k}></button>)}</span>
          <span style={{flex:1}}></span>
          <button className={'tbtn'+(theme==='light'?' on':'')} onClick={()=>setT('light')} title="Claro">☀ Claro</button>
          <button className={'tbtn'+(theme!=='light'?' on':'')} onClick={()=>setT('dark')} title="Escuro">☾ Escuro</button>
        </div>
        <div className="ajgrp">Seus dados</div>
        <button className="sheetitem" onClick={onSync}><span>☁ Sincronizar entre aparelhos</span><span className={'navn'+(ligada?' verde':'')}>{ligada ? 'ligado' : 'desligado'}</span></button>
        <button className="sheetitem" onClick={exportar}><span>⇩ Fazer backup</span></button>
        <button className="sheetitem" onClick={importar}><span>⇧ Importar backup</span></button>
        <div className="ajgrp">Tipos de compromisso</div>
        {tipos.map(t => (
          <div key={t.key} className="ajtipo">
            <span className="dot" style={{background:t.cor}}></span><span className="legend-nome">{t.nome}</span>
            <button className="legend-ed" title="Editar tipo" onClick={()=>onEditTipo(t)}>✎</button>
            <button className="legend-x" title="Apagar tipo" onClick={()=>{ if(confirm('Apagar o tipo "'+t.nome+'"? Os compromissos já marcados com ele continuam na agenda.')) onDelTipo(t.key); }}>×</button>
          </div>
        ))}
        <button className="legend-add" onClick={onNewTipo}>+ novo tipo</button>
        <div className="ajgrp">Painel de trabalho</div>
        <button className="sheetitem" onClick={onSits}><span>Situações dos processos</span><span className="navn">editar</span></button>
      </div>
    </div>
  );
}

/* ---------- botão de copiar ---------- */
function copiar(txt){
  const fb = () => { try { const t = document.createElement('textarea'); t.value = txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); } catch(e){} };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(fb); else fb(); } catch(e){ fb(); }
}
function CopyBtn({ txt, label }){
  const [ok, setOk] = useState(false);
  return <button className={'copybtn'+(ok?' ok':'')} title="Copiar" onClick={e=>{ e.stopPropagation(); copiar(txt); setOk(true); setTimeout(()=>setOk(false), 1300); }}>{ok ? '✓ copiado' : (label || '⧉')}</button>;
}
const sitDe = (sits, k) => sits.find(s => s.key === k) || null;
const textoNejul = (p, sits) => { const s = sitDe(sits, p.sit); return [s && s.nome.toUpperCase(), p.pend, p.obs].filter(Boolean).join(' — '); };
const partesTxt = p => (p.autores && p.autores.length) ? p.autores[0] + (p.reus && p.reus.length ? ' x ' + p.reus[0] : '') : '';
function TagsPaineis({ p }){
  const algum = p.inN || p.inE || p.inC;
  return <span className="pc-tags">{p.inN && <i>NEJUL</i>}{p.inE && <i>EPROC</i>}{p.inC && <i>CEJUSC</i>}{!algum && <i className="off">fora dos painéis</i>}</span>;
}

/* ---------- PAINEL DE TRABALHO ---------- */
function PainelView({ painel, lista, sits, hoje, onUpd, onAbrir, onSits, onAviso, onDispensar, onNovo, celular, onColar }){
  const [filtro, setFiltro] = useState(() => lerLocal('agendaloc-filtro') || 'todos');
  const [q, setQ] = useState('');
  const escolher = f => { setFiltro(f); gravarLocal('agendaloc-filtro', f); };
  const ativos = lista.filter(p => !p.arquivado);
  const arquivados = lista.filter(p => p.arquivado);
  const contaSit = k => ativos.filter(p => p.sit === k).length;
  const semSit = ativos.filter(p => !p.sit || !sitDe(sits, p.sit)).length;
  const nNejul = ativos.filter(p => p.nejulAtualizar).length;
  let base = filtro === '__arq' ? arquivados : ativos;
  if (filtro === '__sem') base = ativos.filter(p => !p.sit || !sitDe(sits, p.sit));
  else if (filtro === '__nejul') base = ativos.filter(p => p.nejulAtualizar);
  else if (filtro !== 'todos' && filtro !== '__arq') base = ativos.filter(p => p.sit === filtro);
  const qd = soDigitos(q), ql = q.trim().toLowerCase();
  const mostrar = !ql ? base : base.filter(p => (qd.length >= 3 && soDigitos(p.key).includes(qd)) ||
    [p.pend, p.obs, partesTxt(p), (sitDe(sits, p.sit) || {}).nome].some(t => (t || '').toLowerCase().includes(ql)));
  const chip = (id, label, n, cor) => (
    <button key={id} className={'fchip'+(filtro===id?' on':'')} style={cor ? {'--c':cor} : null} onClick={()=>escolher(id)}>
      {cor && <span className="dot" style={{background:cor}}></span>}{label}<span className="fchip-n">{n}</span>
    </button>
  );
  const novo = () => { const num = prompt('Número do processo (vai para o fim da lista):'); if (!num) return; if (!onNovo(num)) alert('Não reconheci o número. Use o formato 0000000-00.0000.0.00.0000.'); };
  const c = painel.contagem;
  const ult = painel.ultimaColagem ? new Date(painel.ultimaColagem) : null;
  return (
    <div>
      <div className="head">
        <div>
          <div className="titulo">Painel de trabalho</div>
          {ult && <div className="subtit">Última colagem: {pad(ult.getDate())}/{pad(ult.getMonth()+1)} às {pad(ult.getHours())}:{pad(ult.getMinutes())}{c ? ' · NEJUL ' + c.nejul + ' · EPROC ' + c.eproc + ' · CEJUSC ' + c.cejusc : ''}</div>}
        </div>
        <div className="headbtns">
          <button className="navbtn" onClick={onSits}>Situações</button>
          <button className="navbtn" onClick={novo}>+ Processo</button>
        </div>
      </div>
      {lista.length === 0 && (
        <div className="vazio">Ainda não há processos aqui. {celular ? 'No computador, abra "Colar painéis" e cole as telas do CEJUSC, do NEJUL e do EPROC.' : <span>Abra <button className="linkbtn" onClick={onColar}>Colar painéis</button> e cole as telas do CEJUSC, do NEJUL e do EPROC.</span>}</div>
      )}
      {painel.avisos.length > 0 && <AvisosBox avisos={painel.avisos} procs={painel.procs} sits={sits} onAviso={onAviso} onDispensar={onDispensar} onAbrir={onAbrir} onUpd={onUpd} />}
      {lista.length > 0 && (
        <React.Fragment>
          <div className="fchips">
            {chip('todos', 'Todos', ativos.length)}
            {sits.filter(s => contaSit(s.key) > 0).map(s => chip(s.key, s.nome, contaSit(s.key), s.cor))}
            {semSit > 0 && chip('__sem', 'Sem situação', semSit, '#a1a1aa')}
            {nNejul > 0 && chip('__nejul', 'Atualizar no NEJUL', nNejul, '#f97316')}
            {arquivados.length > 0 && chip('__arq', 'Fora da lista', arquivados.length)}
          </div>
          <div className="buscaWrap">
            <span className="buscaIco">⌕</span>
            <input className="busca" placeholder="Buscar número, parte ou anotação…" value={q} onChange={e=>setQ(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
            {q && <button className="buscaX" onClick={()=>setQ('')} aria-label="Limpar">×</button>}
          </div>
          {mostrar.length === 0 && <div className="vazio">Nenhum processo neste filtro.</div>}
          <div className="pgrid">
            {mostrar.map(p => <ProcCard key={p.key} p={p} sits={sits} hoje={hoje} onUpd={onUpd} onAbrir={onAbrir} />)}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// campo de texto que só grava ao sair dele (não regrava a cada letra)
function CampoTexto({ valor, onGravar, multi, placeholder }){
  const [v, setV] = useState(valor || '');
  const ref = useRef(null);
  useEffect(() => { setV(valor || ''); }, [valor]);
  const ajusta = () => { const el = ref.current; if (el && multi){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } };
  useEffect(ajusta, [v]);
  const gravar = () => { if ((v || '') !== (valor || '')) onGravar(v.trim()); };
  return multi
    ? <textarea ref={ref} className="pc-inp" rows="1" value={v} placeholder={placeholder} onChange={e=>setV(e.target.value)} onBlur={gravar} />
    : <input ref={ref} className="pc-inp" value={v} placeholder={placeholder} onChange={e=>setV(e.target.value)} onBlur={gravar} onKeyDown={e=>{ if (e.key === 'Enter') e.target.blur(); }} />;
}
function SelSituacao({ valor, sits, onEscolher }){
  const s = sitDe(sits, valor);
  return (
    <select className="pc-sel" value={s ? valor : ''} style={s ? {'--c':s.cor} : null} onChange={e=>onEscolher(e.target.value)}>
      <option value="">— escolher —</option>
      {sits.map(x => <option key={x.key} value={x.key}>{x.nome}</option>)}
    </select>
  );
}
function ProcCard({ p, sits, hoje, onUpd, onAbrir }){
  const s = sitDe(sits, p.sit);
  const a = antiguidade(p, hoje);
  const aij = aijMarcada(p);
  const futura = aij && aij.date >= hoje;
  const novo = !!p.novo;
  const info = [textoAntig(a), futura ? 'AIJ ' + fmtAij(aij) : '', partesTxt(p)].filter(Boolean);
  return (
    <div className={'pcard'+(p.arquivado?' arquivada':'')} style={{'--c': s ? s.cor : '#a1a1aa'}}>
      <div className="pc-top">
        <span className="pc-num">{p.key}</span>
        <CopyBtn txt={p.key} />
        {novo && <span className="pc-novo">novo</span>}
        <span className="pc-dir"><TagsPaineis p={p} /><button className="pc-mais" onClick={()=>onAbrir(p.key)} title="Abrir tudo" aria-label="Abrir tudo">⋯</button></span>
      </div>
      <div className="pc-info">{info.join(' · ')}</div>
      <div className="pc-campo"><span>Situação</span><SelSituacao valor={p.sit} sits={sits} onEscolher={v=>onUpd(p.key, { sit:v })} /></div>
      <div className="pc-campo"><span>Pendência</span><CampoTexto valor={p.pend} placeholder="nenhuma" onGravar={v=>onUpd(p.key, { pend:v })} /></div>
      <div className="pc-campo"><span>Observação</span><CampoTexto multi valor={p.obs} placeholder="—" onGravar={v=>onUpd(p.key, { obs:v })} /></div>
      {p.nejulAtualizar && (
        <div className="pc-nejul">
          <div><b>Atualizar no NEJUL:</b> {textoNejul(p, sits) || '(em branco)'}</div>
          <div className="pc-nejul-b"><CopyBtn txt={textoNejul(p, sits)} label="copiar texto" /><button className="minibtn" onClick={()=>onUpd(p.key, { nejulAtualizar:false })}>já atualizei</button></div>
        </div>
      )}
    </div>
  );
}

/* ---------- avisos da colagem: o que mudou de um dia para o outro ---------- */

  const btn = (av, acao, label, forte) => <button className={forte ? 'minibtn forte' : 'minibtn'} onClick={()=>onAviso(av, acao)}>{label}</button>;

            <div className="aviso-txt">{av.texto}</div>

            <div className="aviso-b">
              {av.tipo === 'saiu' && <React.Fragment>{btn(av, 'assinado', 'Sim, foi assinado', true)}{btn(av, 'tirar', 'Tirar da lista')}{btn(av, 'ok', 'Não, deixar')}</React.Fragment>}
              {av.tipo === 'novo' && <React.Fragment><button className="minibtn forte" onClick={()=>{ onAbrir(av.key); onAviso(av, 'ok'); }}>Preencher</button>{btn(av, 'ok', 'Ok')}</React.Fragment>}
              {av.tipo === 'devolvido' && <React.Fragment>{btn(av, 'sentenciar', 'Voltar para Sentenciar', true)}{btn(av, 'ok', 'Ok')}</React.Fragment>}
              {av.tipo === 'entregueN' && <React.Fragment>{btn(av, 'entregar', 'Mover para entregues', true)}{btn(av, 'ok', 'Ok')}</React.Fragment>}
              {av.tipo === 'nejul' && <React.Fragment><CopyBtn txt={textoNejul(p, sits)} label="copiar texto" /><button className="minibtn" onClick={()=>{ onUpd(av.key, { nejulAtualizar:false }); onAviso(av, 'ok'); }}>Já atualizei</button></React.Fragment>}

/* ---------- editor completo do processo ---------- */

        </div>
      </div>

  );

/* ---------- Para sentenciar / Para despachar: antiguidade (o mais velho em cima) ---------- */
function FilaView({ titulo, sit, lista, sits, hoje, onAbrir }){
  const itens = lista.filter(p => p.sit === sit && !p.arquivado).map(p => ({ p, a:antiguidade(p, hoje) })).sort((x, y) => y.a.n - x.a.n);
  const nomeSit = (sitDe(sits, sit) || {}).nome || sit;
  return (
    <div>
      <div className="head"><div><div className="titulo">{titulo}</div><div className="subtit">{itens.length} {itens.length === 1 ? 'processo' : 'processos'} · do mais antigo para o mais novo</div></div></div>
      {itens.length === 0 && <div className="vazio">Nada aqui. O processo entra sozinho quando você marca a situação <b>{nomeSit}</b> no Painel de trabalho.</div>}
      {itens.map(({ p, a }) => {
        const aij = aijMarcada(p); const futura = aij && aij.date >= hoje;

/* ---------- Audiências: CEJUSC + NEJUL + as que ela põe à mão (na agenda ou no processo) ---------- */
function juntarAudiencias(painel, events, hoje){
  const out = (painel.aud || []).map(a => ({ ...a }));
  const tem = (key, date) => out.find(x => x.key && x.key === key && x.date === date);
  Object.values(painel.procs).forEach(p => {
    if (p.aijManual && p.aijManual.date && !tem(p.key, p.aijManual.date)) out.push({ key:p.key, date:p.aijManual.date, time:p.aijManual.time || '', fonte:'à mão' });
  });
  const ini = ymd(addDays(parseYmd(hoje), -400)), fim = ymd(addDays(parseYmd(hoje), 730));
  events.filter(ev => ev.type === 'audiencia').forEach(ev => {
    const key = chaveProc((ev.title || '') + ' ' + (ev.note || ''));
    occurrences(ev, ini, fim).forEach(d => {
      const ja = key && tem(key, d);
      if (ja) { ja.ev = ev; if (!ja.time && ev.time) ja.time = ev.time; return; }
      out.push({ key, date:d, time:ev.time || '', fonte:'agenda', ev, titulo:ev.title });
    });
  });
  out.sort((a, b) => a.date === b.date ? (a.time || '').localeCompare(b.time || '') : a.date.localeCompare(b.date));
  // conflito de pauta: duas audiências no mesmo dia com menos de 1h30 entre elas (a pauta anda de 1h30 em 1h30)
  const min = t => { const m = (t || '').match(/(\d{2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
  out.forEach((a, i) => { a.conflito = out.some((b, j) => j !== i && b.date === a.date && min(a.time) !== null && min(b.time) !== null && Math.abs(min(a.time) - min(b.time)) < 90); });
  return out;
}
function AudienciasView({ itens, procs, sits, hoje, onNovo, onAbrirEv, onAbrirProc }){

  const [passadas, setPassadas] = useState(false);
  const futuras = itens.filter(a => a.date >= hoje);
  const velhas = itens.filter(a => a.date < hoje).reverse();
  const abrir = a => { if (a.ev) onAbrirEv(a.ev); else if (a.key && procs[a.key]) onAbrirProc(a.key); };
  const linha = (a, i) => {
    const p = a.key && procs[a.key]; const s = p && sitDe(sits, p.sit);
    return (
      <div key={i} className={'audrow'+(a.conflito?' conflito':'')} onClick={()=>abrir(a)}>
        <span className="ltempo">{a.time || '—'}</span>
        <span className="aud-corpo">
          {a.key ? <span className="aud-top"><span className="pc-num">{a.key}</span><CopyBtn txt={a.key} /></span> : <span className="ltit">{a.titulo || 'Audiência'}</span>}
          <span className="aud-meta">{s && <span className="sitchip" style={{'--c':s.cor}}>{s.nome}</span>}<span className="aud-fonte">{a.fonte}</span>{a.conflito && <span className="aud-conf">mesmo horário</span>}</span>

  const porDia = lista => { const g = []; lista.forEach(a => { let x = g[g.length - 1]; if (!x || x.d !== a.date){ x = { d:a.date, l:[] }; g.push(x); } x.l.push(a); }); return g; };
  return (
    <div>
      <div className="head">
        <div><div className="titulo">Audiências</div><div className="subtit">{futuras.length} daqui para frente</div></div>
        <div className="headbtns">

            <button className={'segb'+(modo==='lista'?' on':'')} onClick={()=>setModo('lista')}>Lista</button>

          </div>
          <button className="navbtn soPc" onClick={()=>onNovo()}>+ À mão</button>
        </div>
      </div>
      {modo === 'lista' && (
        <React.Fragment>
          {futuras.length === 0 && <div className="vazio">Nenhuma audiência daqui para frente.</div>}
          {porDia(futuras).map(g => (
            <div key={g.d} className="diagrp">
              <div className={'diahead'+(g.d===hoje?' ehoje':'')}>{g.d===hoje?'Hoje — ':''}{fmtLongo(g.d)}</div>
              {g.l.map(linha)}
            </div>
          ))}
          {velhas.length > 0 && <button className="ghost" style={{marginTop:6}} onClick={()=>setPassadas(v=>!v)}>{passadas ? 'Esconder as que já passaram' : 'Ver as que já passaram (' + velhas.length + ')'}</button>}
          {passadas && <div style={{marginTop:14,opacity:.8}}>{porDia(velhas).map(g => (
            <div key={g.d} className="diagrp"><div className="diahead">{fmtLongo(g.d)} · {fmtData(g.d).slice(-4)}</div>{g.l.map(linha)}</div>
          ))}</div>}
        </React.Fragment>
      )}
      {modo === 'mes' && <AudMes itens={itens} hoje={hoje} linha={linha} onNovo={onNovo} />}
    </div>
  );
}
function AudMes({ itens, hoje, linha, onNovo }){
  const [ref, setRef] = useState(hoje);
  const [sel, setSel] = useState(hoje);
  const r = parseYmd(ref); const y = r.getFullYear(), m = r.getMonth();
  const primeiro = new Date(y, m, 1);
  let cells = Array.from({length:42}, (_,i) => new Date(y, m, 1 - primeiro.getDay() + i));
  if (cells.slice(35).every(d => d.getMonth() !== m)) cells = cells.slice(0, 35);
  const porDia = {}; itens.forEach(a => { (porDia[a.date] = porDia[a.date] || []).push(a); });
  const go = d => { const n = new Date(y, m + d, 1); setRef(ymd(n)); setSel(ymd(n)); };
  const doDia = porDia[sel] || [];
  return (
    <div>
      <ViewHeader title={cap(MESES[m]) + ' ' + y} onPrev={()=>go(-1)} onNext={()=>go(1)} onToday={()=>{ setRef(hoje); setSel(hoje); }} />
      <div className="mc-week">{DIAS.map(d => <div key={d}>{d[0].toUpperCase()}</div>)}</div>
      <div className="mc-grid">
        {cells.map((d, i) => { const s = ymd(d); const n = (porDia[s] || []).length; const conf = (porDia[s] || []).some(a => a.conflito);
          return (
            <button key={i} className={'mc-day'+(d.getMonth()!==m?' fora':'')+(s===hoje?' hoje':'')+(s===sel?' sel':'')} onClick={()=>setSel(s)}>
              <span className="mc-num">{d.getDate()}</span>
              <span className="mc-dots">{n > 0 && <span className={'mc-cont'+(conf?' conf':'')}>{n}</span>}</span>
            </button>
          ); })}
      </div>
      <div className="mc-dia">
        <div className="mc-diatit">{sel === hoje ? 'Hoje — ' : ''}{fmtLongo(sel)}</div>
        {doDia.length === 0 && <div className="mc-vazio">Nenhuma audiência neste dia.</div>}
        {doDia.map(linha)}
        <button className="mc-novo" onClick={()=>onNovo(sel)}>+ audiência à mão neste dia</button>
      </div>
    </div>
  );
}

/* ---------- Colar painéis (só no computador) ---------- */
function ColarView({ painel, onLer, onTrazer, onVer }){
  const [raw, setRaw] = useState(() => ({ cejusc:lerLocal(RAWKEY.cejusc), nejul:lerLocal(RAWKEY.nejul), eproc:lerLocal(RAWKEY.eproc) }));
  const [msg, setMsg] = useState('');
  const muda = (k, v) => { setRaw(o => ({ ...o, [k]:v })); gravarLocal(RAWKEY[k], v); };
  const ler = () => {
    if (!raw.nejul.trim() && !raw.eproc.trim() && !raw.cejusc.trim()){ setMsg('Cole pelo menos uma das telas primeiro.'); return; }
    const r = onLer(raw); const c = r.contagem;
    setMsg('Pronto: ' + c.nejul + ' processos no NEJUL, ' + c.eproc + ' no EPROC e ' + c.cejusc + ' horários no CEJUSC. ' + (r._novos ? r._novos + (r._novos === 1 ? ' mudança' : ' mudanças') + ' para você ver no Painel de trabalho.' : 'Nada mudou desde a última colagem.'));
  };
  const trazer = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = e => { const file = e.target.files[0]; if (!file) return; const fr = new FileReader();
      fr.onload = () => { try { const d = JSON.parse(fr.result); if (d._app !== 'agendanad-semente') throw 0;
        const n = onTrazer(d); if (d.colagem) setRaw(o => ({ cejusc:o.cejusc || d.colagem.cejusc || '', nejul:o.nejul || d.colagem.nejul || '', eproc:o.eproc || d.colagem.eproc || '' }));
        setMsg('Trouxe as anotações de ' + n + ' processos. Confira no Painel de trabalho.'); } catch(err){ setMsg('Esse arquivo não é o da primeira carga do painel.'); } };
      fr.readAsText(file); };
    inp.click();
  };
  const caixa = (k, nome, dica) => (
    <div className="colar-cx">
      <div className="colar-h"><b>{nome}</b><span>{raw[k] ? raw[k].length.toLocaleString('pt-BR') + ' caracteres' : 'vazio'}</span>{raw[k] && <button className="linkbtn" onClick={()=>muda(k, '')}>limpar</button>}</div>
      <textarea className="inp colar-ta" value={raw[k]} onChange={e=>muda(k, e.target.value)} placeholder={dica} spellCheck="false" />
    </div>
  );
  const ult = painel.ultimaColagem ? new Date(painel.ultimaColagem) : null;
  return (
    <div>
      <div className="head"><div><div className="titulo">Colar painéis</div><div className="subtit">{ult ? 'Última colagem: ' + pad(ult.getDate()) + '/' + pad(ult.getMonth()+1) + ' às ' + pad(ult.getHours()) + ':' + pad(ult.getMinutes()) : 'Ainda não colou nenhuma vez.'}</div></div></div>
      <p className="sub">Em cada sistema, selecione a tela inteira (Cmd+A), copie (Cmd+C) e cole aqui. Depois toque em <b>Ler os painéis</b>: o app compara com o que você já tinha e mostra só o que mudou.</p>
      <div className="colar-grid">
        {caixa('cejusc', 'CEJUSC', 'Cole aqui a pauta do CEJUSC')}
        {caixa('nejul', 'NEJUL', 'Cole aqui o painel do NEJUL')}
        {caixa('eproc', 'EPROC', 'Cole aqui os relatórios do EPROC, um embaixo do outro')}
      </div>
      <div className="cardacts" style={{marginTop:12}}>
        <button className="primary" onClick={ler}>Ler os painéis</button>
        {msg && <button className="ghost" onClick={onVer}>Ver o painel de trabalho</button>}
      </div>
      {msg && <div className="colar-msg">{msg}</div>}
      <div className="colar-jus">
        <b>Primeira carga</b>
        <span>Traz para cá as anotações do Desenrolar (JusNAD). Só preenche o que estiver vazio.</span>
        <button className="ghost" onClick={trazer}>Escolher o arquivo</button>
      </div>
    </div>
  );
}

function SyncModal({ onClose }){
  const S = window.AgendaSync || {};
  const [phrase, setPhrase] = useState(S.phrase ? S.phrase() : '');
  const [msg, setMsg] = useState('');
  const configured = S.configured ? S.configured() : false;
  const on = S.isOn ? S.isOn() : false;
  const ligar = () => {
    const p = (phrase||'').trim();
    if (!configured){ setMsg('O cofre ainda não foi configurado.'); return; }
    if (!p){ setMsg('Digite a frase primeiro.'); return; }
    setMsg('Sincronizando…');
    S.enable(p, ok => ok ? location.reload() : setMsg('Não consegui ligar. Confira a conexão.'));
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>☁ Sincronizar entre aparelhos</b><button className="x" onClick={onClose}>×</button></div>
        <p className="sub">Digite a <b>mesma frase secreta</b> no iPhone, iPad e Mac. É ela que liga a sua agenda entre eles. Pode ser a mesma que você usa no MagisNAD.</p>
        <input className="inp" autoCapitalize="off" autoCorrect="off" spellCheck="false" placeholder="sua frase secreta" value={phrase} onChange={e=>setPhrase(e.target.value)} />
        <div className="sub" style={{marginTop:8}}>{on ? '✓ Ligada neste aparelho.' : (configured ? 'Desligada neste aparelho.' : '⏳ Cofre não configurado.')}</div>
        {msg && <div className="sub" style={{color:'var(--accent)'}}>{msg}</div>}
        <div className="cardacts">
          <button className="del" onClick={()=>{ if(S.disable) S.disable(); location.reload(); }}>Desligar aqui</button>
          <span style={{flex:1}}></span>
          <button className="primary" onClick={ligar}>Ligar</button>
        </div>
      </div>
    </div>
  );
}
