<script>
(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('agenda-theme') || 'dark'); })();
(function(){ document.documentElement.setAttribute('data-cor', localStorage.getItem('agenda-cor') || 'amarelo'); })();
// indicador "salvo" + gancho de sincronizacao
(function(){
  var orig = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    orig.apply(this, arguments);
    if (String(k).indexOf('agenda-') === 0 && window.__syncOnWrite) window.__syncOnWrite(String(k));
  };
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* versão do app — bater igual ao conteúdo de version.txt; ao trocar as duas, aparece o aviso "Atualizar" */
const APP_VERSION = '2026-08-05-3';

// cor do texto que contrasta com um fundo sólido (claro -> texto escuro; escuro -> branco)
const textOn = hex => { const c = (hex||'#000').replace('#',''); const r=parseInt(c.slice(0,2),16)||0, g=parseInt(c.slice(2,4),16)||0, b=parseInt(c.slice(4,6),16)||0; return (0.299*r+0.587*g+0.114*b)/255 > 0.62 ? '#231a05' : '#ffffff'; };

/* ---------- datas (sempre em horario local, sem fuso) ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS_LONGO = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const cap = t => t ? t.charAt(0).toUpperCase()+t.slice(1) : t;
const fmtLongo = s => { const d = parseYmd(s); return cap(DIAS_LONGO[d.getDay()])+', '+d.getDate()+' de '+MESES[d.getMonth()]; };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const weekStart = d => addDays(d, -d.getDay());   // volta ate domingo
const weekTitle = ws => { const we = addDays(ws,6);
  return ws.getMonth()===we.getMonth()
    ? ws.getDate()+' a '+we.getDate()+' de '+MESES[ws.getMonth()]
    : ws.getDate()+' de '+MESES[ws.getMonth()].slice(0,3)+' a '+we.getDate()+' de '+MESES[we.getMonth()].slice(0,3); };

const DEFAULT_TIPOS = [
  { key:'audiencia',   nome:'Audiência',   cor:'#2F6FE4', fixo:true },
  { key:'compromisso', nome:'Compromisso', cor:'#f59e0b', fixo:true },
  { key:'aniversario', nome:'Aniversário', cor:'#E85D9A', fixo:true },
];
const FALLBACK_TIPO = { nome:'Outro', cor:'#a1a1aa' };
const CORES_TIPO = ['#2F6FE4','#f59e0b','#E85D9A','#7C4DE0','#10b981','#ef4444','#14b8a6','#eab308','#6366f1','#f97316'];
const TKEY = 'agenda-types';
function loadUserTipos(){ try { return JSON.parse(localStorage.getItem(TKEY) || '[]'); } catch(e){ return []; } }
function saveUserTipos(l){ localStorage.setItem(TKEY, JSON.stringify(l)); }
const tipoNewKey = () => 'u' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);
function mapa(tiposList){ const m = {}; tiposList.forEach(t => { m[t.key] = t; }); return m; }
const REPETE = [
  { v:'none',    nome:'Não repete' },
  { v:'weekly',  nome:'Toda semana' },
  { v:'monthly', nome:'Todo mês' },
  { v:'yearly',  nome:'Todo ano' },
  { v:'custom',  nome:'Personalizado' },
];

/* ---------- ocorrencias de um evento dentro de um intervalo [rs, re] (strings YYYY-MM-DD) ---------- */
function occurrences(ev, rs, re){
  const rep = ev.repeat || { freq:'none' };
  const start = parseYmd(ev.date);
  const reD = parseYmd(re);
  const out = [];
  if (rep.freq === 'none'){ if (ev.date >= rs && ev.date <= re) out.push(ev.date); return out; }
  const interval = Math.max(1, rep.interval || 1);
  const sy = start.getFullYear(), sm = start.getMonth(), sd = start.getDate();
  let unit = rep.freq, step = interval;
  if (rep.freq === 'custom'){ unit = rep.unit || 'week'; }
  for (let n = 0, guard = 0; guard < 4000; n++, guard++){
    let d;
    if (unit === 'weekly' || unit === 'week'){ d = new Date(sy, sm, sd + 7 * step * n); }
    else if (unit === 'day'){ d = new Date(sy, sm, sd + step * n); }
    else if (unit === 'monthly' || unit === 'month'){ d = new Date(sy, sm + step * n, sd); if (d.getDate() !== sd) continue; }
    else if (unit === 'yearly' || unit === 'year'){ d = new Date(sy + step * n, sm, sd); if (d.getDate() !== sd || d.getMonth() !== sm) continue; }
    else { d = new Date(sy, sm, sd); }
    if (d > reD) break;
    const s = ymd(d);
    if (s >= rs && s <= re) out.push(s);
  }
  return out;
}
// ordena por horário; sem hora (dia inteiro) vem primeiro
function cmpHora(a, b){ const ta = a.time||'', tb = b.time||''; if (!ta && !tb) return 0; if (!ta) return -1; if (!tb) return 1; return ta.localeCompare(tb); }
function repeatLabel(ev){
  const r = ev.repeat || { freq:'none' };
  if (r.freq === 'none') return '';
  if (r.freq === 'weekly') return 'toda semana';
  if (r.freq === 'monthly') return 'todo mês';
  if (r.freq === 'yearly') return 'todo ano';
  const u = { day:'dia', week:'semana', month:'mês', year:'ano' }[r.unit || 'week'];
  const i = Math.max(1, r.interval || 1);
  return i === 1 ? ('todo '+u) : ('a cada '+i+' '+u+(i>1 && r.unit!=='month'?'s':''));
}

/* ---------- armazenamento ---------- */
const KEY = 'agenda-events';
function loadEvents(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
function saveEvents(list){ localStorage.setItem(KEY, JSON.stringify(list)); }
let _id = Date.now();
const newId = () => 'e' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);

/* ---------- notas (processos) ---------- */
const NKEY = 'agenda-notes';
const CATKEY = 'agenda-notecats';
const DEFAULT_NOTECATS = [
  { key:'verde',    nome:'Verde',    cor:'#10b981' },
  { key:'amarelo',  nome:'Amarelo',  cor:'#eab308' },
  { key:'vermelho', nome:'Vermelho', cor:'#ef4444' },
];
const CAT_CORES = ['#10b981','#eab308','#ef4444','#2F6FE4','#7C4DE0','#E85D9A','#14b8a6','#f97316','#6366f1','#64748b'];
function loadNoteCats(){ try { const s = JSON.parse(localStorage.getItem(CATKEY) || 'null'); return (s && s.length) ? s : DEFAULT_NOTECATS.slice(); } catch(e){ return DEFAULT_NOTECATS.slice(); } }
function saveNoteCats(l){ localStorage.setItem(CATKEY, JSON.stringify(l)); }
const catNota = (cats, k) => (cats.find(c => c.key === k) || { nome:'Sem categoria', cor:'#a1a1aa' });
const catNewKey = () => 'c' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);
const soDigitos = s => (s || '').replace(/\D/g, '');
const fmtData = s => { const d = parseYmd(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
// histórico: mais recente primeiro
const cmpEntry = (a,b) => a.date === b.date ? (a.id < b.id ? 1 : -1) : (a.date < b.date ? 1 : -1);
// converte nota antiga (um campo 'obs') para o formato novo (lista de anotações com data)
function normNote(n){ if (Array.isArray(n.entries)) return n; const e = []; if (n.obs) e.push({ id:(n.id||'n')+'-0', date: n.date || todayStr(), text:n.obs }); const c = { ...n, entries:e }; delete c.obs; return c; }
function loadNotes(){ try { return (JSON.parse(localStorage.getItem(NKEY) || '[]')).map(normNote); } catch(e){ return []; } }
function saveNotes(list){ localStorage.setItem(NKEY, JSON.stringify(list)); }

/* ================= App ================= */
function App(){
  const [events, setEvents] = useState(loadEvents);
  const [view, setView] = useState('mes');          // 'mes' | 'semana' | 'ano' | 'lista'
  const [refStr, setRefStr] = useState(todayStr()); // data de referencia comum a todas as visoes
  const [editing, setEditing] = useState(null);      // evento em edicao/criacao ou null
  const [viewing, setViewing] = useState(null);      // evento aberto so pra ver (ja salvo)
  const [dayView, setDayView] = useState(null);      // data (string) com a lista do dia aberta
  const [busca, setBusca] = useState('');            // busca na agenda (eventos)
  const [syncOpen, setSyncOpen] = useState(false);
  const [navHidden, setNavHidden] = useState(() => localStorage.getItem('agenda-nav') === 'hide');
  const [userTipos, setUserTipos] = useState(loadUserTipos);
  const [notes, setNotes] = useState(loadNotes);
  const [noteCats, setNoteCats] = useState(loadNoteCats);
  const [catsOpen, setCatsOpen] = useState(false);
  const [noteView, setNoteView] = useState(null);   // nota aberta so pra ver
  const [noteEdit, setNoteEdit] = useState(null);    // nota em edicao/criacao
  const toggleNav = () => setNavHidden(v => { const n = !v; localStorage.setItem('agenda-nav', n ? 'hide' : 'show'); return n; });
  const first = useRef(true);
  const firstT = useRef(true);
  const firstN = useRef(true);
  const firstC = useRef(true);

  const tipos = [...DEFAULT_TIPOS, ...userTipos];
  const tipoMap = mapa(tipos);

  useEffect(() => { if (first.current){ first.current = false; return; } saveEvents(events); }, [events]);
  useEffect(() => { if (firstT.current){ firstT.current = false; return; } saveUserTipos(userTipos); }, [userTipos]);
  useEffect(() => { if (firstN.current){ firstN.current = false; return; } saveNotes(notes); }, [notes]);
  useEffect(() => { if (firstC.current){ firstC.current = false; return; } saveNoteCats(noteCats); }, [noteCats]);
  // avisa quando há versão nova publicada (sem recarregar na mão)
  const [updateReady, setUpdateReady] = useState(false);
  useEffect(() => {
    let stop = false;
    const check = () => {
      fetch('version.txt?t=' + Date.now(), { cache:'no-store' })
        .then(r => r.ok ? r.text() : null)
        .then(t => { if (!stop && t && t.trim() && t.trim() !== APP_VERSION) setUpdateReady(true); })
        .catch(()=>{});
    };
    check();
    const id = setInterval(() => { if (document.visibilityState === 'visible') check(); }, 300000);
    const onFocus = () => check();
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', onFocus);
    return () => { stop = true; clearInterval(id); window.removeEventListener('focus', onFocus); document.removeEventListener('visibilitychange', onFocus); };
  }, []);
  // recarrega quando a sincronizacao trouxer mudanca de outro aparelho
  useEffect(() => {
    const h = () => { setEvents(loadEvents()); setUserTipos(loadUserTipos()); setNotes(loadNotes()); setNoteCats(loadNoteCats()); };
    window.addEventListener('agenda-pulled', h);
    return () => window.removeEventListener('agenda-pulled', h);
  }, []);

  const addTipo = (nome, cor) => { const key = tipoNewKey(); setUserTipos(l => [...l, { key, nome, cor }]); return key; };
  const delTipo = key => setUserTipos(l => l.filter(t => t.key !== key));

  const upsert = ev => setEvents(list => {
    const i = list.findIndex(e => e.id === ev.id);
    if (i === -1) return [...list, ev];
    const c = list.slice(); c[i] = ev; return c;
  });
  const remove = id => setEvents(list => list.filter(e => e.id !== id));

  const upsertNote = n => setNotes(list => { const i = list.findIndex(x => x.id === n.id); if (i === -1) return [...list, n]; const c = list.slice(); c[i] = n; return c; });
  const removeNote = id => setNotes(list => list.filter(x => x.id !== id));
  const openNewNote = () => setNoteEdit({ id:newId(), num:'', color:(noteCats[0] && noteCats[0].key) || 'verde', entries:[], _new:true });
  const addEntry = (id, text) => {
    const entry = { id:newId(), date:todayStr(), text };
    setNotes(list => list.map(x => x.id === id ? { ...x, entries:[entry, ...(x.entries||[])] } : x));
    setNoteView(v => v && v.id === id ? { ...v, entries:[entry, ...(v.entries||[])] } : v);
  };
  const delEntry = (id, eid) => {
    setNotes(list => list.map(x => x.id === id ? { ...x, entries:(x.entries||[]).filter(e => e.id !== eid) } : x));
    setNoteView(v => v && v.id === id ? { ...v, entries:(v.entries||[]).filter(e => e.id !== eid) } : v);
  };
  const setArchived = (id, val) => {
    setNotes(list => list.map(x => x.id === id ? { ...x, arquivado: val } : x));
    setNoteView(v => v && v.id === id ? { ...v, arquivado: val } : v);
  };

  const openNew = (dateStr) => setEditing({ id:newId(), title:'', type:'compromisso', date: dateStr || todayStr(), time:'', note:'', repeat:{ freq:'none', interval:1, unit:'week' }, _new:true });

  const irPara = (dateStr) => { setRefStr(dateStr); setView('mes'); };
  const onNewGlobal = () => { if (view === 'notas') openNewNote(); else openNew(); };

  return (
    <div style={{minHeight:'100vh'}}>
      <Toolbar onSync={()=>setSyncOpen(true)} onToggleNav={toggleNav} />
      <div className={'shell'+(navHidden?' nonav':'')}>
        <Sidebar view={view} setView={setView} onNew={onNewGlobal} tipos={tipos} onDelTipo={delTipo} />
        <main className="main">
          {navHidden && <CompactNav view={view} setView={setView} onNew={onNewGlobal} />}
          {view !== 'notas' && (
            <div className="buscaWrap agbusca">
              <span className="buscaIco">⌕</span>
              <input className="busca" placeholder="Buscar na agenda…" value={busca} onChange={e=>setBusca(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
              {busca && <button className="buscaX" onClick={()=>setBusca('')} aria-label="Limpar">×</button>}
            </div>
          )}
          {view !== 'notas' && busca.trim()
            ? <SearchView query={busca} events={events} tipoMap={tipoMap} onOpen={setViewing} />
            : <React.Fragment>
                {view === 'mes'   && <MonthView refStr={refStr} setRefStr={setRefStr} events={events} tipoMap={tipoMap} onNew={openNew} onOpen={setViewing} onOpenDay={setDayView} />}
                {view === 'semana'&& <WeekView  refStr={refStr} setRefStr={setRefStr} events={events} tipoMap={tipoMap} onNew={openNew} onOpen={setViewing} />}
                {view === 'ano'   && <YearView  refStr={refStr} setRefStr={setRefStr} events={events} tipoMap={tipoMap} onPick={irPara} />}
                {view === 'lista' && <AgendaView events={events} tipoMap={tipoMap} onOpen={setViewing} onNew={()=>openNew()} />}
                {view === 'notas' && <NotesView notes={notes} cats={noteCats} onOpen={setNoteView} onNew={openNewNote} onCats={()=>setCatsOpen(true)} />}
              </React.Fragment>}
        </main>
      </div>
      {dayView && <DayView dateStr={dayView} events={events} tipoMap={tipoMap} onClose={()=>setDayView(null)} onOpen={ev=>{ setDayView(null); setViewing(ev); }} onNew={s=>{ setDayView(null); openNew(s); }} />}
      {viewing && <EventView ev={viewing} tipoMap={tipoMap} onClose={()=>setViewing(null)} onEdit={()=>{ setEditing(viewing); setViewing(null); }} />}
      {editing && <Editor ev={editing} tipos={tipos} onAddTipo={addTipo} onClose={()=>setEditing(null)} onSave={ev=>{ upsert(ev); setEditing(null); }} onDelete={id=>{ remove(id); setEditing(null); }} />}
      {noteView && <NoteView n={noteView} cats={noteCats} onClose={()=>setNoteView(null)} onEdit={()=>{ setNoteEdit(noteView); setNoteView(null); }} onDelete={id=>{ removeNote(id); setNoteView(null); }} onArchive={setArchived} onAddEntry={addEntry} onDelEntry={delEntry} />}
      {noteEdit && <NoteEditor n={noteEdit} cats={noteCats} onOpenCats={()=>setCatsOpen(true)} onClose={()=>setNoteEdit(null)} onSave={n=>{ upsertNote(n); setNoteEdit(null); }} onDelete={id=>{ removeNote(id); setNoteEdit(null); }} />}
      {catsOpen && <CatManager cats={noteCats} onSave={list=>setNoteCats(list)} onClose={()=>setCatsOpen(false)} />}
      {syncOpen && <SyncModal onClose={()=>setSyncOpen(false)} />}
      {updateReady && (
        <div className="updbar">
          <span>Tem uma versão nova da AgendaNAD.</span>
          <button className="updbtn" onClick={()=>location.reload()}>Atualizar</button>
          <button className="updx" onClick={()=>setUpdateReady(false)} aria-label="Depois">×</button>
        </div>
      )}
      <style>{CSS}</style>
    </div>
  );
}

/* ---------- menu lateral ---------- */
function Sidebar({ view, setView, onNew, tipos, onDelTipo }){
  const item = (id, icon, label) => (
    <button className={'navitem'+(view===id?' on':'')} onClick={()=>setView(id)}>
      <span className="ico">{icon}</span>{label}
    </button>
  );
  return (
    <aside className="sidebar">
      <div className="brand">◷ AgendaNAD</div>
      <button className="btnNovo" onClick={onNew}>{view==='notas' ? '+ Nova nota' : '+ Novo compromisso'}</button>
      <div className="navgroup">Agenda</div>
      {item('mes','▦','Mês')}
      {item('semana','▤','Semana')}
      {item('ano','▦','Ano')}
      {item('lista','☰','Lista')}
      <div className="navgroup">Notas</div>
      {item('notas','❏','Processos')}
      {view!=='notas' && <div className="navgroup">Tipos</div>}
      {view!=='notas' && tipos.map(t => (
        <div key={t.key} className="legend"><span className="dot" style={{background:t.cor}}></span><span className="legend-nome">{t.nome}</span>
          {!t.fixo && <button className="legend-x" title="Apagar tipo" onClick={()=>{ if(confirm('Apagar o tipo "'+t.nome+'"? Os compromissos já marcados com ele continuam na agenda.')) onDelTipo(t.key); }}>×</button>}
        </div>
      ))}
    </aside>
  );
}

/* ---------- barrinha de navegacao (quando o menu esta escondido) ---------- */
function CompactNav({ view, setView, onNew }){
  const tab = (id,label) => <button className={'ctab'+(view===id?' on':'')} onClick={()=>setView(id)}>{label}</button>;
  return (
    <div className="compactnav">
      {tab('mes','Mês')}{tab('semana','Semana')}{tab('ano','Ano')}{tab('lista','Lista')}{tab('notas','Processos')}
      <span style={{flex:1}}></span>
      <button className="ctab novo" onClick={onNew}>{view==='notas' ? '+ Nova nota' : '+ Novo'}</button>
    </div>
  );
}

/* ---------- cabecalho comum das visoes ---------- */
function ViewHeader({ title, onPrev, onNext, onToday }){
  return (
    <div className="head">
      <div className="titulo">{title}</div>
      {(onPrev || onToday) && (
        <div className="headbtns">
          {onPrev && <button className="navbtn" onClick={onPrev} aria-label="Anterior">‹</button>}
          {onToday && <button className="navbtn" onClick={onToday}>Hoje</button>}
          {onNext && <button className="navbtn" onClick={onNext} aria-label="Próximo">›</button>}
        </div>
      )}
    </div>
  );
}

/* ---------- visao de mes ---------- */
function MonthView({ refStr, setRefStr, events, tipoMap, onNew, onOpen, onOpenDay }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear(), m = ref.getMonth();
  const primeiro = new Date(y, m, 1);
  const cells = Array.from({length:42}, (_,i) => new Date(y, m, 1 - primeiro.getDay() + i));
  const rs = ymd(cells[0]), re = ymd(cells[41]);
  const hoje = todayStr();

  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));
  Object.keys(porDia).forEach(s => porDia[s].sort(cmpHora));

  const go = delta => setRefStr(ymd(new Date(y, m + delta, Math.min(ref.getDate(), 28))));

  return (
    <div>
      <ViewHeader title={cap(MESES[m])+' '+y} onPrev={()=>go(-1)} onNext={()=>go(1)} onToday={()=>setRefStr(todayStr())} />
      <div className="weekhead">{DIAS.map(d => <div key={d}>{d}</div>)}</div>
      <div className="grid">
        {cells.map((d, i) => {
          const s = ymd(d);
          const foraDoMes = d.getMonth() !== m;
          const evs = porDia[s] || [];
          return (
            <div key={i} className={'cell'+(foraDoMes?' fora':'')+(s===hoje?' hoje':'')} onClick={()=>onNew(s)}>
              <div className="cellnum">{d.getDate()}</div>
              {evs.slice(0,3).map((ev,j) => (
                <div key={j} className="pill" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}}
                     onClick={e=>{ e.stopPropagation(); onOpen(ev); }}>
                  {ev.repeat && ev.repeat.freq!=='none' ? '↻ ' : ''}{ev.time ? ev.time+' ' : ''}{ev.title || '(sem título)'}
                </div>
              ))}
              {evs.length > 3 && <div className="mais" onClick={e=>{ e.stopPropagation(); onOpenDay(s); }}>+{evs.length-3} ver tudo</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- visao de semana ---------- */
function WeekView({ refStr, setRefStr, events, tipoMap, onNew, onOpen }){
  const ref = parseYmd(refStr);
  const ws = weekStart(ref);
  const dias = Array.from({length:7}, (_,i) => addDays(ws, i));
  const rs = ymd(dias[0]), re = ymd(dias[6]);
  const hoje = todayStr();
  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));

  return (
    <div>
      <ViewHeader title={weekTitle(ws)} onPrev={()=>setRefStr(ymd(addDays(ref,-7)))} onNext={()=>setRefStr(ymd(addDays(ref,7)))} onToday={()=>setRefStr(todayStr())} />
      <div className="weekgrid">
        {dias.map((d,i) => {
          const s = ymd(d);
          const evs = (porDia[s] || []).slice().sort(cmpHora);
          return (
            <div key={i} className={'weekday'+(s===hoje?' hoje':'')} onClick={()=>onNew(s)}>
              <div className="weekday-h"><span className="wd-dia">{DIAS[d.getDay()]}</span><span className="wd-num">{d.getDate()}</span></div>
              <div className="weekday-body">
                {evs.length===0 && <div className="wd-vazio">—</div>}
                {evs.map((ev,j) => (
                  <div key={j} className="wpill" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={e=>{ e.stopPropagation(); onOpen(ev); }}>
                    {ev.time && <b>{ev.time}</b>} {ev.repeat && ev.repeat.freq!=='none' ? '↻ ' : ''}{ev.title || '(sem título)'}
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- visao de ano (bolinhas coloridas nos dias com algo) ---------- */
function YearView({ refStr, setRefStr, events, tipoMap, onPick }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear();
  const rs = y+'-01-01', re = y+'-12-31';
  const hoje = todayStr();
  const byDay = {};
  events.forEach(ev => {
    const cor = (tipoMap[ev.type]||FALLBACK_TIPO).cor;
    occurrences(ev, rs, re).forEach(s => { const a = (byDay[s] = byDay[s] || []); if (a.indexOf(cor) < 0 && a.length < 4) a.push(cor); });
  });
  return (
    <div>
      <ViewHeader title={String(y)} onPrev={()=>setRefStr(ymd(new Date(y-1, ref.getMonth(), 1)))} onNext={()=>setRefStr(ymd(new Date(y+1, ref.getMonth(), 1)))} onToday={()=>setRefStr(todayStr())} />
      <div className="yeargrid">
        {Array.from({length:12}, (_,mm) => {
          const primeiro = new Date(y, mm, 1);
          const cells = Array.from({length:42}, (_,i) => new Date(y, mm, 1 - primeiro.getDay() + i));
          return (
            <div key={mm} className="minimonth">
              <div className="mm-nome">{cap(MESES[mm])}</div>
              <div className="mm-week">{DIAS.map(d => <span key={d}>{d[0]}</span>)}</div>
              <div className="mm-grid">
                {cells.map((d,i) => {
                  const foraDoMes = d.getMonth() !== mm;
                  const s = ymd(d);
                  const cores = byDay[s] || [];
                  return (
                    <button key={i} className={'mm-day'+(foraDoMes?' fora':'')+(!foraDoMes && s===hoje?' hoje':'')} onClick={()=>onPick(s)}>
                      <span>{d.getDate()}</span>
                      {!foraDoMes && cores.length>0 && <span className="mm-dots">{cores.map((c,k)=><i key={k} style={{background:c}}></i>)}</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- visao de lista (proximos 90 dias) ---------- */
function AgendaView({ events, tipoMap, onOpen, onNew }){
  const hoje = todayStr();
  const fim = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 90));
  const linhas = [];
  events.forEach(ev => occurrences(ev, hoje, fim).forEach(s => linhas.push({ s, ev })));
  linhas.sort((a,b) => a.s === b.s ? cmpHora(a.ev, b.ev) : a.s.localeCompare(b.s));
  const grupos = [];
  linhas.forEach(l => {
    let g = grupos[grupos.length-1];
    if (!g || g.s !== l.s){ g = { s:l.s, itens:[] }; grupos.push(g); }
    g.itens.push(l.ev);
  });
  return (
    <div>
      <ViewHeader title="Próximos compromissos" />
      {grupos.length === 0 && <div className="vazio">Nada marcado para os próximos 3 meses. Toque em <b>+ Novo compromisso</b> pra começar.</div>}
      {grupos.map(g => (
        <div key={g.s} className="diagrp">
          <div className={'diahead'+(g.s===hoje?' ehoje':'')}>{g.s===hoje?'Hoje — ':''}{fmtLongo(g.s)}</div>
          {g.itens.map((ev,i) => (
            <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
              <span className="ltempo">{ev.time || '—'}</span>
              <span className="ltit">{ev.title || '(sem título)'}</span>
              {ev.repeat && ev.repeat.freq!=='none' && <span className="lrep">↻ {repeatLabel(ev)}</span>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ---------- NOTAS: lista de processos, agrupada por cor, com busca ---------- */
function NotesView({ notes, cats, onOpen, onNew, onCats }){
  const [q, setQ] = useState('');
  const qd = soDigitos(q), ql = q.trim().toLowerCase();
  const filtradas = notes.filter(n => {
    if (n.arquivado && !ql) return false;   // arquivados só aparecem quando busca
    if (!ql) return true;
    const num = (n.num||'');
    return (qd && soDigitos(num).includes(qd)) || num.toLowerCase().includes(ql) || (n.entries||[]).some(e => (e.text||'').toLowerCase().includes(ql));
  });
  const nArquivados = notes.filter(n => n.arquivado).length;
  const ultimo = n => { const e = (n.entries||[]); return e.length ? e.slice().sort(cmpEntry)[0] : null; };
  const grupos = cats.map(c => ({ cat:c, itens: filtradas.filter(n => n.color === c.key) })).filter(g => g.itens.length);
  const semCat = filtradas.filter(n => !cats.some(c => c.key === n.color));
  if (semCat.length) grupos.push({ cat:{ key:'__sem', nome:'Sem categoria', cor:'#a1a1aa' }, itens:semCat });

  return (
    <div>
      <div className="head">
        <div className="titulo">Processos</div>
        <div className="headbtns"><button className="navbtn" onClick={onCats}>Cores</button></div>
      </div>
      <div className="buscaWrap">
        <span className="buscaIco">⌕</span>
        <input className="busca" placeholder="Buscar número do processo…" value={q} onChange={e=>setQ(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
        {q && <button className="buscaX" onClick={()=>setQ('')} aria-label="Limpar">×</button>}
      </div>
      {notes.length === 0 && <div className="vazio">Nenhum processo ainda. Toque em <b>+ Nova nota</b> pra guardar o primeiro, com o número e a primeira anotação.</div>}
      {notes.length > 0 && filtradas.length === 0 && <div className="vazio">Nada encontrado para "{q}".</div>}
      {grupos.map(g => (
        <div key={g.cat.key} className="notegrupo">
          <div className="grupohead"><span className="dot" style={{background:g.cat.cor}}></span>{g.cat.nome}<span className="grupocount">{g.itens.length}</span></div>
          <div className="notesgrid">
            {g.itens.map(n => { const u = ultimo(n); const solid = (typeof n.solido === 'boolean') ? n.solido : !!g.cat.solido; const tc = solid ? textOn(g.cat.cor) : null;
              return (
              <button key={n.id} className={'notecard'+(solid?' solido':'')+(n.arquivado?' arquivada':'')} style={solid ? { background:g.cat.cor, borderColor:g.cat.cor, '--c':g.cat.cor, color:tc } : { '--c':g.cat.cor }} onClick={()=>onOpen(n)}>
                {n.arquivado && <span className="arqtag">arquivado</span>}
                <span className="note-num" style={solid?{color:tc}:null}>{n.num || '(sem número)'}</span>
                {u && <span className="note-data" style={solid?{color:tc,opacity:.75}:null}>{fmtData(u.date)}</span>}
                {u ? <span className="note-prev" style={solid?{color:tc,opacity:.9}:null}>{u.text}</span> : <span className="note-prev" style={solid?{color:tc,opacity:.85,fontStyle:'italic'}:{fontStyle:'italic'}}>sem anotações</span>}
              </button>
            );})}
          </div>
        </div>
      ))}
      {!ql && nArquivados > 0 && <div className="arqhint">{nArquivados} {nArquivados === 1 ? 'processo arquivado' : 'processos arquivados'} — some da lista, mas aparece aqui quando você busca pelo número.</div>}
    </div>
  );
}

              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>

        </div>

              <div className="hist-top"><span className="hist-data">{fmtData(e.date)}</span>
                <button className="hist-x" title="Apagar anotação" onClick={()=>{ if(confirm('Apagar esta anotação?')) onDelEntry(n.id, e.id); }}>×</button>
              </div>
              <div className="hist-text">{e.text}</div>
            </div>
          ))}
        </div>
        <div className="addbox">
          <textarea className="inp" style={{margin:0}} rows="2" placeholder="Escreva uma anotação de hoje…" value={txt} onChange={e=>setTxt(e.target.value)} />
          <button className="primary" onClick={add}>Adicionar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- NOTAS: editor do processo (número + cor + 1ª anotação) ---------- */
function NoteEditor({ n, cats, onOpenCats, onClose, onSave, onDelete }){
  const [num, setNum] = useState(n.num);
  const [color, setColor] = useState(n.color || (cats[0] && cats[0].key));
  const catIni = cats.find(c => c.key === (n.color || (cats[0] && cats[0].key))) || {};
  const [solido, setSolido] = useState(n.solido != null ? n.solido : !!catIni.solido);
  const [firstText, setFirstText] = useState('');
  const corSel = (cats.find(c => c.key === color) || {}).cor || '#888';
  const salvar = () => {
    const entries = (n.entries||[]).slice();
    if (n._new && firstText.trim()) entries.unshift({ id:newId(), date:todayStr(), text:firstText.trim() });
    onSave({ ...n, num, color, entries, solido });
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead">
          <b>{n._new ? 'Nova nota' : 'Editar processo'}</b>
          <button className="x" onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <input className="inp" autoFocus placeholder="Número do processo (ex.: 5003734-12.2024.8.24.0000)" value={num} onChange={e=>setNum(e.target.value)} />
        <div className="tipos">
          {cats.map(c => (
            <button key={c.key} className={'tipopill'+(color===c.key?' on':'')}
              style={color===c.key?{background:c.cor,borderColor:c.cor,color:'#fff'}:{}}
              onClick={()=>setColor(c.key)}>{c.nome}</button>
          ))}
          <button className="tipopill novo" onClick={onOpenCats}>editar cores</button>
        </div>
        <label className="fortesw">
          <button className={'solidtog'+(solido?' on':'')} style={solido?{background:corSel,borderColor:corSel,color:textOn(corSel)}:null} onClick={()=>setSolido(s=>!s)}>fundo forte</button>
          <span>deixa esta janelinha bem sólida (pra urgência)</span>
        </label>
        {n._new && <textarea className="inp" rows="4" placeholder="Primeira anotação (fica com a data de hoje)" value={firstText} onChange={e=>setFirstText(e.target.value)} />}
        <div className="cardacts">
          {!n._new && <button className="del" onClick={()=>{ if(confirm('Apagar este processo e todas as anotações dele?')) onDelete(n.id); }}>Apagar</button>}
          <span style={{flex:1}}></span>
          <button className="ghost" onClick={onClose}>Cancelar</button>
          <button className="primary" onClick={salvar}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- NOTAS: gerenciar as cores (renomear / criar / apagar) ---------- */
function CatManager({ cats, onSave, onClose }){
  const [list, setList] = useState(cats.length ? cats : DEFAULT_NOTECATS.slice());
  const setName = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, nome:v } : c));
  const setCor  = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, cor:v } : c));
  const setSol  = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, solido:v } : c));
  const del     = i => setList(l => l.filter((_,j) => j!==i));
  const move    = (i,d) => setList(l => { const j=i+d; if(j<0||j>=l.length) return l; const c=l.slice(); const t=c[i]; c[i]=c[j]; c[j]=t; return c; });
  const add     = () => setList(l => [...l, { key:catNewKey(), nome:'Nova cor', cor:CAT_CORES[l.length % CAT_CORES.length] }]);
  const salvar  = () => { onSave(list.filter(c => (c.nome||'').trim())); onClose(); };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>Cores das notas</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <p className="sub">Renomeie, mude a cor ou crie novas. Os processos ficam agrupados por elas.</p>
        {list.map((c,i) => (
          <div key={c.key} className="catrow">
            <span className="catmove">
              <button className="mv" onClick={()=>move(i,-1)} disabled={i===0} title="Subir">↑</button>
              <button className="mv" onClick={()=>move(i,1)} disabled={i===list.length-1} title="Descer">↓</button>
            </span>
            <span className="catdot" style={{background:c.cor}}></span>
            <input className="inp" style={{margin:0,flex:1,minWidth:120}} value={c.nome} onChange={e=>setName(i, e.target.value)} />
            <div className="cores">{CAT_CORES.map(cc => <button key={cc} className={'corbolinha'+(c.cor===cc?' on':'')} style={{background:cc}} onClick={()=>setCor(i, cc)} aria-label="cor"></button>)}</div>
            <button className={'solidtog'+(c.solido?' on':'')} style={c.solido?{background:c.cor,borderColor:c.cor,color:textOn(c.cor)}:null} onClick={()=>setSol(i, !c.solido)} title="Padrão forte pra esta cor (dá pra mudar em cada processo)">sólido</button>
            <button className="legend-x" onClick={()=>del(i)} title="Apagar cor">×</button>
          </div>
        ))}
        <button className="tipopill novo" style={{marginTop:2}} onClick={add}>+ nova cor</button>
        <div className="cardacts"><span style={{flex:1}}></span><button className="ghost" onClick={onClose}>Cancelar</button><button className="primary" onClick={salvar}>Salvar</button></div>
      </div>
    </div>
  );
}

/* próxima ocorrência de um compromisso (>= hoje); se já passou e não repete, mostra a data original */
function proxData(ev){
  const hoje = todayStr();
  const fim = ymd(new Date(new Date().getFullYear() + 2, 11, 31));
  const occ = occurrences(ev, hoje, fim);
  return occ.length ? occ[0] : ev.date;
}

/* ---------- resultados da busca na agenda ---------- */
function SearchView({ query, events, tipoMap, onOpen }){
  const ql = query.trim().toLowerCase();
  const rows = events
    .filter(ev => (ev.title||'').toLowerCase().includes(ql) || (ev.note||'').toLowerCase().includes(ql))
    .map(ev => ({ ev, s: proxData(ev) }))
    .sort((a,b) => a.s === b.s ? (a.ev.time||'').localeCompare(b.ev.time||'') : a.s.localeCompare(b.s));
  return (
    <div>
      <div className="head"><div className="titulo">Busca: "{query}"</div></div>
      {rows.length === 0 && <div className="vazio">Nada encontrado na agenda para "{query}".</div>}
      {rows.map(({ ev, s }, i) => (
        <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
          <span className="ltempo" style={{minWidth:82}}>{fmtData(s)}</span>
          <span className="ltit">{ev.title || '(sem título)'}{ev.time ? ' · '+ev.time : ''}</span>
          {ev.repeat && ev.repeat.freq !== 'none' && <span className="lrep">↻ {repeatLabel(ev)}</span>}
        </div>
      ))}
    </div>
  );
}

        <div className="vtitulo">{ev.title || '(sem título)'}</div>
        <div className="vlinha"><span className="vico">📅</span>{cap(fmtLongo(ev.date))}{ev.time ? ' · '+ev.time : ''}</div>
        {ev.repeat && ev.repeat.freq !== 'none' && <div className="vlinha"><span className="vico">↻</span>Repete {repeatLabel(ev)}</div>}
        {ev.note && <div className="vnote">{ev.note}</div>}
      </div>
    </div>
  );
}

/* ---------- editor de evento ---------- */
function Editor({ ev, tipos, onAddTipo, onClose, onSave, onDelete }){
  const [f, setF] = useState(ev);
  const [novoTipo, setNovoTipo] = useState(false);
  const [ntNome, setNtNome] = useState('');
  const [ntCor, setNtCor] = useState(CORES_TIPO[3]);
  const set = (k,v) => setF(o => ({ ...o, [k]:v }));
  const setRep = (k,v) => setF(o => ({ ...o, repeat:{ ...o.repeat, [k]:v } }));
  const escolherTipo = t => setF(o => ({ ...o, type:t, repeat: t==='aniversario' && o.repeat.freq==='none' ? { ...o.repeat, freq:'yearly' } : o.repeat }));
  const criarTipo = () => {
    const nome = ntNome.trim();
    if (!nome) return;
    const key = onAddTipo(nome, ntCor);
    setF(o => ({ ...o, type:key }));
    setNovoTipo(false); setNtNome('');
  };

  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead">
          <b>{ev._new ? 'Novo compromisso' : 'Editar'}</b>
          <button className="x" onClick={onClose} aria-label="Fechar">×</button>
        </div>

        <input className="inp" autoFocus placeholder="Título (ex.: Audiência 5001234-00)" value={f.title} onChange={e=>set('title', e.target.value)} />

        <div className="tipos">
          {tipos.map(t => (
            <button key={t.key} className={'tipopill'+(f.type===t.key?' on':'')}
              style={f.type===t.key?{background:t.cor,borderColor:t.cor,color:'#fff'}:{}}
              onClick={()=>escolherTipo(t.key)}>{t.nome}</button>
          ))}
          <button className="tipopill novo" onClick={()=>setNovoTipo(v=>!v)}>+ novo tipo</button>
        </div>
        {novoTipo && (
          <div className="novotipo">
            <input className="inp" style={{margin:0,flex:1}} placeholder="nome do tipo (ex.: Prazo, Perícia)" value={ntNome} onChange={e=>setNtNome(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') criarTipo(); }} />
            <div className="cores">
              {CORES_TIPO.map(c => <button key={c} className={'corbolinha'+(ntCor===c?' on':'')} style={{background:c}} onClick={()=>setNtCor(c)} aria-label="cor"></button>)}
            </div>
            <button className="primary" style={{padding:'8px 14px'}} onClick={criarTipo}>Criar</button>
          </div>
        )}

        <div className="linha2">
          <label className="campo"><span>Data</span><input className="inp" type="date" value={f.date} onChange={e=>set('date', e.target.value)} /></label>
          <label className="campo"><span>Hora</span><input className="inp" type="time" value={f.time} onChange={e=>set('time', e.target.value)} /></label>
        </div>

        <label className="campo"><span>Repetir</span>
          <select className="inp" value={f.repeat.freq} onChange={e=>setRep('freq', e.target.value)}>
            {REPETE.map(r => <option key={r.v} value={r.v}>{r.nome}</option>)}
          </select>
        </label>
        {f.repeat.freq === 'custom' && (
          <div className="linha2">
            <label className="campo"><span>A cada</span><input className="inp" type="number" min="1" value={f.repeat.interval} onChange={e=>setRep('interval', Math.max(1, +e.target.value||1))} /></label>
            <label className="campo"><span>&nbsp;</span>
              <select className="inp" value={f.repeat.unit} onChange={e=>setRep('unit', e.target.value)}>
                <option value="day">dia(s)</option><option value="week">semana(s)</option><option value="month">mês(es)</option><option value="year">ano(s)</option>
              </select>
            </label>
          </div>
        )}

        <textarea className="inp" rows="2" placeholder="Anotação (opcional)" value={f.note} onChange={e=>set('note', e.target.value)} />

        <div className="cardacts">
          {!ev._new && <button className="del" onClick={()=>{ if(confirm('Apagar este compromisso?')) onDelete(f.id); }}>Apagar</button>}
          <span style={{flex:1}}></span>
          <button className="ghost" onClick={onClose}>Cancelar</button>
          <button className="primary" onClick={()=>onSave(f)}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- barra de cima (tema, cor, sincronizar, backup) ---------- */
function Toolbar({ onSync, onToggleNav }){
  const [theme, setTheme] = useState(document.documentElement.getAttribute('data-theme'));
  const [cor, setCor] = useState(document.documentElement.getAttribute('data-cor'));
  const setT = t => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('agenda-theme', t); setTheme(t); };
  const setC = c => { document.documentElement.setAttribute('data-cor', c); localStorage.setItem('agenda-cor', c); setCor(c); };
  const cores = [['amarelo','#facc15'],['rosa','#E85D9A'],['azul','#2F6FE4'],['roxo','#7C4DE0']];

  const exportar = () => {
    const dados = {}; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.indexOf('agenda-')===0 && k.indexOf('agenda-snap:')!==0) dados[k]=localStorage.getItem(k); }
    const blob = new Blob([JSON.stringify({ _app:'agendanad', em:new Date().toISOString(), dados }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agendanad-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const importar = () => {
    // junta arrays (eventos/notas) por id, sem apagar o que já existe; outras chaves sobrescrevem
    const mergeArr = (atual, novo) => {
      const map = new Map();
      try { (JSON.parse(atual||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      try { (JSON.parse(novo||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      return JSON.stringify([...map.values()]);
    };
    const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange = e => { const file=e.target.files[0]; if(!file) return; const r=new FileReader();
      r.onload = () => { try {
        const p=JSON.parse(r.result); const d=p.dados||p; let n=0;
        Object.keys(d).forEach(k=>{
          if(k.indexOf('agenda-')!==0) return;
          if(k==='agenda-events' || k==='agenda-notes') localStorage.setItem(k, mergeArr(localStorage.getItem(k), d[k]));
          else localStorage.setItem(k, d[k]);
          n++;
        });
        alert('Importado e juntado com o que você já tinha ('+n+' itens). A página vai recarregar.');
        location.reload();
      } catch(err){ alert('Arquivo inválido.'); } };
      r.readAsText(file); };
    inp.click();
  };

  return (
    <div className="toolbar">
      <button className="tbtn hamb" onClick={onToggleNav} title="Esconder/mostrar o menu" aria-label="Esconder ou mostrar o menu">☰</button>
      <span className="tbrand">◷ AgendaNAD</span>
      <span style={{flex:1}}></span>
      <span className="corsw-group">{cores.map(([k,c]) => <button key={k} className={'corsw'+(cor===k?' on':'')} style={{background:c}} onClick={()=>setC(k)} title={k}></button>)}</span>
      <button className={'tbtn'+(theme==='light'?' on':'')} onClick={()=>setT('light')} title="Claro">☀</button>
      <button className={'tbtn'+(theme!=='light'?' on':'')} onClick={()=>setT('dark')} title="Escuro">☾</button>
      <button className="tbtn wide" onClick={onSync} title="Sincronizar entre aparelhos">☁ Sincronizar</button>
      <button className="tbtn wide" onClick={exportar}>Backup</button>
      <button className="tbtn wide" onClick={importar}>Importar</button>
    </div>
  );
}

function SyncModal({ onClose }){
  const S = window.AgendaSync || {};
  const [phrase, setPhrase] = useState(S.phrase ? S.phrase() : '');
  const [msg, setMsg] = useState('');
  const configured = S.configured ? S.configured() : false;
  const on = S.isOn ? S.isOn() : false;
  const ligar = () => {
    const p = (phrase||'').trim();
    if (!configured){ setMsg('O cofre ainda não foi configurado.'); return; }
    if (!p){ setMsg('Digite a frase primeiro.'); return; }
    setMsg('Sincronizando…');
    S.enable(p, ok => ok ? location.reload() : setMsg('Não consegui ligar. Confira a conexão.'));
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>☁ Sincronizar entre aparelhos</b><button className="x" onClick={onClose}>×</button></div>
        <p className="sub">Digite a <b>mesma frase secreta</b> no iPhone, iPad e Mac. É ela que liga a sua agenda entre eles. Pode ser a mesma que você usa no MagisNAD.</p>
        <input className="inp" autoCapitalize="off" autoCorrect="off" spellCheck="false" placeholder="sua frase secreta" value={phrase} onChange={e=>setPhrase(e.target.value)} />
        <div className="sub" style={{marginTop:8}}>{on ? '✓ Ligada neste aparelho.' : (configured ? 'Desligada neste aparelho.' : '⏳ Cofre não configurado.')}</div>
        {msg && <div className="sub" style={{color:'var(--accent)'}}>{msg}</div>}
        <div className="cardacts">
          <button className="del" onClick={()=>{ if(S.disable) S.disable(); location.reload(); }}>Desligar aqui</button>
          <span style={{flex:1}}></span>
          <button className="primary" onClick={ligar}>Ligar</button>
        </div>
      </div>
    </div>
  );
}

.hist-data{font-size:11.5px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;}
.hist-x{background:none;border:none;color:var(--faint);font-size:15px;line-height:1;padding:0 2px;}
.hist-x:hover{color:#ef4444;}
.hist-text{font-size:13.5px;color:var(--text);line-height:1.5;white-space:pre-wrap;margin-top:2px;}
.addbox{display:flex;gap:8px;align-items:flex-end;margin-top:8px;padding-top:10px;border-top:1px solid var(--border);}
.addbox textarea{flex:1;resize:vertical;}
.catrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border);}
.catdot{width:14px;height:14px;border-radius:50%;flex:none;}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:1200;
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 12px 34px rgba(0,0,0,.35);font-size:13.5px;color:var(--text);max-width:92vw;}
.updbtn{background:var(--accent);color:var(--on-accent);border:none;border-radius:9px;padding:8px 14px;font-weight:500;font-size:13px;}
.updx{background:none;border:none;color:var(--faint);font-size:18px;line-height:1;padding:2px 4px;}
.updx:hover{color:var(--text);}
.notecard.arquivada{opacity:.62;}
.arqtag{align-self:flex-start;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;
  background:var(--surface);border:1px solid var(--border2);color:var(--muted);border-radius:20px;padding:1px 8px;}
.vhead .arqtag{margin-right:auto;margin-left:8px;}
.arqhint{font-size:12.5px;color:var(--faint);margin-top:6px;padding:10px 0;border-top:1px solid var(--border);}
.catmove{display:inline-flex;flex-direction:column;gap:2px;flex:none;}
.mv{width:22px;height:16px;line-height:1;padding:0;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);border-radius:5px;font-size:11px;}
.mv:hover:not(:disabled){color:var(--accent);border-color:var(--accent);}
.mv:disabled{opacity:.35;cursor:default;}

.tbtn.hamb{font-size:15px;padding:6px 9px;line-height:1;}
.shell.nonav .sidebar{display:none;}

.compactnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.ctab{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:500;}
.ctab.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.ctab.novo{color:var(--accent);border-color:var(--accent);}

.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.weekday{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px;min-height:150px;cursor:pointer;transition:background .12s;}
.weekday:hover{background:var(--surface);}
.weekday.hoje{border-color:var(--accent);}
.weekday-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.wd-dia{font-size:11px;color:var(--faint);text-transform:uppercase;}
.wd-num{font-size:15px;font-weight:500;}
.weekday.hoje .wd-num{color:var(--accent);}
.wd-vazio{color:var(--faint);font-size:12px;text-align:center;padding-top:8px;}
.wpill{font-size:11px;line-height:1.3;background:color-mix(in srgb, var(--c) 15%, transparent);color:var(--c);border-left:2px solid var(--c);border-radius:4px;padding:3px 5px;margin-bottom:4px;}
.wpill b{font-variant-numeric:tabular-nums;}
@media(max-width:760px){ .weekgrid{grid-template-columns:1fr;} .weekday{min-height:auto;} }

.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.minimonth{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;}
.mm-nome{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:6px;}
.mm-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:9px;color:var(--faint);text-align:center;margin-bottom:2px;}
.mm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mm-day{position:relative;background:none;border:none;color:var(--text);font-size:11px;aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.mm-day:hover{background:var(--surface);}
.mm-day.fora{color:var(--faint);opacity:.4;}
.mm-day.hoje{background:var(--accent);color:var(--on-accent);font-weight:500;}
.mm-dots{position:absolute;bottom:2px;display:flex;gap:1.5px;}
.mm-dots i{width:4px;height:4px;border-radius:50%;display:block;}
.mm-day.hoje .mm-dots i{box-shadow:0 0 0 1px var(--on-accent);}
`;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
document.getElementById('boot').classList.add('hide');
</script>

<!-- ================= Sincronizacao entre aparelhos (cofre online) ================= -->
<script>
(function(){
  var SUPA = window.__SUPA || { url:"", key:"" };
  var PHRASE_KEY = 'agenda-sync-space';
  var ID_KEY     = 'agenda-sync-id';
  var TS_KEY     = 'agenda-sync-ts';
  var PREFIX     = 'agenda-';
  function isProg(k){ return k && k.indexOf(PREFIX)===0 && k.indexOf('agenda-sync-')!==0 && k.indexOf('agenda-snap:')!==0 && k!=='agenda-theme' && k!=='agenda-cor'; }
  function jget(k){ try{ return JSON.parse(localStorage.getItem(k) || '{}'); }catch(e){ return {}; } }
  function jset(k,o){ try{ localStorage.setItem(k, JSON.stringify(o)); }catch(e){} }
  function spaceId(){ try{ return localStorage.getItem(ID_KEY) || ''; }catch(e){ return ''; } }
  function configured(){ return !!(SUPA.url && SUPA.key); }
  function on(){ return configured() && !!spaceId(); }
  function sha(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('agendanad::'+s))
      .then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join(''); });
  }
  function headers(extra){ var h = { apikey:SUPA.key, Authorization:'Bearer '+SUPA.key }; if(extra) for(var x in extra) h[x]=extra[x]; return h; }

  var applying=false, lastWrite=0, pushTimer=null, dirty={};
  window.__syncOnWrite = function(k){
    if (applying) return;
    lastWrite = Date.now();
    if (!isProg(k) || !on()) return;
    var ts = jget(TS_KEY); ts[k]=Date.now(); jset(TS_KEY, ts);
    dirty[k]=true;
    clearTimeout(pushTimer); pushTimer=setTimeout(pushDirty, 1200);
  };
  function pushDirty(){
    if (!on()) return;
    var ks=Object.keys(dirty); if(!ks.length) return;
    var id=spaceId(), ts=jget(TS_KEY), rows=[];
    ks.forEach(function(k){ rows.push({ space:id, k:k, v:localStorage.getItem(k), ts:ts[k]||Date.now() }); });
    dirty={};
    fetch(SUPA.url+'/rest/v1/kv', { method:'POST', headers:headers({ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' }), body:JSON.stringify(rows) })
      .then(function(r){ if(!r.ok){ ks.forEach(function(k){ dirty[k]=true; }); } })
      .catch(function(){ ks.forEach(function(k){ dirty[k]=true; }); });
  }
  function pushAll(){
    if(!on()) return;
    var ts=jget(TS_KEY), touched=false;
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(isProg(k)){ if(ts[k]==null){ ts[k]=Date.now(); touched=true; } dirty[k]=true; } }
    if(touched) jset(TS_KEY, ts);
    pushDirty();
  }
  function pull(cb){
    if(!on()){ if(cb) cb(false); return; }
    fetch(SUPA.url+'/rest/v1/kv?select=k,v,ts&space=eq.'+encodeURIComponent(spaceId()), { headers:headers() })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var ts=jget(TS_KEY), changed=false; applying=true;
        rows.forEach(function(row){
          if(row.ts > (ts[row.k]||0)){
            var cur=localStorage.getItem(row.k); var val=row.v==null?'':row.v;
            if(cur!==val){ localStorage.setItem(row.k, val); changed=true; }
            ts[row.k]=row.ts;
          }
        });
        applying=false; jset(TS_KEY, ts);
        if(changed){ try{ window.dispatchEvent(new Event('agenda-pulled')); }catch(e){} }
        if(cb) cb(changed);
      })
      .catch(function(){ applying=false; if(cb) cb(false); });
  }

  window.AgendaSync = {
    configured: configured,
    isOn: on,
    phrase: function(){ try{ return localStorage.getItem(PHRASE_KEY) || ''; }catch(e){ return ''; } },
    enable: function(phrase, done){
      var p=(phrase||'').trim();
      if(!p || !configured()){ if(done) done(false); return; }
      sha(p).then(function(id){ localStorage.setItem(PHRASE_KEY, p); localStorage.setItem(ID_KEY, id); pull(function(){ pushAll(); if(done) done(true); }); })
        .catch(function(){ if(done) done(false); });
    },
    disable: function(){ try{ localStorage.removeItem(ID_KEY); }catch(e){} }
  };

  if(on()){
    pull();
    setInterval(function(){ if(document.visibilityState==='visible') pull(); }, 15000);
    window.addEventListener('focus', function(){ pull(); });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pull(); });
  }
})();
</script>
