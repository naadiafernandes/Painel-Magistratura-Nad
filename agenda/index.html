const pad = n => String(n).padStart(2,'0');

/* ---------- ocorrencias de um evento dentro de um intervalo [rs, re] (strings YYYY-MM-DD) ---------- */
function occurrences(ev, rs, re){
  const rep = ev.repeat || { freq:'none' };
  const start = parseYmd(ev.date);
  const reD = parseYmd(re);
  const out = [];
  if (rep.freq === 'none'){ if (ev.date >= rs && ev.date <= re) out.push(ev.date); return out; }
  const interval = Math.max(1, rep.interval || 1);
  const sy = start.getFullYear(), sm = start.getMonth(), sd = start.getDate();
  let unit = rep.freq, step = interval;
  if (rep.freq === 'custom'){ unit = rep.unit || 'week'; }
  for (let n = 0, guard = 0; guard < 4000; n++, guard++){
    let d;
    if (unit === 'weekly' || unit === 'week'){ d = new Date(sy, sm, sd + 7 * step * n); }
    else if (unit === 'day'){ d = new Date(sy, sm, sd + step * n); }
    else if (unit === 'monthly' || unit === 'month'){ d = new Date(sy, sm + step * n, sd); if (d.getDate() !== sd) continue; }
    else if (unit === 'yearly' || unit === 'year'){ d = new Date(sy + step * n, sm, sd); if (d.getDate() !== sd || d.getMonth() !== sm) continue; }
    else { d = new Date(sy, sm, sd); }
    if (d > reD) break;
    const s = ymd(d);
    if (s >= rs && s <= re) out.push(s);
  }
  return out;
}
// ordena por horário; sem hora (dia inteiro) vem primeiro
function cmpHora(a, b){ const ta = a.time||'', tb = b.time||''; if (!ta && !tb) return 0; if (!ta) return -1; if (!tb) return 1; return ta.localeCompare(tb); }
function repeatLabel(ev){
  const r = ev.repeat || { freq:'none' };
  if (r.freq === 'none') return '';
  if (r.freq === 'weekly') return 'toda semana';
  if (r.freq === 'monthly') return 'todo mês';
  if (r.freq === 'yearly') return 'todo ano';
  const u = { day:'dia', week:'semana', month:'mês', year:'ano' }[r.unit || 'week'];
  const i = Math.max(1, r.interval || 1);
  return i === 1 ? ('todo '+u) : ('a cada '+i+' '+u+(i>1 && r.unit!=='month'?'s':''));
}

// remove a linha em branco "presa" logo antes de uma tabela (quando ela só quer a tabela)
function rnLimpa(el){
  if (!el) return;
  const branco = n => n && ((n.nodeType===3 && !n.textContent.trim()) || (n.nodeType===1 && n.tagName!=='TABLE' && n.tagName!=='HR' && n.tagName!=='IMG' && !n.textContent.trim() && !n.querySelector('img')));
  while (el.firstChild && branco(el.firstChild)){
    const nx = el.firstChild.nextSibling;
    if (nx && nx.nodeType===1 && nx.tagName==='TABLE') el.removeChild(el.firstChild); else break;
  }
}
// "-->" vira "→" assim que ela digita o ">" (não age durante composição de acento)
function rnAutoSeta(e){
  if (e.isComposing) return;
  const sel = document.getSelection(); if (!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0); const node = r.startContainer;
  if (node.nodeType !== 3) return;
  const off = r.startOffset, txt = node.textContent;
  if (off >= 3 && txt.slice(off-3, off) === '-->'){
    node.textContent = txt.slice(0, off-3) + '→' + txt.slice(off);
    const nr = document.createRange(); nr.setStart(node, off-2); nr.collapse(true);
    sel.removeAllRanges(); sel.addRange(nr);
  }
}

const fmtValor = v => v.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
function parseValInput(s){
  s = (s||'').trim(); if (!s) return null;
  let sign = 1, signed = false;
  if (s[0] === '+'){ signed = true; s = s.slice(1); }
  else if (s[0] === '-'){ signed = true; sign = -1; s = s.slice(1); }
  s = s.trim().replace(/\./g,'').replace(',', '.').replace(/[^0-9.]/g,'');
  const n = parseFloat(s); if (isNaN(n)) return null;
  return { signed, val: sign * n };
}
function applyVal(cur, input){ const p = parseValInput(input); if (!p) return cur; return +(p.signed ? (cur + p.val) : Math.abs(p.val)).toFixed(2); }

/* ================= App ================= */
function App(){

  useEffect(() => { if (firstA.current){ firstA.current = false; return; } saveAudiencias(audiencias); }, [audiencias]);
  useEffect(() => { if (firstAC.current){ firstAC.current = false; return; } saveAudCats(audCats); }, [audCats]);
  useEffect(() => { if (firstR.current){ firstR.current = false; return; } saveRoteiros(roteiros); }, [roteiros]);
  // avisa quando há versão nova publicada (sem recarregar na mão)
  const [updateReady, setUpdateReady] = useState(false);
  useEffect(() => {
    let stop = false;
    const check = () => {
      fetch('version.txt?t=' + Date.now(), { cache:'no-store' })
        .then(r => r.ok ? r.text() : null)
        .then(t => { if (!stop && t && t.trim() && t.trim() !== APP_VERSION) setUpdateReady(true); })
        .catch(()=>{});

  useEffect(() => {

    setNoteView(v => v && v.id === id ? { ...v, arquivado: val } : v);
  };

  const upsertAud = n => setAudiencias(list => { const i = list.findIndex(x => x.id === n.id); if (i === -1) return [...list, n]; const c = list.slice(); c[i] = n; return c; });
  const removeAud = id => setAudiencias(list => list.filter(x => x.id !== id));
  const openNewAud = () => setAudEdit({ id:newId(), num:'', color:(audCats[0] && audCats[0].key) || 'verde', entries:[], _new:true });
  const addAudEntry = (id, text) => {
    const entry = { id:newId(), date:todayStr(), text };
    setAudiencias(list => list.map(x => x.id === id ? { ...x, entries:[entry, ...(x.entries||[])] } : x));
    setAudView(v => v && v.id === id ? { ...v, entries:[entry, ...(v.entries||[])] } : v);
  };
  const delAudEntry = (id, eid) => {
    setAudiencias(list => list.map(x => x.id === id ? { ...x, entries:(x.entries||[]).filter(e => e.id !== eid) } : x));
    setAudView(v => v && v.id === id ? { ...v, entries:(v.entries||[]).filter(e => e.id !== eid) } : v);
  };
  const setAudArchived = (id, val) => {
    setAudiencias(list => list.map(x => x.id === id ? { ...x, arquivado: val } : x));
    setAudView(v => v && v.id === id ? { ...v, arquivado: val } : v);
  };

  const openNew = (dateStr) => setEditing({ id:newId(), title:'', type:'compromisso', date: dateStr || todayStr(), time:'', note:'', repeat:{ freq:'none', interval:1, unit:'week' }, _new:true });

  const irPara = (dateStr) => { setRefStr(dateStr); setView('mes'); };
  const onNewGlobal = () => { if (view === 'notas') openNewNote(); else if (view === 'audiencias') openNewAud(); else if (view === 'roteiros') {} else openNew(); };

  return (
    <div style={{minHeight:'100vh'}}>
      <Toolbar onSync={()=>setSyncOpen(true)} onToggleNav={toggleNav} />
      <div className={'shell'+(navHidden?' nonav':'')}>
        <Sidebar view={view} setView={setView} onNew={onNewGlobal} tipos={tipos} filtroTipo={filtroTipo} onFiltro={toggleFiltro} onEditTipo={t=>setTipoEdit(t)} onNewTipo={()=>setTipoEdit({ _new:true, nome:'', cor:CORES_TIPO[4] })} onDelTipo={delTipo} />
        <main className="main">
          {navHidden && <CompactNav view={view} setView={setView} onNew={onNewGlobal} />}
          {view !== 'notas' && view !== 'audiencias' && view !== 'roteiros' && filtroTipo && tipoMap[filtroTipo] && (
            <div className="filtro-bar"><span className="dot" style={{background:tipoMap[filtroTipo].cor}}></span>Mostrando só <b>{tipoMap[filtroTipo].nome}</b><button className="filtro-x" onClick={()=>setFiltroTipo(null)}>ver todos ×</button></div>
          )}
          {view !== 'notas' && view !== 'audiencias' && view !== 'roteiros' && (
            <div className="buscaWrap agbusca">
              <span className="buscaIco">⌕</span>
              <input className="busca" placeholder="Buscar na agenda…" value={busca} onChange={e=>setBusca(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
              {busca && <button className="buscaX" onClick={()=>setBusca('')} aria-label="Limpar">×</button>}
            </div>
          )}
          {view !== 'notas' && view !== 'audiencias' && view !== 'roteiros' && busca.trim()
            ? <SearchView query={busca} events={eventosVista} tipoMap={tipoMap} onOpen={setViewing} />
            : <React.Fragment>
                {view === 'mes'   && <MonthView refStr={refStr} setRefStr={setRefStr} events={eventosVista} tipoMap={tipoMap} onNew={openNew} onOpen={setViewing} onOpenDay={setDayView} />}
                {view === 'semana'&& <WeekView  refStr={refStr} setRefStr={setRefStr} events={eventosVista} tipoMap={tipoMap} onNew={openNew} onOpen={setViewing} />}
                {view === 'ano'   && <YearView  refStr={refStr} setRefStr={setRefStr} events={eventosVista} tipoMap={tipoMap} onPick={irPara} />}
                {view === 'lista' && <AgendaView events={eventosVista} tipoMap={tipoMap} onOpen={setViewing} onNew={()=>openNew()} />}
                {view === 'notas' && <NotesView notes={notes} cats={noteCats} valor={valor} onValor={setValor} onOpen={setNoteView} onNew={openNewNote} onCats={()=>setCatsOpen(true)} />}
                {view === 'audiencias' && <AudienciasView items={audiencias} cats={audCats} onOpen={setAudView} onNew={openNewAud} onCats={()=>setAudCatsOpen(true)} />}
                {view === 'roteiros' && <RoteirosView initial={roteiros} onSave={setRoteiros} />}
              </React.Fragment>}
        </main>
      </div>
      {dayView && <DayView dateStr={dayView} events={eventosVista} tipoMap={tipoMap} onClose={()=>setDayView(null)} onOpen={ev=>{ setDayView(null); setViewing(ev); }} onNew={s=>{ setDayView(null); openNew(s); }} />}
      {viewing && <EventView ev={viewing} tipoMap={tipoMap} onClose={()=>setViewing(null)} onEdit={()=>{ setEditing(viewing); setViewing(null); }} onDelete={id=>{ remove(id); setViewing(null); }} />}
      {editing && <Editor ev={editing} tipos={tipos} onAddTipo={addTipo} onClose={()=>setEditing(null)} onSave={ev=>{ upsert(ev); setEditing(null); }} onDelete={id=>{ remove(id); setEditing(null); }} />}
      {noteView && <NoteView n={noteView} cats={noteCats} onClose={()=>setNoteView(null)} onEdit={()=>{ setNoteEdit(noteView); setNoteView(null); }} onDelete={id=>{ removeNote(id); setNoteView(null); }} onArchive={setArchived} onAddEntry={addEntry} onDelEntry={delEntry} />}
      {noteEdit && <NoteEditor n={noteEdit} cats={noteCats} onOpenCats={()=>setCatsOpen(true)} onClose={()=>setNoteEdit(null)} onSave={n=>{ upsertNote(n); setNoteEdit(null); }} onDelete={id=>{ removeNote(id); setNoteEdit(null); }} />}
      {catsOpen && <CatManager cats={noteCats} onSave={list=>setNoteCats(list)} onClose={()=>setCatsOpen(false)} />}
      {audView && <AudienciaView n={audView} cats={audCats} onClose={()=>setAudView(null)} onEdit={()=>{ setAudEdit(audView); setAudView(null); }} onDelete={id=>{ removeAud(id); setAudView(null); }} onArchive={setAudArchived} onAddEntry={addAudEntry} onDelEntry={delAudEntry} />}
      {audEdit && <AudienciaEditor n={audEdit} cats={audCats} onOpenCats={()=>setAudCatsOpen(true)} onClose={()=>setAudEdit(null)} onSave={n=>{ upsertAud(n); setAudEdit(null); }} onDelete={id=>{ removeAud(id); setAudEdit(null); }} />}
      {audCatsOpen && <CatManager cats={audCats} onSave={list=>setAudCats(list)} onClose={()=>setAudCatsOpen(false)} title="Cores das audiências" subtitle="Renomeie, mude a cor ou crie novas. As audiências ficam agrupadas por elas." defaultCats={DEFAULT_AUDCATS} />}
      {tipoEdit && <TipoEditor tipo={tipoEdit} onClose={()=>setTipoEdit(null)} onSave={(nome,cor)=>{ if(tipoEdit._new) addTipo(nome,cor); else editTipo(tipoEdit.key,nome,cor); setTipoEdit(null); }} />}
      {syncOpen && <SyncModal onClose={()=>setSyncOpen(false)} />}
      {updateReady && (
        <div className="updbar">
          <span>Tem uma versão nova da AgendaNAD.</span>
          <button className="updbtn" onClick={()=>location.reload()}>Atualizar</button>
          <button className="updx" onClick={()=>setUpdateReady(false)} aria-label="Depois">×</button>
        </div>
      )}
      <style>{CSS}</style>
    </div>
  );
}

/* ---------- menu lateral ---------- */
function Sidebar({ view, setView, onNew, tipos, filtroTipo, onFiltro, onEditTipo, onNewTipo, onDelTipo }){
  const item = (id, icon, label, sub) => (
    <button className={'navitem'+(view===id?' on':'')+(sub?' subitem':'')} onClick={()=>setView(id)}>
      <span className="ico">{icon}</span>{label}
    </button>
  );
  return (
    <aside className="sidebar">
      <div className="brand">◷ AgendaNAD</div>
      {view!=='roteiros' && <button className="btnNovo" onClick={onNew}>{view==='notas' ? '+ Nova nota' : view==='audiencias' ? '+ Nova audiência' : '+ Novo compromisso'}</button>}
      <div className="navgroup">Agenda</div>
      {item('mes','▦','Mês')}
      {item('semana','▤','Semana')}
      {item('ano','▦','Ano')}
      {item('lista','☰','Lista')}
      <div className="navgroup">TJSC</div>
      {item('notas','❏','Processos')}
      {item('audiencias','❐','Audiências')}
      {item('roteiros','❦','Roteiros', true)}
      {view!=='notas' && view!=='audiencias' && view!=='roteiros' && <div className="navgroup">Tipos <span className="navgroup-hint">toque pra filtrar</span></div>}
      {view!=='notas' && view!=='audiencias' && view!=='roteiros' && tipos.map(t => (
        <div key={t.key} className={'legend'+(filtroTipo===t.key?' on':'')+(filtroTipo&&filtroTipo!==t.key?' dim':'')}>
          <button className="legend-main" onClick={()=>onFiltro(t.key)} title="Ver só este tipo no calendário">
            <span className="dot" style={{background:t.cor}}></span><span className="legend-nome">{t.nome}</span>
          </button>
          <button className="legend-ed" title="Editar tipo" onClick={()=>onEditTipo(t)}>✎</button>
          <button className="legend-x" title="Apagar tipo" onClick={()=>{ if(confirm('Apagar o tipo "'+t.nome+'"? Os compromissos já marcados com ele continuam na agenda.')) onDelTipo(t.key); }}>×</button>
        </div>
      ))}
      {view!=='notas' && view!=='audiencias' && view!=='roteiros' && <button className="legend-add" onClick={onNewTipo}>+ novo tipo</button>}
    </aside>
  );
}

/* ---------- barrinha de navegacao (quando o menu esta escondido) ---------- */
function CompactNav({ view, setView, onNew }){
  const tab = (id,label) => <button className={'ctab'+(view===id?' on':'')} onClick={()=>setView(id)}>{label}</button>;
  return (
    <div className="compactnav">
      {tab('mes','Mês')}{tab('semana','Semana')}{tab('ano','Ano')}{tab('lista','Lista')}{tab('notas','Processos')}{tab('audiencias','Audiências')}{tab('roteiros','Roteiros')}
      <span style={{flex:1}}></span>
      {view!=='roteiros' && <button className="ctab novo" onClick={onNew}>{view==='notas' ? '+ Nova nota' : view==='audiencias' ? '+ Nova audiência' : '+ Novo'}</button>}
    </div>
  );
}

/* ---------- cabecalho comum das visoes ---------- */
function ViewHeader({ title, onPrev, onNext, onToday }){
  return (
    <div className="head">
      <div className="titulo">{title}</div>
      {(onPrev || onToday) && (
        <div className="headbtns">
          {onPrev && <button className="navbtn" onClick={onPrev} aria-label="Anterior">‹</button>}
          {onToday && <button className="navbtn" onClick={onToday}>Hoje</button>}
          {onNext && <button className="navbtn" onClick={onNext} aria-label="Próximo">›</button>}
        </div>
      )}
    </div>
  );
}

/* ---------- visao de mes ---------- */
function MonthView({ refStr, setRefStr, events, tipoMap, onNew, onOpen, onOpenDay }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear(), m = ref.getMonth();
  const primeiro = new Date(y, m, 1);
  const cells = Array.from({length:42}, (_,i) => new Date(y, m, 1 - primeiro.getDay() + i));
  const rs = ymd(cells[0]), re = ymd(cells[41]);
  const hoje = todayStr();

  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));
  Object.keys(porDia).forEach(s => porDia[s].sort(cmpHora));

  const go = delta => setRefStr(ymd(new Date(y, m + delta, Math.min(ref.getDate(), 28))));

  return (
    <div>
      <ViewHeader title={cap(MESES[m])+' '+y} onPrev={()=>go(-1)} onNext={()=>go(1)} onToday={()=>setRefStr(todayStr())} />
      <div className="weekhead">{DIAS.map(d => <div key={d}>{d}</div>)}</div>
      <div className="grid">
        {cells.map((d, i) => {
          const s = ymd(d);
          const foraDoMes = d.getMonth() !== m;
          const evs = porDia[s] || [];
          return (
            <div key={i} className={'cell'+(foraDoMes?' fora':'')+(s===hoje?' hoje':'')} onClick={()=>onNew(s)}>
              <div className="cellnum">{d.getDate()}</div>
              {evs.slice(0,3).map((ev,j) => (
                <div key={j} className="pill" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}}
                     onClick={e=>{ e.stopPropagation(); onOpen(ev); }}>
                  {ev.repeat && ev.repeat.freq!=='none' ? '↻ ' : ''}{ev.time ? ev.time+' ' : ''}{ev.title || '(sem título)'}
                </div>
              ))}
              {evs.length > 3 && <div className="mais" onClick={e=>{ e.stopPropagation(); onOpenDay(s); }}>+{evs.length-3} ver tudo</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- visao de semana ---------- */
function WeekView({ refStr, setRefStr, events, tipoMap, onNew, onOpen }){
  const ref = parseYmd(refStr);
  const ws = weekStart(ref);
  const dias = Array.from({length:7}, (_,i) => addDays(ws, i));
  const rs = ymd(dias[0]), re = ymd(dias[6]);
  const hoje = todayStr();
  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));

  return (
    <div>
      <ViewHeader title={weekTitle(ws)} onPrev={()=>setRefStr(ymd(addDays(ref,-7)))} onNext={()=>setRefStr(ymd(addDays(ref,7)))} onToday={()=>setRefStr(todayStr())} />
      <div className="weekgrid">
        {dias.map((d,i) => {
          const s = ymd(d);
          const evs = (porDia[s] || []).slice().sort(cmpHora);
          return (
            <div key={i} className={'weekday'+(s===hoje?' hoje':'')} onClick={()=>onNew(s)}>
              <div className="weekday-h"><span className="wd-dia">{DIAS[d.getDay()]}</span><span className="wd-num">{d.getDate()}</span></div>
              <div className="weekday-body">
                {evs.length===0 && <div className="wd-vazio">—</div>}
                {evs.map((ev,j) => (
                  <div key={j} className="wpill" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={e=>{ e.stopPropagation(); onOpen(ev); }}>
                    {ev.time && <b>{ev.time}</b>} {ev.repeat && ev.repeat.freq!=='none' ? '↻ ' : ''}{ev.title || '(sem título)'}
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- visao de ano (bolinhas coloridas nos dias com algo) ---------- */
function YearView({ refStr, setRefStr, events, tipoMap, onPick }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear();
  const rs = y+'-01-01', re = y+'-12-31';
  const hoje = todayStr();
  const byDay = {};
  events.forEach(ev => {
    const cor = (tipoMap[ev.type]||FALLBACK_TIPO).cor;
    occurrences(ev, rs, re).forEach(s => { const a = (byDay[s] = byDay[s] || []); if (a.indexOf(cor) < 0 && a.length < 4) a.push(cor); });
  });
  return (
    <div>
      <ViewHeader title={String(y)} onPrev={()=>setRefStr(ymd(new Date(y-1, ref.getMonth(), 1)))} onNext={()=>setRefStr(ymd(new Date(y+1, ref.getMonth(), 1)))} onToday={()=>setRefStr(todayStr())} />
      <div className="yeargrid">
        {Array.from({length:12}, (_,mm) => {
          const primeiro = new Date(y, mm, 1);
          const cells = Array.from({length:42}, (_,i) => new Date(y, mm, 1 - primeiro.getDay() + i));
          return (
            <div key={mm} className="minimonth">
              <div className="mm-nome">{cap(MESES[mm])}</div>
              <div className="mm-week">{DIAS.map(d => <span key={d}>{d[0]}</span>)}</div>
              <div className="mm-grid">
                {cells.map((d,i) => {
                  const foraDoMes = d.getMonth() !== mm;
                  const s = ymd(d);
                  const cores = byDay[s] || [];
                  return (
                    <button key={i} className={'mm-day'+(foraDoMes?' fora':'')+(!foraDoMes && s===hoje?' hoje':'')} onClick={()=>onPick(s)}>
                      <span>{d.getDate()}</span>
                      {!foraDoMes && cores.length>0 && <span className="mm-dots">{cores.map((c,k)=><i key={k} style={{background:c}}></i>)}</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- visao de lista (proximos 90 dias) ---------- */
function AgendaView({ events, tipoMap, onOpen, onNew }){
  const hoje = todayStr();
  const fim = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 90));
  const linhas = [];
  events.forEach(ev => occurrences(ev, hoje, fim).forEach(s => linhas.push({ s, ev })));
  linhas.sort((a,b) => a.s === b.s ? cmpHora(a.ev, b.ev) : a.s.localeCompare(b.s));
  const grupos = [];
  linhas.forEach(l => {
    let g = grupos[grupos.length-1];
    if (!g || g.s !== l.s){ g = { s:l.s, itens:[] }; grupos.push(g); }
    g.itens.push(l.ev);
  });
  return (
    <div>
      <ViewHeader title="Próximos compromissos" />
      {grupos.length === 0 && <div className="vazio">Nada marcado para os próximos 3 meses. Toque em <b>+ Novo compromisso</b> pra começar.</div>}
      {grupos.map(g => (
        <div key={g.s} className="diagrp">
          <div className={'diahead'+(g.s===hoje?' ehoje':'')}>{g.s===hoje?'Hoje — ':''}{fmtLongo(g.s)}</div>
          {g.itens.map((ev,i) => (
            <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
              <span className="ltempo">{ev.time || '—'}</span>
              <span className="ltit">{ev.title || '(sem título)'}</span>
              {ev.repeat && ev.repeat.freq!=='none' && <span className="lrep">↻ {repeatLabel(ev)}</span>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ---------- NOTAS: lista de processos, agrupada por cor, com busca ---------- */
function NotesView({ notes, cats, valor, onValor, onOpen, onNew, onCats }){
  const [q, setQ] = useState('');
  const [vin, setVin] = useState('');
  const aplicarValor = () => { const novo = applyVal(valor || 0, vin); onValor(novo); setVin(''); };
  const qd = soDigitos(q), ql = q.trim().toLowerCase();
  const filtradas = notes.filter(n => {
    if (n.arquivado && !ql) return false;   // arquivados só aparecem quando busca
    if (!ql) return true;
    const num = (n.num||'');
    return (qd && soDigitos(num).includes(qd)) || num.toLowerCase().includes(ql) || (n.entries||[]).some(e => (e.text||'').toLowerCase().includes(ql));
  });
  const nArquivados = notes.filter(n => n.arquivado).length;
  const ultimo = n => { const e = (n.entries||[]); return e.length ? e.slice().sort(cmpEntry)[0] : null; };
  const grupos = cats.map(c => ({ cat:c, itens: filtradas.filter(n => n.color === c.key) })).filter(g => g.itens.length);
  const semCat = filtradas.filter(n => !cats.some(c => c.key === n.color));
  if (semCat.length) grupos.push({ cat:{ key:'__sem', nome:'Sem categoria', cor:'#a1a1aa' }, itens:semCat });

  return (
    <div>
      <div className="head">
        <div className="titulo">Processos</div>
        <div className="headbtns"><button className="navbtn" onClick={onCats}>Cores</button></div>
      </div>
      <div className="valorbox">
        <span className="valor-num">{fmtValor(valor || 0)}</span>
        <input className="valor-inp" value={vin} onChange={e=>setVin(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') aplicarValor(); }}
          placeholder="+ 88,94" inputMode="decimal" autoCapitalize="off" autoCorrect="off" spellCheck="false" />
        <button className="valor-ok" onClick={aplicarValor} title="Atualizar (Enter)">↵</button>
      </div>
      <div className="buscaWrap">
        <span className="buscaIco">⌕</span>
        <input className="busca" placeholder="Buscar número do processo…" value={q} onChange={e=>setQ(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
        {q && <button className="buscaX" onClick={()=>setQ('')} aria-label="Limpar">×</button>}
      </div>
      {notes.length === 0 && <div className="vazio">Nenhum processo ainda. Toque em <b>+ Nova nota</b> pra guardar o primeiro, com o número e a primeira anotação.</div>}
      {notes.length > 0 && filtradas.length === 0 && <div className="vazio">Nada encontrado para "{q}".</div>}
      {grupos.map(g => (
        <div key={g.cat.key} className="notegrupo">
          <div className="grupohead"><span className="dot" style={{background:g.cat.cor}}></span>{g.cat.nome}<span className="grupocount">{g.itens.length}</span></div>
          <div className="notesgrid">
            {g.itens.map(n => { const u = ultimo(n); const solid = (typeof n.solido === 'boolean') ? n.solido : !!g.cat.solido; const tc = solid ? textOn(g.cat.cor) : null;
              return (
              <button key={n.id} className={'notecard'+(solid?' solido':'')+(n.arquivado?' arquivada':'')} style={solid ? { background:g.cat.cor, borderColor:g.cat.cor, '--c':g.cat.cor, color:tc } : { '--c':g.cat.cor }} onClick={()=>onOpen(n)}>
                {n.arquivado && <span className="arqtag">arquivado</span>}
                <span className="note-num" style={solid?{color:tc}:null}>{n.num || '(sem número)'}</span>
                {u && <span className="note-data" style={solid?{color:tc,opacity:.75}:null}>{fmtData(u.date)}</span>}
                {u ? <span className="note-prev" style={solid?{color:tc,opacity:.9}:null}>{u.text}</span> : <span className="note-prev" style={solid?{color:tc,opacity:.85,fontStyle:'italic'}:{fontStyle:'italic'}}>sem anotações</span>}
              </button>
            );})}
          </div>
        </div>
      ))}
      {!ql && nArquivados > 0 && <div className="arqhint">{nArquivados} {nArquivados === 1 ? 'processo arquivado' : 'processos arquivados'} — some da lista, mas aparece aqui quando você busca pelo número.</div>}
    </div>
  );
}

/* ---------- AUDIÊNCIAS: página própria, mesmo molde dos Processos, começa vazia ---------- */
function AudienciasView({ items, cats, onOpen, onNew, onCats }){
  const [q, setQ] = useState('');
  const qd = soDigitos(q), ql = q.trim().toLowerCase();
  const filtradas = items.filter(n => {
    if (n.arquivado && !ql) return false;   // arquivadas só aparecem quando busca
    if (!ql) return true;
    const num = (n.num||'');
    return (qd && soDigitos(num).includes(qd)) || num.toLowerCase().includes(ql) || (n.entries||[]).some(e => (e.text||'').toLowerCase().includes(ql));
  });
  const nArquivadas = items.filter(n => n.arquivado).length;
  const ultimo = n => { const e = (n.entries||[]); return e.length ? e.slice().sort(cmpEntry)[0] : null; };
  const grupos = cats.map(c => ({ cat:c, itens: filtradas.filter(n => n.color === c.key) })).filter(g => g.itens.length);
  const semCat = filtradas.filter(n => !cats.some(c => c.key === n.color));
  if (semCat.length) grupos.push({ cat:{ key:'__sem', nome:'Sem categoria', cor:'#a1a1aa' }, itens:semCat });

  return (
    <div>
      <div className="head">
        <div className="titulo">Audiências</div>
        <div className="headbtns"><button className="navbtn" onClick={onCats}>Cores</button></div>
      </div>
      <div className="buscaWrap">
        <span className="buscaIco">⌕</span>
        <input className="busca" placeholder="Buscar número do processo…" value={q} onChange={e=>setQ(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
        {q && <button className="buscaX" onClick={()=>setQ('')} aria-label="Limpar">×</button>}
      </div>
      {items.length === 0 && <div className="vazio">Nenhuma audiência ainda. Toque em <b>+ Nova audiência</b> pra guardar a primeira, com o número e a primeira anotação.</div>}
      {items.length > 0 && filtradas.length === 0 && <div className="vazio">Nada encontrado para "{q}".</div>}
      {grupos.map(g => (
        <div key={g.cat.key} className="notegrupo">
          <div className="grupohead"><span className="dot" style={{background:g.cat.cor}}></span>{g.cat.nome}<span className="grupocount">{g.itens.length}</span></div>
          <div className="notesgrid">
            {g.itens.map(n => { const u = ultimo(n); const solid = (typeof n.solido === 'boolean') ? n.solido : !!g.cat.solido; const tc = solid ? textOn(g.cat.cor) : null;
              return (
              <button key={n.id} className={'notecard'+(solid?' solido':'')+(n.arquivado?' arquivada':'')} style={solid ? { background:g.cat.cor, borderColor:g.cat.cor, '--c':g.cat.cor, color:tc } : { '--c':g.cat.cor }} onClick={()=>onOpen(n)}>
                {n.arquivado && <span className="arqtag">arquivado</span>}
                <span className="note-num" style={solid?{color:tc}:null}>{n.num || '(sem número)'}</span>
                {u && <span className="note-data" style={solid?{color:tc,opacity:.75}:null}>{fmtData(u.date)}</span>}
                {u ? <span className="note-prev" style={solid?{color:tc,opacity:.9}:null}>{u.text}</span> : <span className="note-prev" style={solid?{color:tc,opacity:.85,fontStyle:'italic'}:{fontStyle:'italic'}}>sem anotações</span>}
              </button>
            );})}
          </div>
        </div>
      ))}
      {!ql && nArquivadas > 0 && <div className="arqhint">{nArquivadas} {nArquivadas === 1 ? 'audiência arquivada' : 'audiências arquivadas'} — some da lista, mas aparece aqui quando você busca pelo número.</div>}
    </div>
  );
}

/* ---------- ROTEIROS: lista de caixinhas (arrastar pra reordenar, cada uma com sua barra de formatação) ---------- */
function RoteirosView({ initial, onSave }){
  const [boxes, setBoxes] = useState(() => {
    const arr = initial && initial.length ? initial : [{ id: RN_UID(), html:'', tags:[] }];
    return arr.map(b => ({ id: b.id || RN_UID(), html: b.html || '', tags: (b.tags||[]).map(t => ({ label:t.label, ci:t.ci||0 })) }));
  });
  const refs = useRef({});
  const savedRange = useRef(null);
  const dragId = useRef(null);
  const pending = useRef(null);
  const [overId, setOverId] = useState(null);
  const [recentes, setRecentes] = useState(loadRoteiroCores);
  const tagCounter = useRef(boxes.reduce((n,b) => n + b.tags.length, 0));

  useEffect(() => { try { document.execCommand('styleWithCSS', false, true); } catch(e){} }, []);
  useEffect(() => {
    // NÃO ler a seleção enquanto o acento morto está compondo — senão o Chrome corta a tecla morta (~ ´ etc.)
    let composing = false;
    const onCompStart = () => { composing = true; };
    const onCompEnd = () => { composing = false; };
    const onSel = () => {
      if (composing) return;
      const s = document.getSelection(); if (!s || !s.rangeCount) return;
      const r = s.getRangeAt(0);
      for (const id in refs.current){ if (refs.current[id] && refs.current[id].contains(r.commonAncestorContainer)){ savedRange.current = r.cloneRange(); break; } }
    };
    document.addEventListener('compositionstart', onCompStart, true);
    document.addEventListener('compositionend', onCompEnd, true);
    document.addEventListener('selectionchange', onSel);
    return () => {
      document.removeEventListener('compositionstart', onCompStart, true);
      document.removeEventListener('compositionend', onCompEnd, true);
      document.removeEventListener('selectionchange', onSel);
    };
  }, []);

  const guardarRecente = (kind, color) => {
    if (!color || color==='reset' || color==='transparent' || !/^#/.test(color)) return;
    setRecentes(prev => {
      const atual = (prev[kind]||[]).filter(c => c!=='none');
      const lista = [color, ...atual.filter(c => c.toLowerCase()!==color.toLowerCase())].slice(0,7);
      const next = { ...prev, [kind]: kind==='back' ? ['none', ...lista] : lista };
      saveRoteiroCores(next);
      return next;
    });
  };

  const collect = () => boxes.map(b => ({ id:b.id, html: refs.current[b.id] ? refs.current[b.id].innerHTML : b.html, tags:b.tags }));
  const persist = arr => onSave(arr.map(b => ({ id:b.id, html:b.html, tags:b.tags })));
  const commit = arr => { setBoxes(arr); persist(arr); };

  const restore = () => {
    const r = savedRange.current; if (!r) return;
    for (const id in refs.current){ if (refs.current[id] && refs.current[id].contains(r.commonAncestorContainer)){ refs.current[id].focus(); break; } }
    const s = document.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  const exec = cmd => { restore(); try { document.execCommand(cmd, false, null); } catch(e){} };
  const applyColor = (kind, color) => {
    restore();
    const c = color==='reset' ? getComputedStyle(document.body).color : color;
    try { document.execCommand(kind==='fore' ? 'foreColor' : 'hiliteColor', false, c); } catch(e){}
  };

  const addBox = () => {
    const nb = { id: RN_UID(), html:'', tags:[] };
    const next = [...collect(), nb];
    commit(next);
    setTimeout(() => { const el = refs.current[nb.id]; if (el) el.focus(); }, 0);
  };
  const delBox = id => {
    let arr = collect().filter(b => b.id !== id);
    if (!arr.length) arr = [{ id: RN_UID(), html:'', tags:[] }];
    delete refs.current[id];
    commit(arr);
  };
  const blurBox = () => { Object.values(refs.current).forEach(rnLimpa); const arr = collect(); setBoxes(arr); persist(arr); };
  const registerRef = (id, el) => { if (el) refs.current[id] = el; else delete refs.current[id]; };

  const insertHTML = html => { restore(); try { document.execCommand('insertHTML', false, html); } catch(e){} setTimeout(blurBox, 0); };
  const addLinha = () => insertHTML('<hr>');
  const setTitulo = tag => { if (!tag) return; restore(); try { document.execCommand('formatBlock', false, tag); } catch(e){} setTimeout(blurBox, 0); };
  const addTabela = () => {
    const cell = '<td><br></td>';
    const row = '<tr>' + cell + cell + '</tr>';
    insertHTML('<table class="rn-tbl"><tbody>' + row + row + '</tbody></table><p><br></p>');
  };
  const onKeyDownBox = e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key !== 'Tab' || e.shiftKey) return;
    const sel = document.getSelection();
    if (!sel || !sel.rangeCount) return;
    let td = sel.anchorNode;
    td = td && (td.nodeType===1 ? td : td.parentElement);
    while (td && td.tagName!=='TD' && td.tagName!=='TABLE') td = td.parentElement;
    if (!td || td.tagName!=='TD') return;
    e.preventDefault();
    const cells = Array.from(td.closest('table').querySelectorAll('td'));
    let target = cells[cells.indexOf(td)+1];
    if (!target){
      const tr = td.parentElement;
      const ncols = tr.children.length;
      const novaTr = document.createElement('tr');
      for (let i=0;i<ncols;i++){ const c = document.createElement('td'); c.innerHTML='<br>'; novaTr.appendChild(c); }
      tr.parentElement.appendChild(novaTr);
      target = novaTr.children[0];
    }
    const r = document.createRange();
    r.selectNodeContents(target); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
    setTimeout(blurBox, 0);
  };
  const onInputBox = e => rnAutoSeta(e);

  const tblCelula = () => {
    const s = document.getSelection(); if (!s || !s.rangeCount) return null;
    let n = s.anchorNode; n = n && (n.nodeType===1 ? n : n.parentElement);
    while (n && n.tagName!=='TD' && n.tagName!=='TABLE') n = n.parentElement;
    return n && n.tagName==='TD' ? n : null;
  };
  const tblAddLinha = () => { const td = tblCelula(); if (!td) return; const tr = td.parentElement; const nt = document.createElement('tr'); for (let i=0;i<tr.children.length;i++){ const c=document.createElement('td'); c.innerHTML='<br>'; nt.appendChild(c); } tr.after(nt); setTimeout(blurBox, 0); };
  const tblDelLinha = () => { const td = tblCelula(); if (!td) return; const tr = td.parentElement, tb = tr.parentElement; if (tb.children.length>1) tr.remove(); setTimeout(blurBox, 0); };
  const tblAddColuna = () => { const td = tblCelula(); if (!td) return; const idx = td.cellIndex, table = td.closest('table'); Array.from(table.rows).forEach(r => { const c = r.insertCell(Math.min(idx+1, r.cells.length)); c.innerHTML='<br>'; }); setTimeout(blurBox, 0); };
  const tblDelColuna = () => { const td = tblCelula(); if (!td) return; const idx = td.cellIndex, table = td.closest('table'); if (table.rows[0].cells.length>1) Array.from(table.rows).forEach(r => { if (r.cells[idx]) r.deleteCell(idx); }); setTimeout(blurBox, 0); };
  const tblMesclarDir = () => { const td = tblCelula(); if (!td) return; const nx = td.nextElementSibling; if (!nx) return; td.colSpan = (td.colSpan||1) + (nx.colSpan||1); if (nx.textContent.trim()) td.innerHTML = (td.innerHTML==='<br>' ? '' : td.innerHTML+' ') + nx.innerHTML; nx.remove(); setTimeout(blurBox, 0); };
  const tblMesclarBaixo = () => { const td = tblCelula(); if (!td) return; const tr = td.parentElement, idx = td.cellIndex, ntr = tr.nextElementSibling; if (!ntr) return; const ab = ntr.cells[idx]; if (!ab) return; td.rowSpan = (td.rowSpan||1) + (ab.rowSpan||1); if (ab.textContent.trim()) td.innerHTML = (td.innerHTML==='<br>' ? '' : td.innerHTML+' ') + ab.innerHTML; ab.remove(); setTimeout(blurBox, 0); };
  const onMouseDownBox = e => {
    const td = e.target.closest && e.target.closest('td');
    if (!td) return;
    const rect = td.getBoundingClientRect();
    if (rect.right - e.clientX > 7 || e.clientX - rect.left < 7) return;
    e.preventDefault();
    const table = td.closest('table'); table.style.tableLayout = 'fixed';
    const idx = td.cellIndex, startX = e.clientX, startW = td.offsetWidth;
    const mover = ev => { const w = Math.max(30, startW + (ev.clientX - startX)); Array.from(table.rows).forEach(r => { if (r.cells[idx]) r.cells[idx].style.width = w+'px'; }); };
    const soltar = () => { document.removeEventListener('mousemove', mover); document.removeEventListener('mouseup', soltar); setTimeout(blurBox, 0); };
    document.addEventListener('mousemove', mover); document.addEventListener('mouseup', soltar);
  };
  const onMouseMoveBox = e => {
    const el = e.currentTarget, td = e.target.closest && e.target.closest('td');
    if (td){ const r = td.getBoundingClientRect(); el.style.cursor = (r.right - e.clientX <= 7 && e.clientX - r.left >= 7) ? 'col-resize' : ''; }
    else if (el.style.cursor) el.style.cursor = '';
  };

  const addTag = id => {
    const label = window.prompt('Nome da tag (ex.: Urgente, Rever):');
    if (!label || !label.trim()) return;
    const ci = tagCounter.current++ % RN_TAGS.length;
    commit(collect().map(b => b.id===id ? { ...b, tags:[...b.tags, { label:label.trim(), ci }] } : b));
  };
  const removeTag = (id, idx) => commit(collect().map(b => b.id===id ? { ...b, tags: b.tags.filter((_,i)=>i!==idx) } : b));

  const onDragStart = id => { dragId.current = id; pending.current = collect(); };
  const onDragEnd = () => { dragId.current = null; pending.current = null; setOverId(null); };
  const onDragOver = (e, id) => { e.preventDefault(); if (dragId.current && dragId.current !== id) setOverId(id); };
  const onDrop = (e, id) => {
    e.preventDefault();
    const src = dragId.current;
    const arr = pending.current || collect();
    if (!src || src===id){ onDragEnd(); return; }
    const from = arr.findIndex(b => b.id===src);
    if (from < 0){ onDragEnd(); return; }
    const r = e.currentTarget.getBoundingClientRect();
    const after = e.clientY - r.top > r.height/2;
    const moved = arr.splice(from,1)[0];
    const to = arr.findIndex(b => b.id===id);
    arr.splice(after ? to+1 : to, 0, moved);
    commit(arr);
    onDragEnd();
  };

  const swatchRow = kind => (
    <span className="rn-sw-row">
      {kind==='fore' && (
        <span className="rn-sw" style={{background:'var(--text)'}} title="cor padrão" onMouseDown={e=>e.preventDefault()} onClick={()=>applyColor('fore','reset')} />
      )}
      {(recentes[kind]||[]).map((c,i) => c==='none' ? (
        <span key={i} className="rn-sw none" title="sem fundo" onMouseDown={e=>e.preventDefault()} onClick={()=>applyColor('back','transparent')} />
      ) : (
        <span key={i} className="rn-sw" style={{background:c}} onMouseDown={e=>e.preventDefault()} onClick={()=>{ applyColor(kind,c); guardarRecente(kind,c); }} />
      ))}
      <span className="rn-sw pick" title="qualquer cor — fica salva aqui">
        <input type="color" onMouseDown={e=>e.stopPropagation()} onChange={e=>applyColor(kind, e.target.value)} onBlur={e=>guardarRecente(kind, e.target.value)} />
      </span>
    </span>
  );

  return (
    <div>
      <div className="head">
        <div className="titulo">Roteiros</div>
      </div>
      <p className="rn-hint">Cole ou escreva os roteiros de audiência aqui. Arraste pela alcinha ⠿ pra reordenar.</p>
      <div className="rn-list">
        {boxes.map(b => (
          <div key={b.id} className={'rn-box'+(overId===b.id?' over':'')} onDragOver={e=>onDragOver(e,b.id)} onDrop={e=>onDrop(e,b.id)}>
            <div className="rn-handle" draggable title="Arrastar" onDragStart={()=>onDragStart(b.id)} onDragEnd={onDragEnd}>⠿</div>
            <button className="rn-del" title="Excluir caixinha" onClick={()=>delBox(b.id)}>✕</button>
            {b.tags.length > 0 && (
              <div className="rn-tags">
                {b.tags.map((t,i) => {
                  const pair = RN_TAGS[t.ci % RN_TAGS.length];
                  return (
                    <span key={i} className="rn-tag" style={{background:`rgba(${pair[1]},.16)`, color:pair[0]}}>
                      {t.label}
                      <span className="rn-tag-x" onClick={()=>removeTag(b.id,i)}>✕</span>
                    </span>
                  );
                })}
              </div>
            )}
            <RoteiroBox id={b.id} initialHtml={b.html} register={registerRef} onBlur={blurBox} onKeyDown={onKeyDownBox} onInput={onInputBox} onMouseDown={onMouseDownBox} onMouseMove={onMouseMoveBox} />
            {(/<table/i.test(b.html)) && (
              <div className="rn-tbltb">
                <span className="rn-tbltb-lbl">tabela:</span>
                <button title="Adicionar linha abaixo" onMouseDown={e=>e.preventDefault()} onClick={tblAddLinha}>+ linha</button>
                <button title="Remover a linha atual" onMouseDown={e=>e.preventDefault()} onClick={tblDelLinha}>− linha</button>
                <button title="Adicionar coluna à direita" onMouseDown={e=>e.preventDefault()} onClick={tblAddColuna}>+ coluna</button>
                <button title="Remover a coluna atual" onMouseDown={e=>e.preventDefault()} onClick={tblDelColuna}>− coluna</button>
                <button title="Mesclar com a célula à direita" onMouseDown={e=>e.preventDefault()} onClick={tblMesclarDir}>mesclar →</button>
                <button title="Mesclar com a célula de baixo" onMouseDown={e=>e.preventDefault()} onClick={tblMesclarBaixo}>mesclar ↓</button>
                <span className="rn-tbltb-dica">largura: arraste a beira da coluna</span>
              </div>
            )}
            <div className="rn-toolbar">
              <button className="rn-tb b" title="Negrito" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('bold')}>B</button>
              <button className="rn-tb i" title="Itálico" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('italic')}>I</button>
              <button className="rn-tb u" title="Sublinhado" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('underline')}>U</button>
              <select className="rn-h" title="Título (vira um sumário na caixinha)" value="" onMouseDown={e=>e.stopPropagation()} onChange={e=>setTitulo(e.target.value)}>
                <option value="">Título…</option>
                <option value="H1">Título 1</option>
                <option value="H2">Título 2</option>
                <option value="H3">Título 3</option>
                <option value="P">Texto normal</option>
              </select>
              <span className="rn-sep" />
              <button className="rn-tb" title="Tabela (Tab pula célula; na última, cria linha)" onMouseDown={e=>e.preventDefault()} onClick={addTabela}>⊞</button>
              <button className="rn-tb" title="Linha divisória" onMouseDown={e=>e.preventDefault()} onClick={addLinha}>──</button>
              <span className="rn-sep" />
              <span className="rn-lbl">letra</span>
              {swatchRow('fore')}
              <span className="rn-sep" />
              <span className="rn-lbl">fundo</span>
              {swatchRow('back')}
              <span className="rn-sep" />
              <button className="rn-tb" title="Adicionar tag" onMouseDown={e=>e.preventDefault()} onClick={()=>addTag(b.id)}>+ tag</button>
            </div>
          </div>
        ))}
      </div>
      <button className="rn-add" onClick={addBox}>+ Nova caixinha de texto</button>
    </div>
  );
}

/* ---------- editor de TIPO de compromisso (criar/editar nome + cor) ---------- */
function TipoEditor({ tipo, onClose, onSave }){

    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>

function CatManager({ cats, onSave, onClose, title, subtitle, defaultCats }){
  const [list, setList] = useState(cats.length ? cats : (defaultCats || DEFAULT_NOTECATS).slice());
  const setName = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, nome:v } : c));
  const setCor  = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, cor:v } : c));
  const setSol  = (i,v) => setList(l => l.map((c,j) => j===i ? { ...c, solido:v } : c));
  const del     = i => setList(l => l.filter((_,j) => j!==i));
  const move    = (i,d) => setList(l => { const j=i+d; if(j<0||j>=l.length) return l; const c=l.slice(); const t=c[i]; c[i]=c[j]; c[j]=t; return c; });
  const add     = () => setList(l => [...l, { key:catNewKey(), nome:'Nova cor', cor:CAT_CORES[l.length % CAT_CORES.length] }]);
  const salvar  = () => { onSave(list.filter(c => (c.nome||'').trim())); onClose(); };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>{title || 'Cores das notas'}</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <p className="sub">{subtitle || 'Renomeie, mude a cor ou crie novas. Os processos ficam agrupados por elas.'}</p>
        {list.map((c,i) => (
          <div key={c.key} className="catrow">
            <span className="catmove">
              <button className="mv" onClick={()=>move(i,-1)} disabled={i===0} title="Subir">↑</button>
              <button className="mv" onClick={()=>move(i,1)} disabled={i===list.length-1} title="Descer">↓</button>
            </span>
            <span className="catdot" style={{background:c.cor}}></span>
            <input className="inp" style={{margin:0,flex:1,minWidth:120}} value={c.nome} onChange={e=>setName(i, e.target.value)} />
            <div className="cores">{CAT_CORES.map(cc => <button key={cc} className={'corbolinha'+(c.cor===cc?' on':'')} style={{background:cc}} onClick={()=>setCor(i, cc)} aria-label="cor"></button>)}</div>
            <button className={'solidtog'+(c.solido?' on':'')} style={c.solido?{background:c.cor,borderColor:c.cor,color:textOn(c.cor)}:null} onClick={()=>setSol(i, !c.solido)} title="Padrão forte pra esta cor (dá pra mudar em cada processo)">sólido</button>
            <button className="legend-x" onClick={()=>del(i)} title="Apagar cor">×</button>
          </div>
        ))}
        <button className="tipopill novo" style={{marginTop:2}} onClick={add}>+ nova cor</button>
        <div className="cardacts"><span style={{flex:1}}></span><button className="ghost" onClick={onClose}>Cancelar</button><button className="primary" onClick={salvar}>Salvar</button></div>
      </div>
    </div>
  );
}

/* próxima ocorrência de um compromisso (>= hoje); se já passou e não repete, mostra a data original */
function proxData(ev){
  const hoje = todayStr();
  const fim = ymd(new Date(new Date().getFullYear() + 2, 11, 31));
  const occ = occurrences(ev, hoje, fim);
  return occ.length ? occ[0] : ev.date;
}

/* ---------- resultados da busca na agenda ---------- */
function SearchView({ query, events, tipoMap, onOpen }){
  const ql = query.trim().toLowerCase();
  const rows = events
    .filter(ev => (ev.title||'').toLowerCase().includes(ql) || (ev.note||'').toLowerCase().includes(ql))
    .map(ev => ({ ev, s: proxData(ev) }))
    .sort((a,b) => a.s === b.s ? (a.ev.time||'').localeCompare(b.ev.time||'') : a.s.localeCompare(b.s));
  return (
    <div>
      <div className="head"><div className="titulo">Busca: "{query}"</div></div>
      {rows.length === 0 && <div className="vazio">Nada encontrado na agenda para "{query}".</div>}
      {rows.map(({ ev, s }, i) => (
        <div key={i} className="linha" style={{'--c':(tipoMap[ev.type]||FALLBACK_TIPO).cor}} onClick={()=>onOpen(ev)}>
          <span className="ltempo" style={{minWidth:82}}>{fmtData(s)}</span>
          <span className="ltit">{ev.title || '(sem título)'}{ev.time ? ' · '+ev.time : ''}</span>
          {ev.repeat && ev.repeat.freq !== 'none' && <span className="lrep">↻ {repeatLabel(ev)}</span>}
        </div>
      ))}
    </div>
  );
}

/* ---------- editor de evento ---------- */
function Editor({ ev, tipos, onAddTipo, onClose, onSave, onDelete }){
  const [f, setF] = useState(ev);
  const [novoTipo, setNovoTipo] = useState(false);
  const [ntNome, setNtNome] = useState('');
  const [ntCor, setNtCor] = useState(CORES_TIPO[3]);
  const set = (k,v) => setF(o => ({ ...o, [k]:v }));
  const setRep = (k,v) => setF(o => ({ ...o, repeat:{ ...o.repeat, [k]:v } }));
  const escolherTipo = t => setF(o => ({ ...o, type:t, repeat: t==='aniversario' && o.repeat.freq==='none' ? { ...o.repeat, freq:'yearly' } : o.repeat }));
  const criarTipo = () => {
    const nome = ntNome.trim();
    if (!nome) return;
    const key = onAddTipo(nome, ntCor);
    setF(o => ({ ...o, type:key }));
    setNovoTipo(false); setNtNome('');
  };

  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead">
          <b>{ev._new ? 'Novo compromisso' : 'Editar'}</b>
          <button className="x" onClick={onClose} aria-label="Fechar">×</button>
        </div>

        <input className="inp" autoFocus placeholder="Título (ex.: Audiência 5001234-00)" value={f.title} onChange={e=>set('title', e.target.value)} />

        <div className="tipos">
          {tipos.map(t => (
            <button key={t.key} className={'tipopill'+(f.type===t.key?' on':'')}
              style={f.type===t.key?{background:t.cor,borderColor:t.cor,color:'#fff'}:{}}
              onClick={()=>escolherTipo(t.key)}>{t.nome}</button>
          ))}
          <button className="tipopill novo" onClick={()=>setNovoTipo(v=>!v)}>+ novo tipo</button>
        </div>
        {novoTipo && (
          <div className="novotipo">
            <input className="inp" style={{margin:0,flex:1}} placeholder="nome do tipo (ex.: Prazo, Perícia)" value={ntNome} onChange={e=>setNtNome(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') criarTipo(); }} />
            <div className="cores">
              {CORES_TIPO.map(c => <button key={c} className={'corbolinha'+(ntCor===c?' on':'')} style={{background:c}} onClick={()=>setNtCor(c)} aria-label="cor"></button>)}
            </div>
            <button className="primary" style={{padding:'8px 14px'}} onClick={criarTipo}>Criar</button>
          </div>
        )}

        <div className="linha2">
          <label className="campo"><span>Data</span><input className="inp" type="date" value={f.date} onChange={e=>set('date', e.target.value)} /></label>
          <label className="campo"><span>Hora</span><input className="inp" type="time" value={f.time} onChange={e=>set('time', e.target.value)} /></label>
        </div>

        <label className="campo"><span>Repetir</span>
          <select className="inp" value={f.repeat.freq} onChange={e=>setRep('freq', e.target.value)}>
            {REPETE.map(r => <option key={r.v} value={r.v}>{r.nome}</option>)}
          </select>
        </label>
        {f.repeat.freq === 'custom' && (
          <div className="linha2">
            <label className="campo"><span>A cada</span><input className="inp" type="number" min="1" value={f.repeat.interval} onChange={e=>setRep('interval', Math.max(1, +e.target.value||1))} /></label>
            <label className="campo"><span>&nbsp;</span>
              <select className="inp" value={f.repeat.unit} onChange={e=>setRep('unit', e.target.value)}>
                <option value="day">dia(s)</option><option value="week">semana(s)</option><option value="month">mês(es)</option><option value="year">ano(s)</option>
              </select>
            </label>
          </div>
        )}

        <textarea className="inp" rows="2" placeholder="Anotação (opcional)" value={f.note} onChange={e=>set('note', e.target.value)} />

        <div className="cardacts">
          {!ev._new && <button className="del" onClick={()=>{ if(confirm('Apagar este compromisso?')) onDelete(f.id); }}>Apagar</button>}
          <span style={{flex:1}}></span>
          <button className="ghost" onClick={onClose}>Cancelar</button>
          <button className="primary" onClick={()=>onSave(f)}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- barra de cima (tema, cor, sincronizar, backup) ---------- */
function Toolbar({ onSync, onToggleNav }){
  const [theme, setTheme] = useState(document.documentElement.getAttribute('data-theme'));
  const [cor, setCor] = useState(document.documentElement.getAttribute('data-cor'));
  const setT = t => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('agenda-theme', t); setTheme(t); };
  const setC = c => { document.documentElement.setAttribute('data-cor', c); localStorage.setItem('agenda-cor', c); setCor(c); };
  const cores = [['amarelo','#facc15'],['rosa','#E85D9A'],['azul','#2F6FE4'],['roxo','#7C4DE0']];

  const exportar = () => {
    const dados = {}; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.indexOf('agenda-')===0 && k.indexOf('agenda-snap:')!==0) dados[k]=localStorage.getItem(k); }
    const blob = new Blob([JSON.stringify({ _app:'agendanad', em:new Date().toISOString(), dados }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agendanad-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const importar = () => {
    // junta arrays (eventos/notas) por id, sem apagar o que já existe; outras chaves sobrescrevem
    const mergeArr = (atual, novo) => {
      const map = new Map();
      try { (JSON.parse(atual||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      try { (JSON.parse(novo||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      return JSON.stringify([...map.values()]);
    };
    const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange = e => { const file=e.target.files[0]; if(!file) return; const r=new FileReader();
      r.onload = () => { try {
        const p=JSON.parse(r.result); const d=p.dados||p; let n=0;
        Object.keys(d).forEach(k=>{
          if(k.indexOf('agenda-')!==0) return;
          if(k==='agenda-events' || k==='agenda-notes' || k==='agenda-audiencias' || k==='agenda-roteiros') localStorage.setItem(k, mergeArr(localStorage.getItem(k), d[k]));
          else localStorage.setItem(k, d[k]);
          n++;
        });
        alert('Importado e juntado com o que você já tinha ('+n+' itens). A página vai recarregar.');
        location.reload();
      } catch(err){ alert('Arquivo inválido.'); } };
      r.readAsText(file); };
    inp.click();
  };

  return (
    <div className="toolbar">
      <button className="tbtn hamb" onClick={onToggleNav} title="Esconder/mostrar o menu" aria-label="Esconder ou mostrar o menu">☰</button>
      <span className="tbrand">◷ AgendaNAD</span>
      <span style={{flex:1}}></span>
      <span className="corsw-group">{cores.map(([k,c]) => <button key={k} className={'corsw'+(cor===k?' on':'')} style={{background:c}} onClick={()=>setC(k)} title={k}></button>)}</span>
      <button className={'tbtn'+(theme==='light'?' on':'')} onClick={()=>setT('light')} title="Claro">☀</button>
      <button className={'tbtn'+(theme!=='light'?' on':'')} onClick={()=>setT('dark')} title="Escuro">☾</button>
      <button className="tbtn wide" onClick={onSync} title="Sincronizar entre aparelhos">☁ Sincronizar</button>
      <button className="tbtn wide" onClick={exportar}>Backup</button>
      <button className="tbtn wide" onClick={importar}>Importar</button>
    </div>
  );
}

function SyncModal({ onClose }){
  const S = window.AgendaSync || {};
  const [phrase, setPhrase] = useState(S.phrase ? S.phrase() : '');
  const [msg, setMsg] = useState('');
  const configured = S.configured ? S.configured() : false;
  const on = S.isOn ? S.isOn() : false;
  const ligar = () => {
    const p = (phrase||'').trim();
    if (!configured){ setMsg('O cofre ainda não foi configurado.'); return; }
    if (!p){ setMsg('Digite a frase primeiro.'); return; }
    setMsg('Sincronizando…');
    S.enable(p, ok => ok ? location.reload() : setMsg('Não consegui ligar. Confira a conexão.'));
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>☁ Sincronizar entre aparelhos</b><button className="x" onClick={onClose}>×</button></div>
        <p className="sub">Digite a <b>mesma frase secreta</b> no iPhone, iPad e Mac. É ela que liga a sua agenda entre eles. Pode ser a mesma que você usa no MagisNAD.</p>
        <input className="inp" autoCapitalize="off" autoCorrect="off" spellCheck="false" placeholder="sua frase secreta" value={phrase} onChange={e=>setPhrase(e.target.value)} />
        <div className="sub" style={{marginTop:8}}>{on ? '✓ Ligada neste aparelho.' : (configured ? 'Desligada neste aparelho.' : '⏳ Cofre não configurado.')}</div>
        {msg && <div className="sub" style={{color:'var(--accent)'}}>{msg}</div>}
        <div className="cardacts">
          <button className="del" onClick={()=>{ if(S.disable) S.disable(); location.reload(); }}>Desligar aqui</button>
          <span style={{flex:1}}></span>
          <button className="primary" onClick={ligar}>Ligar</button>
        </div>
      </div>
    </div>
  );
}

.weekday{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px;min-height:150px;cursor:pointer;transition:background .12s;}
.weekday:hover{background:var(--surface);}
.weekday.hoje{border-color:var(--accent);}
.weekday-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.wd-dia{font-size:11px;color:var(--faint);text-transform:uppercase;}
.wd-num{font-size:15px;font-weight:500;}
.weekday.hoje .wd-num{color:var(--accent);}
.wd-vazio{color:var(--faint);font-size:12px;text-align:center;padding-top:8px;}
.wpill{font-size:11px;line-height:1.3;background:color-mix(in srgb, var(--c) 15%, transparent);color:var(--c);border-left:2px solid var(--c);border-radius:4px;padding:3px 5px;margin-bottom:4px;}
.wpill b{font-variant-numeric:tabular-nums;}
@media(max-width:760px){ .weekgrid{grid-template-columns:1fr;} .weekday{min-height:auto;} }

.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.minimonth{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;}
.mm-nome{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:6px;}
.mm-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:9px;color:var(--faint);text-align:center;margin-bottom:2px;}
.mm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mm-day{position:relative;background:none;border:none;color:var(--text);font-size:11px;aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.mm-day:hover{background:var(--surface);}
.mm-day.fora{color:var(--faint);opacity:.4;}
.mm-day.hoje{background:var(--accent);color:var(--on-accent);font-weight:500;}
.mm-dots{position:absolute;bottom:2px;display:flex;gap:1.5px;}
.mm-dots i{width:4px;height:4px;border-radius:50%;display:block;}
.mm-day.hoje .mm-dots i{box-shadow:0 0 0 1px var(--on-accent);}

/* ---------- Roteiros: caixinhas de texto ricas (mesmo molde das discursivas do MagisNAD) ---------- */
.rn-hint{color:var(--muted);font-size:13px;margin:0 0 18px;}
.rn-list{display:flex;flex-direction:column;}
.rn-box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px 14px 42px;margin:10px 0;transition:border-color .15s,box-shadow .15s;}
.rn-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);}
.rn-box.over{box-shadow:0 -3px 0 -1px var(--accent);}
.rn-handle{position:absolute;left:8px;top:12px;width:24px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:grab;border-radius:7px;user-select:none;font-size:16px;}
.rn-handle:hover{background:var(--surface2);color:var(--text);}
.rn-handle:active{cursor:grabbing;}
.rn-del{position:absolute;right:10px;top:10px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:14px;border-radius:7px;width:26px;height:26px;opacity:0;transition:.15s;}
.rn-box:hover .rn-del,.rn-box:focus-within .rn-del{opacity:1;}
.rn-del:hover{background:var(--surface2);color:#ef4444;}
.rn-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.rn-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;}
.rn-tag-x{cursor:pointer;opacity:.55;font-weight:700;}
.rn-tag-x:hover{opacity:1;}
.rn-wrap{position:relative;}
.rn-content{outline:none;font-size:15px;line-height:1.62;min-height:24px;color:var(--text);}
.rn-ph{position:absolute;top:0;left:0;font-size:15px;line-height:1.62;color:var(--faint);pointer-events:none;}
.rn-content:focus + .rn-ph,.rn-content:not(:empty) + .rn-ph{display:none;}
.rn-content b,.rn-content strong{font-weight:700;}
.rn-content u{text-decoration:underline;}
.rn-content hr{border:none;border-top:1px solid var(--border2);margin:12px 0;}
.rn-content h1{font-size:18px;font-weight:800;color:var(--accent);margin:12px 0 6px;padding-bottom:3px;border-bottom:1px solid color-mix(in srgb, var(--accent) 30%, transparent);}
.rn-content h2{font-size:15.5px;font-weight:800;color:var(--text);margin:10px 0 5px;}
.rn-content h3{font-size:13px;font-weight:700;color:var(--muted);margin:9px 0 4px;text-transform:uppercase;letter-spacing:.05em;}
.rn-content table.rn-tbl{border-collapse:collapse;margin:10px 0;width:100%;table-layout:fixed;}
.rn-content table.rn-tbl td{border:1px solid var(--border2);padding:6px 9px;min-width:30px;vertical-align:top;overflow-wrap:anywhere;}
.rn-content table.rn-tbl td:focus{outline:2px solid color-mix(in srgb, var(--accent) 55%, transparent);outline-offset:-2px;}
.rn-tbltb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:7px 9px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;}
.rn-tbltb-lbl{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;}
.rn-tbltb button{font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);background:var(--surface);border:1px solid var(--border2);border-radius:7px;padding:4px 9px;}
.rn-tbltb button:hover{color:var(--text);border-color:var(--accent);}
.rn-tbltb-dica{font-size:11px;color:var(--faint);margin-left:4px;}
.rn-toolbar{display:none;gap:4px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border2);}
.rn-box:focus-within .rn-toolbar{display:flex;}
.rn-tb{border:1px solid var(--border2);background:var(--surface2);color:var(--text);border-radius:8px;height:30px;min-width:30px;padding:0 8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;}
.rn-tb:hover{background:var(--surface);}
.rn-tb.b{font-weight:800;} .rn-tb.i{font-style:italic;font-family:Georgia,serif;} .rn-tb.u{text-decoration:underline;}
.rn-sep{width:1px;height:20px;background:var(--border2);margin:0 3px;}
.rn-lbl{font-size:11px;color:var(--muted);margin:0 2px 0 4px;}
.rn-h{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:4px 6px;cursor:pointer;}
.rn-h:hover{color:var(--text);}
.rn-sw-row{display:inline-flex;gap:4px;align-items:center;}
.rn-sw{width:20px;height:20px;border-radius:6px;cursor:pointer;border:1px solid rgba(128,128,128,.35);position:relative;}
.rn-sw:hover{transform:scale(1.12);}
.rn-sw.none{background:transparent;border-style:dashed;}
.rn-sw.none::after{content:"";position:absolute;left:2px;right:2px;top:9px;height:1.5px;background:#ef4444;transform:rotate(-45deg);}
.rn-sw.pick{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);border-radius:50%;overflow:hidden;}
.rn-sw.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:0;width:100%;height:100%;}
.rn-add{margin-top:14px;border:1.5px dashed var(--border2);background:transparent;color:var(--muted);border-radius:14px;padding:14px;width:100%;cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;}
.rn-add:hover{border-color:var(--accent);color:var(--accent);}
.subitem{padding-left:30px !important;}
`;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
document.getElementById('boot').classList.add('hide');

<!-- ================= Sincronizacao entre aparelhos (cofre online) ================= -->
<script>
(function(){
  var SUPA = window.__SUPA || { url:"", key:"" };
  var PHRASE_KEY = 'agenda-sync-space';
  var ID_KEY     = 'agenda-sync-id';
  var TS_KEY     = 'agenda-sync-ts';
  var PREFIX     = 'agenda-';
  function isProg(k){ return k && k.indexOf(PREFIX)===0 && k.indexOf('agenda-sync-')!==0 && k.indexOf('agenda-snap:')!==0 && k!=='agenda-theme' && k!=='agenda-cor'; }
  function jget(k){ try{ return JSON.parse(localStorage.getItem(k) || '{}'); }catch(e){ return {}; } }
  function jset(k,o){ try{ localStorage.setItem(k, JSON.stringify(o)); }catch(e){} }
  function spaceId(){ try{ return localStorage.getItem(ID_KEY) || ''; }catch(e){ return ''; } }
  function configured(){ return !!(SUPA.url && SUPA.key); }
  function on(){ return configured() && !!spaceId(); }
  function sha(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('agendanad::'+s))
      .then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join(''); });
  }
  function headers(extra){ var h = { apikey:SUPA.key, Authorization:'Bearer '+SUPA.key }; if(extra) for(var x in extra) h[x]=extra[x]; return h; }

  var applying=false, lastWrite=0, pushTimer=null, dirty={};
  window.__syncOnWrite = function(k){
    if (applying) return;
    lastWrite = Date.now();
    if (!isProg(k) || !on()) return;
    var ts = jget(TS_KEY); ts[k]=Date.now(); jset(TS_KEY, ts);
    dirty[k]=true;
    clearTimeout(pushTimer); pushTimer=setTimeout(pushDirty, 1200);
  };
  function pushDirty(){
    if (!on()) return;
    var ks=Object.keys(dirty); if(!ks.length) return;
    var id=spaceId(), ts=jget(TS_KEY), rows=[];
    ks.forEach(function(k){ rows.push({ space:id, k:k, v:localStorage.getItem(k), ts:ts[k]||Date.now() }); });
    dirty={};
    fetch(SUPA.url+'/rest/v1/kv', { method:'POST', headers:headers({ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' }), body:JSON.stringify(rows) })
      .then(function(r){ if(!r.ok){ ks.forEach(function(k){ dirty[k]=true; }); } })
      .catch(function(){ ks.forEach(function(k){ dirty[k]=true; }); });
  }
  function pushAll(){
    if(!on()) return;
    var ts=jget(TS_KEY), touched=false;
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(isProg(k)){ if(ts[k]==null){ ts[k]=Date.now(); touched=true; } dirty[k]=true; } }
    if(touched) jset(TS_KEY, ts);
    pushDirty();
  }
  function pull(cb){
    if(!on()){ if(cb) cb(false); return; }
    fetch(SUPA.url+'/rest/v1/kv?select=k,v,ts&space=eq.'+encodeURIComponent(spaceId()), { headers:headers() })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var ts=jget(TS_KEY), changed=false; applying=true;
        rows.forEach(function(row){
          if(row.ts > (ts[row.k]||0)){
            var cur=localStorage.getItem(row.k); var val=row.v==null?'':row.v;
            if(cur!==val){ localStorage.setItem(row.k, val); changed=true; }
            ts[row.k]=row.ts;
          }
        });
        applying=false; jset(TS_KEY, ts);
        if(changed){ try{ window.dispatchEvent(new Event('agenda-pulled')); }catch(e){} }
        if(cb) cb(changed);
      })
      .catch(function(){ applying=false; if(cb) cb(false); });
  }

  window.AgendaSync = {
    configured: configured,
    isOn: on,
    phrase: function(){ try{ return localStorage.getItem(PHRASE_KEY) || ''; }catch(e){ return ''; } },
    enable: function(phrase, done){
      var p=(phrase||'').trim();
      if(!p || !configured()){ if(done) done(false); return; }
      sha(p).then(function(id){ localStorage.setItem(PHRASE_KEY, p); localStorage.setItem(ID_KEY, id); pull(function(){ pushAll(); if(done) done(true); }); })
        .catch(function(){ if(done) done(false); });
    },
    disable: function(){ try{ localStorage.removeItem(ID_KEY); }catch(e){} }
  };

  if(on()){
    pull();
    setInterval(function(){ if(document.visibilityState==='visible') pull(); }, 15000);
    window.addEventListener('focus', function(){ pull(); });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pull(); });
  }
})();
</script>
