// indicador "salvo" + gancho de sincronizacao
(function(){
  var orig = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    orig.apply(this, arguments);
    if (String(k).indexOf('agenda-') === 0 && window.__syncOnWrite) window.__syncOnWrite(String(k));

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* versão do app — bater igual ao conteúdo de version.txt; ao trocar as duas, aparece o aviso "Atualizar" */
const APP_VERSION = '2026-11-06-19';

// cor do texto que contrasta com um fundo sólido (claro -> texto escuro; escuro -> branco)
const textOn = hex => { const c = (hex||'#000').replace('#',''); const r=parseInt(c.slice(0,2),16)||0, g=parseInt(c.slice(2,4),16)||0, b=parseInt(c.slice(4,6),16)||0; return (0.299*r+0.587*g+0.114*b)/255 > 0.62 ? '#231a05' : '#ffffff'; };

/* ---------- datas (sempre em horario local, sem fuso) ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS_LONGO = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const cap = t => t ? t.charAt(0).toUpperCase()+t.slice(1) : t;
const fmtLongo = s => { const d = parseYmd(s); return cap(DIAS_LONGO[d.getDay()])+', '+d.getDate()+' de '+MESES[d.getMonth()]; };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const weekStart = d => addDays(d, -d.getDay());   // volta ate domingo
const weekTitle = ws => { const we = addDays(ws,6);
  return ws.getMonth()===we.getMonth()
    ? ws.getDate()+' a '+we.getDate()+' de '+MESES[ws.getMonth()]
    : ws.getDate()+' de '+MESES[ws.getMonth()].slice(0,3)+' a '+we.getDate()+' de '+MESES[we.getMonth()].slice(0,3); };

const DEFAULT_TIPOS = [
  { key:'audiencia',   nome:'Audiência',   cor:'#2F6FE4', fixo:true },
  { key:'compromisso', nome:'Compromisso', cor:'#f59e0b', fixo:true },
  { key:'aniversario', nome:'Aniversário', cor:'#E85D9A', fixo:true },
];
const FALLBACK_TIPO = { nome:'Outro', cor:'#a1a1aa' };
const CORES_TIPO = ['#2F6FE4','#f59e0b','#E85D9A','#7C4DE0','#10b981','#ef4444','#14b8a6','#eab308','#6366f1','#f97316'];
const TKEY = 'agenda-types';
// Agora TODOS os tipos (inclusive os 3 padrões) ficam nesta lista, editáveis/apagáveis.
// Migração: na 1ª vez, semeia os padrões que faltam junto com os que a usuária já criou.
function loadUserTipos(){
  let stored = null;
  try { const raw = localStorage.getItem(TKEY); if (raw != null) stored = JSON.parse(raw); } catch(e){}
  const base = Array.isArray(stored) ? stored : [];
  if (localStorage.getItem('agenda-types-seeded') === '1') return base;
  const has = new Set(base.map(t => t.key));
  const faltantes = DEFAULT_TIPOS.filter(d => !has.has(d.key)).map(d => ({ key:d.key, nome:d.nome, cor:d.cor }));
  const merged = [...faltantes, ...base];
  try { localStorage.setItem(TKEY, JSON.stringify(merged)); localStorage.setItem('agenda-types-seeded', '1'); } catch(e){}
  return merged;
}
function saveUserTipos(l){ localStorage.setItem(TKEY, JSON.stringify(l)); }
const tipoNewKey = () => 'u' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);
function mapa(tiposList){ const m = {}; tiposList.forEach(t => { m[t.key] = t; }); return m; }
const REPETE = [
  { v:'none',    nome:'Não repete' },
  { v:'weekly',  nome:'Toda semana' },
  { v:'monthly', nome:'Todo mês' },
  { v:'yearly',  nome:'Todo ano' },
  { v:'custom',  nome:'Personalizado' },
];

/* ---------- ocorrencias de um evento dentro de um intervalo [rs, re] (strings YYYY-MM-DD) ---------- */
function occurrences(ev, rs, re){
  const rep = ev.repeat || { freq:'none' };
  const start = parseYmd(ev.date);
  const reD = parseYmd(re);
  const out = [];
  if (rep.freq === 'none'){ if (ev.date >= rs && ev.date <= re) out.push(ev.date); return out; }
  const interval = Math.max(1, rep.interval || 1);
  const sy = start.getFullYear(), sm = start.getMonth(), sd = start.getDate();
  let unit = rep.freq, step = interval;
  if (rep.freq === 'custom'){ unit = rep.unit || 'week'; }
  for (let n = 0, guard = 0; guard < 4000; n++, guard++){
    let d;
    if (unit === 'weekly' || unit === 'week'){ d = new Date(sy, sm, sd + 7 * step * n); }
    else if (unit === 'day'){ d = new Date(sy, sm, sd + step * n); }
    else if (unit === 'monthly' || unit === 'month'){ d = new Date(sy, sm + step * n, sd); if (d.getDate() !== sd) continue; }
    else if (unit === 'yearly' || unit === 'year'){ d = new Date(sy + step * n, sm, sd); if (d.getDate() !== sd || d.getMonth() !== sm) continue; }
    else { d = new Date(sy, sm, sd); }
    if (d > reD) break;
    const s = ymd(d);
    if (s >= rs && s <= re) out.push(s);
  }
  return out;
}
// ordena por horário; sem hora (dia inteiro) vem primeiro
function cmpHora(a, b){ const ta = a.time||'', tb = b.time||''; if (!ta && !tb) return 0; if (!ta) return -1; if (!tb) return 1; return ta.localeCompare(tb); }
function repeatLabel(ev){
  const r = ev.repeat || { freq:'none' };
  if (r.freq === 'none') return '';
  if (r.freq === 'weekly') return 'toda semana';
  if (r.freq === 'monthly') return 'todo mês';
  if (r.freq === 'yearly') return 'todo ano';
  const u = { day:'dia', week:'semana', month:'mês', year:'ano' }[r.unit || 'week'];
  const i = Math.max(1, r.interval || 1);
  return i === 1 ? ('todo '+u) : ('a cada '+i+' '+u+(i>1 && r.unit!=='month'?'s':''));
}

/* ---------- armazenamento ---------- */
const KEY = 'agenda-events';
function loadEvents(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
function saveEvents(list){ localStorage.setItem(KEY, JSON.stringify(list)); }
let _id = Date.now();
const newId = () => 'e' + (_id++).toString(36) + Math.floor(Math.random()*1e6).toString(36);

const lerLocal = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
const gravarLocal = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };

/* ================= App ================= */
function useCelular(){
  const q = '(max-width: 760px)';
  const [m, setM] = useState(() => window.matchMedia(q).matches);
  useEffect(() => { const mq = window.matchMedia(q); const h = () => setM(mq.matches); mq.addEventListener('change', h); return () => mq.removeEventListener('change', h); }, []);
  return m;
}
function App(){
  const [events, setEvents] = useState(loadEvents);
  const [agView, setAgViewRaw] = useState(() => { const v = lerLocal('agendaloc-agview'); return ['mes','semana','ano','lista'].indexOf(v) >= 0 ? v : 'mes'; });
  const setAgView = v => { setAgViewRaw(v); gravarLocal('agendaloc-agview', v); };
  const [refStr, setRefStr] = useState(todayStr()); // data de referencia comum a todas as visoes
  const [editing, setEditing] = useState(null);      // evento em edicao/criacao ou null
  const [viewing, setViewing] = useState(null);      // evento aberto so pra ver (ja salvo)
  const [dayView, setDayView] = useState(null);      // data (string) com a lista do dia aberta
  const [busca, setBusca] = useState('');            // busca na agenda (eventos)
  const [buscaAberta, setBuscaAberta] = useState(false); // celular: campo de busca aparece pelo ícone
  const [syncOpen, setSyncOpen] = useState(false);
  const [ajustesOpen, setAjustesOpen] = useState(false);
  const [filtroOpen, setFiltroOpen] = useState(false);
  const [navHidden, setNavHidden] = useState(() => localStorage.getItem('agenda-nav') === 'hide');
  const [userTipos, setUserTipos] = useState(loadUserTipos);
  const [filtroTipo, setFiltroTipo] = useState(null);   // ver só um tipo no calendário (null = todos)
  const [tipoEdit, setTipoEdit] = useState(null);       // tipo em criação/edição
  const celular = useCelular();
  const toggleNav = () => setNavHidden(v => { const n = !v; localStorage.setItem('agenda-nav', n ? 'hide' : 'show'); return n; });
  const first = useRef(true);
  const firstT = useRef(true);

  const tipos = userTipos;
  const tipoMap = mapa(tipos);
  // eventos que aparecem no calendário: se um tipo estiver selecionado, mostra só ele
  const eventosVista = filtroTipo ? events.filter(e => e.type === filtroTipo) : events;

  useEffect(() => { if (first.current){ first.current = false; return; } saveEvents(events); }, [events]);
  useEffect(() => { if (firstT.current){ firstT.current = false; return; } saveUserTipos(userTipos); }, [userTipos]);
  // avisa quando há versão nova publicada (sem recarregar na mão)
  const [updateReady, setUpdateReady] = useState(false);
  useEffect(() => {
    let stop = false;
    const check = () => {
      fetch('version.txt?t=' + Date.now(), { cache:'no-store' })
        .then(r => r.ok ? r.text() : null)
        .then(t => { if (!stop && t && t.trim() && t.trim() !== APP_VERSION) setUpdateReady(true); })
        .catch(()=>{});
    };
    check();
    const id = setInterval(() => { if (document.visibilityState === 'visible') check(); }, 300000);
    const onFocus = () => check();
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', onFocus);
    return () => { stop = true; clearInterval(id); window.removeEventListener('focus', onFocus); document.removeEventListener('visibilitychange', onFocus); };
  }, []);
  // recarrega quando a sincronizacao trouxer mudanca de outro aparelho
  useEffect(() => {
    const h = () => { setEvents(loadEvents()); setUserTipos(loadUserTipos()); };
    window.addEventListener('agenda-pulled', h);
    return () => window.removeEventListener('agenda-pulled', h);
  }, []);

  const addTipo = (nome, cor) => { const key = tipoNewKey(); setUserTipos(l => [...l, { key, nome, cor }]); return key; };
  const editTipo = (key, nome, cor) => setUserTipos(l => l.map(t => t.key === key ? { ...t, nome, cor } : t));
  const delTipo = key => { setUserTipos(l => l.filter(t => t.key !== key)); setFiltroTipo(f => f === key ? null : f); };
  const toggleFiltro = key => setFiltroTipo(f => f === key ? null : key);

  const upsert = ev => setEvents(list => {
    const i = list.findIndex(e => e.id === ev.id);
    if (i === -1) return [...list, ev];
    const c = list.slice(); c[i] = ev; return c;
  });
  const remove = id => setEvents(list => list.filter(e => e.id !== id));

  const openNew = (dateStr, tipo, titulo) => setEditing({ id:newId(), title:titulo || '', type:tipo || 'compromisso', date: dateStr || todayStr(), time:'', note:'', repeat:{ freq:'none', interval:1, unit:'week' }, _new:true });

  const irPara = (dateStr) => { setRefStr(dateStr); setAgView('mes'); };
  const onNewGlobal = () => openNew();

  return (
    <div className={celular ? 'cel' : ''} style={{minHeight:'100vh'}}>
      <Toolbar celular={celular} onToggleNav={toggleNav} onAjustes={()=>setAjustesOpen(true)}
        onBusca={()=>setBuscaAberta(b=>{ if (b) setBusca(''); return !b; })}
        onFiltro={()=>setFiltroOpen(true)} filtroOn={!!filtroTipo} />
      <div className={'shell'+(navHidden?' nonav':'')}>
        {!celular && <Sidebar onNew={onNewGlobal} />}
        <main className="main">
          <AgendaHead agView={agView} setAgView={setAgView} celular={celular} busca={busca} setBusca={setBusca} buscaAberta={buscaAberta}
            onFiltro={()=>setFiltroOpen(true)} filtroTipo={filtroTipo} tipoMap={tipoMap} onLimparFiltro={()=>setFiltroTipo(null)} />
          {busca.trim() && <SearchView query={busca} events={eventosVista} tipoMap={tipoMap} onOpen={setViewing} />}
          {!busca.trim() && (
            <React.Fragment>
              {agView === 'mes'   && <MonthView refStr={refStr} setRefStr={setRefStr} events={eventosVista} tipoMap={tipoMap} onNew={openNew} onOpen={setViewing} onOpenDay={setDayView} compacto={celular} />}
              {agView === 'semana'&& <WeekView  refStr={refStr} setRefStr={setRefStr} events={eventosVista} tipoMap={tipoMap} onNew={openNew} onOpen={setViewing} />}
              {agView === 'ano'   && <YearView  refStr={refStr} setRefStr={setRefStr} events={eventosVista} tipoMap={tipoMap} onPick={irPara} />}
              {agView === 'lista' && <AgendaView events={eventosVista} tipoMap={tipoMap} onOpen={setViewing} onNew={()=>openNew()} />}
            </React.Fragment>
          )}
        </main>
      </div>
      {celular && <button className="fab" onClick={onNewGlobal} aria-label="+ Novo compromisso">+</button>}
      {filtroOpen && <FiltroTipos tipos={tipos} filtroTipo={filtroTipo} onFiltro={k=>{ toggleFiltro(k); setFiltroOpen(false); }} onClose={()=>setFiltroOpen(false)} />}
      {ajustesOpen && <AjustesModal tipos={tipos} onClose={()=>setAjustesOpen(false)} onSync={()=>{ setAjustesOpen(false); setSyncOpen(true); }}
          onEditTipo={t=>setTipoEdit(t)} onNewTipo={()=>setTipoEdit({ _new:true, nome:'', cor:CORES_TIPO[4] })} onDelTipo={delTipo} />}
      {dayView && <DayView dateStr={dayView} events={eventosVista} tipoMap={tipoMap} onClose={()=>setDayView(null)} onOpen={ev=>{ setDayView(null); setViewing(ev); }} onNew={s=>{ setDayView(null); openNew(s); }} />}
      {viewing && <EventView ev={viewing} tipoMap={tipoMap} onClose={()=>setViewing(null)} onEdit={()=>{ setEditing(viewing); setViewing(null); }} onDelete={id=>{ remove(id); setViewing(null); }} />}
      {editing && <Editor ev={editing} tipos={tipos} onAddTipo={addTipo} onClose={()=>setEditing(null)} onSave={ev=>{ upsert(ev); setEditing(null); }} onDelete={id=>{ remove(id); setEditing(null); }} />}
      {tipoEdit && <TipoEditor tipo={tipoEdit} onClose={()=>setTipoEdit(null)} onSave={(nome,cor)=>{ if(tipoEdit._new) addTipo(nome,cor); else editTipo(tipoEdit.key,nome,cor); setTipoEdit(null); }} />}
      {syncOpen && <SyncModal onClose={()=>setSyncOpen(false)} />}
      {updateReady && (
        <div className="updbar">
          <span>Tem uma versão nova da AgendaNAD.</span>
          <button className="updbtn" onClick={()=>location.reload()}>Atualizar</button>
          <button className="updx" onClick={()=>setUpdateReady(false)} aria-label="Depois">×</button>
        </div>
      )}
      <style>{CSS}</style>
    </div>
  );
}

/* ---------- menu lateral (computador) ---------- */
function Sidebar({ onNew }){
  return (
    <aside className="sidebar">
      <div className="brand">◷ AgendaNAD</div>
      <button className="btnNovo" onClick={onNew}>+ Novo compromisso</button>
      <button className="navitem on"><span className="ico">▦</span><span className="navlbl">Agenda</span></button>
    </aside>
  );
}

/* ---------- cabeçalho da agenda: mês/semana/ano/lista + busca + filtro ---------- */
function AgendaHead({ agView, setAgView, celular, busca, setBusca, buscaAberta, onFiltro, filtroTipo, tipoMap, onLimparFiltro }){
  const seg = (id, label) => <button className={'segb'+(agView===id?' on':'')} onClick={()=>setAgView(id)}>{label}</button>;
  const campo = (
    <div className="buscaWrap agbusca">
      <span className="buscaIco">⌕</span>
      <input className="busca" autoFocus={celular} placeholder="Buscar na agenda…" value={busca} onChange={e=>setBusca(e.target.value)} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
      {busca && <button className="buscaX" onClick={()=>setBusca('')} aria-label="Limpar">×</button>}
    </div>
  );
  return (
    <div className="aghead">
      <div className="aghead-l">
        <div className="segmented">{seg('mes','Mês')}{seg('semana','Semana')}{seg('ano','Ano')}{seg('lista','Lista')}</div>
        {!celular && <button className={'navbtn'+(filtroTipo?' ativo':'')} onClick={onFiltro} title="Ver só um tipo">⛃ Tipos</button>}
        {!celular && campo}
      </div>
      {celular && buscaAberta && campo}
      {filtroTipo && tipoMap[filtroTipo] && (
        <div className="filtro-bar"><span className="dot" style={{background:tipoMap[filtroTipo].cor}}></span>Mostrando só <b>{tipoMap[filtroTipo].nome}</b><button className="filtro-x" onClick={onLimparFiltro}>ver todos ×</button></div>
      )}
    </div>
  );
}
function FiltroTipos({ tipos, filtroTipo, onFiltro, onClose }){
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>Ver só um tipo</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        {tipos.map(t => (
          <button key={t.key} className={'sheetitem'+(filtroTipo===t.key?' on':'')} onClick={()=>onFiltro(t.key)}>
            <span><span className="dot" style={{background:t.cor,display:'inline-block',width:10,height:10,borderRadius:'50%',marginRight:10}}></span>{t.nome}</span>
            {filtroTipo===t.key && <span className="navn">vendo</span>}
          </button>
        ))}
        <p className="sub" style={{marginTop:10}}>Para criar, renomear ou apagar tipos, vá em Ajustes (a engrenagem).</p>
      </div>
    </div>
  );
}

/* ---------- cabecalho comum das visoes ---------- */
function ViewHeader({ title, onPrev, onNext, onToday }){
  return (
    <div className="head">
      <div className="titulo">{title}</div>
      {(onPrev || onToday) && (
        <div className="headbtns">
          {onPrev && <button className="navbtn" onClick={onPrev} aria-label="Anterior">‹</button>}
          {onToday && <button className="navbtn" onClick={onToday}>Hoje</button>}
          {onNext && <button className="navbtn" onClick={onNext} aria-label="Próximo">›</button>}
        </div>
      )}
    </div>
  );
}

/* ---------- visao de mes ---------- */
function MonthView(props){ return props.compacto ? <MonthCompacto {...props} /> : <MonthGrande {...props} />; }
// celular: dias com bolinhas coloridas; tocar num dia mostra os compromissos dele logo embaixo
function MonthCompacto({ refStr, setRefStr, events, tipoMap, onNew, onOpen }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear(), m = ref.getMonth();
  const primeiro = new Date(y, m, 1);
  const cells = Array.from({length:42}, (_,i) => new Date(y, m, 1 - primeiro.getDay() + i));
  const rs = ymd(cells[0]), re = ymd(cells[41]);
  const hoje = todayStr();
  const [sel, setSel] = useState(refStr);
  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));
  Object.keys(porDia).forEach(s => porDia[s].sort(cmpHora));
  const go = delta => { const d = new Date(y, m + delta, 1); setRefStr(ymd(d)); setSel(ymd(d)); };
  const semanas = cells.slice(35).every(d => d.getMonth() !== m) ? cells.slice(0, 35) : cells;
  const doDia = porDia[sel] || [];
  return (
    <div>

function MonthGrande({ refStr, setRefStr, events, tipoMap, onNew, onOpen, onOpenDay }){
  const ref = parseYmd(refStr);
  const y = ref.getFullYear(), m = ref.getMonth();
  const primeiro = new Date(y, m, 1);
  const cells = Array.from({length:42}, (_,i) => new Date(y, m, 1 - primeiro.getDay() + i));
  const rs = ymd(cells[0]), re = ymd(cells[41]);
  const hoje = todayStr();

  const porDia = {};
  events.forEach(ev => occurrences(ev, rs, re).forEach(s => { (porDia[s] = porDia[s] || []).push(ev); }));
  Object.keys(porDia).forEach(s => porDia[s].sort(cmpHora));

  const go = delta => setRefStr(ymd(new Date(y, m + delta, Math.min(ref.getDate(), 28))));

  return (
    <div>
      <ViewHeader title={cap(MESES[m])+' '+y} onPrev={()=>go(-1)} onNext={()=>go(1)} onToday={()=>setRefStr(todayStr())} />

      <div className="grid">
        {cells.map((d, i) => {
          const s = ymd(d);

          return (
            <div key={i} className={'cell'+(foraDoMes?' fora':'')+(s===hoje?' hoje':'')} onClick={()=>onNew(s)}>

function proxData(ev){
  const hoje = todayStr();

  const occ = occurrences(ev, hoje, fim);
  return occ.length ? occ[0] : ev.date;
}

/* ---------- Ajustes: aparência, sincronizar, backup, importar, tipos, situações ---------- */
function AjustesModal({ tipos, onClose, onSync, onEditTipo, onNewTipo, onDelTipo }){
  const [theme, setTheme] = useState(document.documentElement.getAttribute('data-theme'));
  const [cor, setCor] = useState(document.documentElement.getAttribute('data-cor'));
  const setT = t => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('agenda-theme', t); setTheme(t); };
  const setC = c => { document.documentElement.setAttribute('data-cor', c); localStorage.setItem('agenda-cor', c); setCor(c); };
  const cores = [['amarelo','#facc15'],['rosa','#E85D9A'],['azul','#2F6FE4'],['roxo','#7C4DE0']];
  const S = window.AgendaSync || {};
  const ligada = S.isOn ? S.isOn() : false;
  const exportar = () => {
    const dados = {}; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k==='agenda-events' || k==='agenda-types' || k==='agenda-types-seeded') dados[k]=localStorage.getItem(k); }
    const blob = new Blob([JSON.stringify({ _app:'agendanad', em:new Date().toISOString(), dados }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agendanad-backup-'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const importar = () => {
    // junta os compromissos por id, sem apagar o que já existe; outras chaves sobrescrevem
    const mergeArr = (atual, novo) => {
      const map = new Map();
      try { (JSON.parse(atual||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      try { (JSON.parse(novo||'[]')||[]).forEach(x => map.set((x && x.id) || ('_'+map.size), x)); } catch(e){}
      return JSON.stringify([...map.values()]);
    };
    const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange = e => { const file=e.target.files[0]; if(!file) return; const r=new FileReader();
      r.onload = () => { try {
        const p=JSON.parse(r.result); const d=p.dados||p; let n=0;
        Object.keys(d).forEach(k=>{
          if(k==='agenda-events') localStorage.setItem(k, mergeArr(localStorage.getItem(k), d[k]));
          else if(k==='agenda-types' || k==='agenda-types-seeded') localStorage.setItem(k, d[k]);
          else return;
          n++;
        });
        alert('Importado e juntado com o que você já tinha ('+n+' itens). A página vai recarregar.');
        location.reload();
      } catch(err){ alert('Arquivo inválido.'); } };
      r.readAsText(file); };
    inp.click();
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>Ajustes</b><button className="x" onClick={onClose} aria-label="Fechar">×</button></div>
        <div className="ajgrp">Aparência</div>
        <div className="ajrow">
          <span className="corsw-group">{cores.map(([k,c]) => <button key={k} className={'corsw'+(cor===k?' on':'')} style={{background:c}} onClick={()=>setC(k)} title={k}></button>)}</span>
          <span style={{flex:1}}></span>
          <button className={'tbtn'+(theme==='light'?' on':'')} onClick={()=>setT('light')} title="Claro">☀ Claro</button>
          <button className={'tbtn'+(theme!=='light'?' on':'')} onClick={()=>setT('dark')} title="Escuro">☾ Escuro</button>
        </div>
        <div className="ajgrp">Seus dados</div>
        <button className="sheetitem" onClick={onSync}><span>☁ Sincronizar entre aparelhos</span><span className={'navn'+(ligada?' verde':'')}>{ligada ? 'ligado' : 'desligado'}</span></button>
        <button className="sheetitem" onClick={exportar}><span>⇩ Fazer backup</span></button>
        <button className="sheetitem" onClick={importar}><span>⇧ Importar backup</span></button>
        <div className="ajgrp">Tipos de compromisso</div>
        {tipos.map(t => (
          <div key={t.key} className="ajtipo">
            <span className="dot" style={{background:t.cor}}></span><span className="legend-nome">{t.nome}</span>
            <button className="legend-ed" title="Editar tipo" onClick={()=>onEditTipo(t)}>✎</button>
            <button className="legend-x" title="Apagar tipo" onClick={()=>{ if(confirm('Apagar o tipo "'+t.nome+'"? Os compromissos já marcados com ele continuam na agenda.')) onDelTipo(t.key); }}>×</button>
          </div>
        ))}
        <button className="legend-add" onClick={onNewTipo}>+ novo tipo</button>
      </div>
    </div>
  );
}

function SyncModal({ onClose }){
  const S = window.AgendaSync || {};
  const [phrase, setPhrase] = useState(S.phrase ? S.phrase() : '');
  const [msg, setMsg] = useState('');
  const configured = S.configured ? S.configured() : false;
  const on = S.isOn ? S.isOn() : false;
  const ligar = () => {
    const p = (phrase||'').trim();
    if (!configured){ setMsg('O cofre ainda não foi configurado.'); return; }
    if (!p){ setMsg('Digite a frase primeiro.'); return; }
    setMsg('Sincronizando…');
    S.enable(p, ok => ok ? location.reload() : setMsg('Não consegui ligar. Confira a conexão.'));
  };
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="card">
        <div className="cardhead"><b>☁ Sincronizar entre aparelhos</b><button className="x" onClick={onClose}>×</button></div>
        <p className="sub">Digite a <b>mesma frase secreta</b> no iPhone, iPad e Mac. É ela que liga a sua agenda entre eles. Pode ser a mesma que você usa no MagisNAD.</p>
        <input className="inp" autoCapitalize="off" autoCorrect="off" spellCheck="false" placeholder="sua frase secreta" value={phrase} onChange={e=>setPhrase(e.target.value)} />
        <div className="sub" style={{marginTop:8}}>{on ? '✓ Ligada neste aparelho.' : (configured ? 'Desligada neste aparelho.' : '⏳ Cofre não configurado.')}</div>
        {msg && <div className="sub" style={{color:'var(--accent)'}}>{msg}</div>}
        <div className="cardacts">
          <button className="del" onClick={()=>{ if(S.disable) S.disable(); location.reload(); }}>Desligar aqui</button>
          <span style={{flex:1}}></span>
          <button className="primary" onClick={ligar}>Ligar</button>
        </div>
      </div>
    </div>
  );
}

.ctab{background:var(--surface2);border:1px solid var(--border2);color:var(--muted);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:500;}
.ctab.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.ctab.novo{color:var(--accent);border-color:var(--accent);}

.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.weekday{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px;min-height:150px;cursor:pointer;transition:background .12s;}
.weekday:hover{background:var(--surface);}
.weekday.hoje{border-color:var(--accent);}
.weekday-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.wd-dia{font-size:11px;color:var(--faint);text-transform:uppercase;}
.wd-num{font-size:15px;font-weight:500;}
.weekday.hoje .wd-num{color:var(--accent);}
.wd-vazio{color:var(--faint);font-size:12px;text-align:center;padding-top:8px;}
.wpill{font-size:11px;line-height:1.3;background:color-mix(in srgb, var(--c) 15%, transparent);color:var(--c);border-left:2px solid var(--c);border-radius:4px;padding:3px 5px;margin-bottom:4px;}
.wpill b{font-variant-numeric:tabular-nums;}
@media(max-width:760px){ .weekgrid{grid-template-columns:1fr;} .weekday{min-height:auto;} }

.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.minimonth{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;}
.mm-nome{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:6px;}
.mm-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:9px;color:var(--faint);text-align:center;margin-bottom:2px;}
.mm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mm-day{position:relative;background:none;border:none;color:var(--text);font-size:11px;aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;}
.mm-day:hover{background:var(--surface);}
.mm-day.fora{color:var(--faint);opacity:.4;}
.mm-day.hoje{background:var(--accent);color:var(--on-accent);font-weight:500;}
.mm-dots{position:absolute;bottom:2px;display:flex;gap:1.5px;}
.mm-dots i{width:4px;height:4px;border-radius:50%;display:block;}
.mm-day.hoje .mm-dots i{box-shadow:0 0 0 1px var(--on-accent);}

/* ---------- navegação nova ---------- */
.tico{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;}
.tico:hover,.tico.on{color:var(--accent);background:var(--surface2);}
.navitem .navlbl{flex:1;}
.navitem.sub{padding-left:22px;font-size:13px;}
.navn{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0 7px;font-variant-numeric:tabular-nums;}
.navn.verde{color:#10b981;border-color:#10b98155;}
.navalerta{font-size:10.5px;font-weight:500;color:var(--on-accent);background:var(--accent);border-radius:20px;padding:1px 7px;white-space:nowrap;}
.navsub{font-size:11px;color:var(--faint);margin:8px 10px 2px;}
.aghead{margin-bottom:12px;}
.aghead-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.aghead .buscaWrap{margin:0;flex:1;min-width:200px;}
.aghead .filtro-bar{margin:10px 0 0;}
.segmented{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px;}
.segb{background:none;border:none;color:var(--muted);font-size:13px;font-weight:500;padding:6px 14px;border-radius:8px;}
.segb.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25);}
.navbtn.ativo{border-color:var(--accent);color:var(--accent);}
.subtit{font-size:12.5px;color:var(--muted);margin-top:3px;}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:500;padding:0 2px;cursor:pointer;}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:600;display:flex;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
.btab{flex:1;background:none;border:none;color:var(--faint);font-size:11px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.btab.on{color:var(--accent);}
.btab-ico{font-size:19px;line-height:1.1;position:relative;}
.btab-n{position:absolute;top:-4px;right:-12px;font-style:normal;font-size:9.5px;font-weight:500;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:0 5px;}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:610;width:54px;height:54px;border-radius:50%;border:none;
  background:var(--accent);color:var(--on-accent);font-size:28px;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.35);}
.cel .shell{padding:10px 12px calc(84px + env(safe-area-inset-bottom));}
.cel .updbar{bottom:calc(76px + env(safe-area-inset-bottom));}
.cel .head{flex-wrap:wrap;}
.cel .segmented{width:100%;}
.cel .segb{flex:1;padding:7px 4px;}
.cel .soPc{display:none;}
.sheetwrap{align-items:flex-end;padding:0;}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:8px 14px calc(18px + env(safe-area-inset-bottom));}
.sheetgrip{width:40px;height:4px;border-radius:4px;background:var(--border2);margin:2px auto 10px;}
.sheetgrp{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin:12px 6px 4px;}
.sheetitem{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14.5px;padding:12px 6px;text-align:left;}
.sheetitem.on{color:var(--accent);font-weight:500;}
.sheetitem:hover{background:var(--surface2);}
.ajgrp{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin:16px 2px 6px;}
.ajrow{display:flex;align-items:center;gap:8px;}
.ajtipo{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:14px;}
.ajtipo .dot{width:10px;height:10px;border-radius:50%;flex:none;}
.cadeado{font-size:13px;opacity:.7;flex:none;padding:0 3px;}
/* mês no celular */
.mc-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--faint);text-align:center;margin-bottom:4px;}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mc-day{position:relative;background:none;border:none;color:var(--text);border-radius:10px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;}
.mc-day.fora{color:var(--faint);opacity:.45;}
.mc-day.hoje .mc-num{color:var(--accent);font-weight:500;}
.mc-day.sel{background:color-mix(in srgb, var(--accent) 16%, transparent);}
.mc-day.sel .mc-num{color:var(--text);font-weight:500;}
.mc-num{font-size:15px;font-variant-numeric:tabular-nums;}
.mc-dots{display:flex;gap:3px;margin-top:5px;min-height:6px;}
.mc-dots i{width:6px;height:6px;border-radius:50%;display:block;}
.mc-cont{font-size:10px;font-weight:500;background:#2F6FE4;color:#fff;border-radius:10px;padding:0 6px;line-height:15px;}
.mc-cont.conf{background:#f59e0b;color:#231a05;}
.mc-dia{margin-top:14px;border-top:1px solid var(--border);padding-top:10px;}
.mc-diatit{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px;}
.mc-vazio{font-size:13px;color:var(--faint);padding:4px 0 8px;}
.mc-novo{background:none;border:1px dashed var(--border2);color:var(--accent);border-radius:10px;padding:9px;width:100%;font-size:13px;margin-top:4px;}
/* painel de trabalho */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.cel .fchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-right:-12px;}
.fchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);border-radius:20px;padding:6px 11px;font-size:12.5px;}
.fchip .dot{width:8px;height:8px;border-radius:50%;}
.fchip.on{border-color:var(--c, var(--accent));color:var(--text);background:color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface2));}
.fchip-n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;}
.pgrid2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
.pmini{gap:6px;min-height:auto;background:var(--pc-bg);border:1px solid var(--pc-line);border-left:4px solid var(--pc-bg);color:var(--pc-tx);}
.pmini:hover{background:var(--pc-bg);filter:brightness(1.06);}
.pmini-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pmini .note-num{font-size:14.5px;font-weight:600;color:var(--pc-tx);}
.pmini .copybtn{color:var(--pc-tx);border-color:var(--pc-line);background:var(--pc-panel);}
.pmini .pc-tags i{color:var(--pc-tx);border-color:var(--pc-line);background:var(--pc-panel);}
.pmini .pc-tags i.off{color:#fff;background:#b91c1c;border-color:#b91c1c;}
.pmini .etq{background:var(--pc-panel);border-color:var(--pc-line);color:var(--pc-tx);}
.pmini .etq.verm{background:#b91c1c;border-color:#b91c1c;color:#fff;}
.pmini .etq.verde{background:#047857;border-color:#047857;color:#fff;}
.pmini .etq.azul{background:#1d4ed8;border-color:#1d4ed8;color:#fff;}
.pmini .pc-novo{background:var(--pc-tx);color:var(--pc-bg);}
.pm-esq,.pm-dir{display:flex;flex-direction:column;gap:6px;min-width:0;}
.pm-dir:empty{display:none;}
.plista{grid-template-columns:1fr;}
.plista .pmini{flex-direction:row;align-items:flex-start;gap:16px;}
.plista .pm-esq{width:360px;flex:none;}
.plista .pm-dir{flex:1;}
.plista .pmini-obs{-webkit-line-clamp:6;}
.cel .plista .pmini{flex-direction:column;gap:6px;}
.cel .plista .pm-esq{width:auto;}
.pmini-sit{margin-top:1px;}
.pmini-ass{align-self:flex-start;font:inherit;font-size:12px;font-weight:600;color:var(--pc-tx);background:var(--pc-panel);border:1px solid var(--pc-line);border-radius:20px;padding:3px 11px;cursor:pointer;}
.pmini-ass:hover{background:#047857;color:#fff;border-color:#047857;}
.pmini .pc-sel{background:var(--pc-panel);color:var(--pc-tx);border:1px solid var(--pc-line);}
.pmini .pc-sel option{color:#111;background:#fff;}
.pmini-pend{font-size:12px;line-height:1.4;color:var(--pc-tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.pmini-pend b{font-weight:600;color:var(--pc-tx);}
.pmini-obs{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.45;color:var(--pc-tx);background:var(--pc-panel);border:1px solid var(--pc-line);border-radius:9px;padding:7px 9px;white-space:pre-wrap;}
.pmini-nejul{align-self:flex-start;font-size:10.5px;font-weight:500;color:#fff;background:#c2410c;border:1px solid #c2410c;border-radius:20px;padding:0 8px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
.cel .pgrid{grid-template-columns:1fr;}
.pcard{background:color-mix(in srgb, var(--c) 6%, var(--surface2));border:1px solid var(--border);border-left:4px solid var(--c);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;}
.pc-num.grande{font-size:15.5px;font-weight:600;letter-spacing:-.2px;}
.pc-top .pc-mais{margin-left:auto;}
.pc-etiq{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.etq{font-size:10.5px;font-weight:500;border-radius:20px;padding:1px 8px;line-height:1.5;color:var(--muted);background:var(--surface);border:1px solid var(--border2);white-space:nowrap;font-variant-numeric:tabular-nums;}
.etq.verm{color:#fff;background:#dc2626;border-color:#dc2626;}
.etq.verde{color:#fff;background:#059669;border-color:#059669;}
.etq.azul{color:#fff;background:#2F6FE4;border-color:#2F6FE4;}
.pc-partes{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard.arquivada{opacity:.6;}
.pc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pc-num{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.1px;}
.pc-tags{display:inline-flex;gap:3px;}
.pc-dir{display:inline-flex;align-items:center;gap:4px;margin-left:auto;}
.pc-tags i{font-style:normal;font-size:9.5px;font-weight:500;letter-spacing:.3px;color:var(--muted);border:1px solid var(--border2);border-radius:5px;padding:1px 4px;}
.pc-tags i.off{color:#ef4444;border-color:#ef444455;}
.pc-novo{font-size:10px;font-weight:500;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:1px 7px;}
.pc-mais{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;border-radius:6px;}
.pc-mais:hover{color:var(--accent);background:var(--surface);}
.pc-info{font-size:12px;color:var(--muted);line-height:1.4;}
.pc-campo{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:6px;}
.pc-campo>span{font-size:11px;color:var(--faint);}
.pc-inp{width:100%;font:inherit;font-size:13px;line-height:1.4;color:var(--text);background:transparent;border:1px solid transparent;border-radius:7px;padding:2px 6px;resize:none;overflow:hidden;}
.pc-inp:hover{border-color:var(--border);}
.pc-inp:focus{outline:none;border-color:var(--accent);background:var(--input);}
.pc-inp::placeholder{color:var(--faint);}
.pc-sel{font:inherit;font-size:12.5px;font-weight:500;color:var(--text);background:color-mix(in srgb, var(--c, #a1a1aa) 22%, var(--surface));border:1px solid color-mix(in srgb, var(--c, #a1a1aa) 60%, transparent);border-radius:20px;padding:2px 8px;max-width:100%;justify-self:start;}
.pc-nejul{font-size:12.5px;line-height:1.45;background:color-mix(in srgb, #f97316 12%, var(--surface));border:1px solid #f9731655;border-radius:9px;padding:8px 10px;color:var(--text);}
.pc-nejul-b{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.copybtn{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:7px;font-size:11.5px;padding:1px 7px;line-height:1.6;white-space:nowrap;}
.copybtn:hover{color:var(--accent);border-color:var(--accent);}
.copybtn.ok{color:#10b981;border-color:#10b981;}
.minibtn{background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:8px;font-size:12px;font-weight:500;padding:5px 10px;}
.minibtn.forte{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.sitchip{font-size:11px;font-weight:500;color:var(--text);background:color-mix(in srgb, var(--c) 22%, transparent);border:1px solid color-mix(in srgb, var(--c) 55%, transparent);border-radius:20px;padding:0 8px;white-space:nowrap;}
.avisos{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:14px;}
.avisos-h{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.aviso{border-top:1px solid var(--border);padding:9px 0;}
.aviso-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.aviso-txt{font-size:13px;color:var(--text);margin:4px 0 6px;line-height:1.45;}
.aviso-b{display:flex;gap:6px;flex-wrap:wrap;}
.aviso.t-saiu .aviso-txt,.aviso.t-devolvido .aviso-txt{color:var(--accent);font-weight:500;}
.pecard{width:520px;}
.pe-info{font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:12px;}
.pe-nejul{font-size:12.5px;color:var(--muted);margin:4px 0 10px;}
.pe-nejul summary{cursor:pointer;color:var(--accent);}
.pe-nejul div{white-space:pre-wrap;line-height:1.5;margin-top:6px;max-height:200px;overflow:auto;background:var(--surface2);border-radius:8px;padding:8px;}
.fortesw input{width:17px;height:17px;accent-color:var(--accent);}
/* filas (para sentenciar / despachar) */
.filarow{display:flex;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.filarow:hover{background:var(--surface);}
.fila-dias{flex:none;width:64px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;text-align:center;}
.fila-dias b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;}
.fila-dias span{font-size:9.5px;color:var(--muted);line-height:1.2;}
.fila-dias.medio{border-color:#f59e0b;background:color-mix(in srgb, #f59e0b 14%, var(--surface));}
.fila-dias.alto{border-color:#ef4444;background:color-mix(in srgb, #ef4444 16%, var(--surface));}
.fila-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.fila-pend{font-size:13px;color:var(--text);}
.fila-pend b{font-weight:500;color:var(--accent);}
.fila-obs{font-size:12.5px;color:var(--muted);line-height:1.45;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
/* entregues */
.entmes{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:14px;}
.entmes-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;}
.entmes-h span{font-size:12.5px;color:var(--muted);}
.entmes-tot{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px;}
.entmes-tot b{color:var(--text);font-weight:500;}
.entsub{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 4px;}
.entrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.ent-main{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer;}
.ent-data{font-size:11.5px;color:var(--faint);}
.ent-c{font:inherit;font-size:12px;background:var(--input);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:3px 5px;}
.ent-val{font-size:13px;font-variant-numeric:tabular-nums;min-width:86px;text-align:right;}
.ent-ass{background:var(--surface);border:1px solid var(--border2);color:var(--muted);border-radius:20px;font-size:11.5px;font-weight:500;padding:3px 10px;}
.ent-ass.on{color:#10b981;border-color:#10b98188;}
/* audiências */
.audrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);border-left:3px solid #2F6FE4;margin-bottom:6px;cursor:pointer;}
.audrow:hover{background:var(--surface);}
.audrow.conflito{border-left-color:#f59e0b;}
.aud-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.aud-top{display:flex;align-items:center;gap:6px;}
.aud-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.aud-fonte{font-size:10.5px;color:var(--faint);}
.btnaud{display:block;width:100%;background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:500;margin:0 0 16px;}
.btnaud:hover{filter:brightness(1.05);}
.aud-conf{font-size:10.5px;font-weight:500;color:#231a05;background:#f59e0b;border-radius:20px;padding:0 7px;}
/* colar painéis */
.colar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:1000px){ .colar-grid{grid-template-columns:1fr;} }
.colar-cx{display:flex;flex-direction:column;}

<!-- ================= Sincronizacao entre aparelhos (cofre online) ================= -->
<script>
(function(){
  var SUPA = window.__SUPA || { url:"", key:"" };
  var PHRASE_KEY = 'agenda-sync-space';
  var ID_KEY     = 'agenda-sync-id';
  var TS_KEY     = 'agenda-sync-ts';
  var PREFIX     = 'agenda-';
  // só a agenda sincroniza; o que era do painel de trabalho não sai mais do aparelho
  function isProg(k){ return k==='agenda-events' || k==='agenda-types' || k==='agenda-types-seeded'; }
  function jget(k){ try{ return JSON.parse(localStorage.getItem(k) || '{}'); }catch(e){ return {}; } }
  function jset(k,o){ try{ localStorage.setItem(k, JSON.stringify(o)); }catch(e){} }
  function spaceId(){ try{ return localStorage.getItem(ID_KEY) || ''; }catch(e){ return ''; } }
  function configured(){ return !!(SUPA.url && SUPA.key); }
  function on(){ return configured() && !!spaceId(); }
  function sha(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode('agendanad::'+s))
      .then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join(''); });
  }
  function headers(extra){ var h = { apikey:SUPA.key, Authorization:'Bearer '+SUPA.key, 'x-space':spaceId() }; if(extra) for(var x in extra) h[x]=extra[x]; return h; }

  var applying=false, lastWrite=0, pushTimer=null, dirty={};
  window.__syncOnWrite = function(k){
    if (applying) return;
    lastWrite = Date.now();
    if (!isProg(k) || !on()) return;
    var ts = jget(TS_KEY); ts[k]=Date.now(); jset(TS_KEY, ts);
    dirty[k]=true;
    clearTimeout(pushTimer); pushTimer=setTimeout(pushDirty, 1200);
  };
  function pushDirty(){
    if (!on()) return;
    var ks=Object.keys(dirty); if(!ks.length) return;
    var id=spaceId(), ts=jget(TS_KEY), rows=[];
    ks.forEach(function(k){ rows.push({ space:id, k:k, v:localStorage.getItem(k), ts:ts[k]||Date.now() }); });
    dirty={};
    fetch(SUPA.url+'/rest/v1/kv', { method:'POST', headers:headers({ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' }), body:JSON.stringify(rows) })
      .then(function(r){ if(!r.ok){ ks.forEach(function(k){ dirty[k]=true; }); } })
      .catch(function(){ ks.forEach(function(k){ dirty[k]=true; }); });
  }
  function pushAll(){
    if(!on()) return;
    var ts=jget(TS_KEY), touched=false;
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(isProg(k)){ if(ts[k]==null){ ts[k]=Date.now(); touched=true; } dirty[k]=true; } }
    if(touched) jset(TS_KEY, ts);
    pushDirty();
  }
  function pull(cb){
    if(!on()){ if(cb) cb(false); return; }
    fetch(SUPA.url+'/rest/v1/kv?select=k,v,ts&space=eq.'+encodeURIComponent(spaceId()), { headers:headers() })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var ts=jget(TS_KEY), changed=false; applying=true;
        rows.forEach(function(row){
          if(!isProg(row.k)) return;
          if(row.ts > (ts[row.k]||0)){
            var cur=localStorage.getItem(row.k); var val=row.v==null?'':row.v;
            if(cur!==val){ localStorage.setItem(row.k, val); changed=true; }
            ts[row.k]=row.ts;
          }
        });
        applying=false; jset(TS_KEY, ts);
        if(changed){ try{ window.dispatchEvent(new Event('agenda-pulled')); }catch(e){} }
        if(cb) cb(changed);
      })
      .catch(function(){ applying=false; if(cb) cb(false); });
  }

  window.AgendaSync = {
    configured: configured,
    isOn: on,
    phrase: function(){ try{ return localStorage.getItem(PHRASE_KEY) || ''; }catch(e){ return ''; } },
    enable: function(phrase, done){
      var p=(phrase||'').trim();
      if(!p || !configured()){ if(done) done(false); return; }
      sha(p).then(function(id){ localStorage.setItem(PHRASE_KEY, p); localStorage.setItem(ID_KEY, id); pull(function(){ pushAll(); if(done) done(true); }); })
        .catch(function(){ if(done) done(false); });
    },
    disable: function(){ try{ localStorage.removeItem(ID_KEY); }catch(e){} }
  };

  if(on()){
    pull();
    setInterval(function(){ if(document.visibilityState==='visible') pull(); }, 15000);
    window.addEventListener('focus', function(){ pull(); });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pull(); });
  }
})();
</script>
</body>
